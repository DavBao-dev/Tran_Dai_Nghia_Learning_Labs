    for (const [g, l] of groups) {
      s += `<optgroup label="${esc(g)}">` + SAMPLES.filter(x => x.label === l).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('') + '</optgroup>';
    }
    return s + '<option value="custom" disabled>✎ Ảnh tự vẽ (đã chỉnh sửa)</option>';
  }
  function drawPreview() {
    const cv = prev, d = cv.getContext('2d'), n = 8, s = cv.width / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { d.fillStyle = rgbStr(imgColor(State.img[i][j])); d.fillRect(j * s, i * s, s, s); }
    d.strokeStyle = COL.line || '#ccc'; d.lineWidth = 1; d.strokeRect(0.5, 0.5, cv.width - 1, cv.height - 1);
  }
  function syncInput() {
    sel.value = State.sampleId;
    drawPreview();
    const L = State.label, s = State.sample();
    labelChip.innerHTML = L == null ? `<span class="muted">Nhãn đúng: ${s ? 'không thuộc 3 lớp' : 'chưa gán'}</span>` : `Nhãn đúng: <b>${CLASSES[L].vi}</b>`;
  }
  function syncRun(ev) {
    const R = State.run, rec = State.rec();
    runBtn.innerHTML = R.playing ? '⏸ Tạm dừng' : (R.active ? '▶ Chạy tiếp' : '▶ Chạy toàn mạng');
    runBtn.setAttribute('aria-label', R.playing ? 'Tạm dừng Forward Pass' : 'Chạy toàn mạng (Forward Pass)');
    let msg;
    if (R.active) {
      const k = R.rec.done, b = BLOCKS[k];
      msg = `<b>Đang chạy Forward Pass</b> · lớp ${k + 1}/${ORDER.length}: <b class="c-${b.col}">${esc(b.name)}</b> vừa tính xong → output ${HT.shape(b.outShape)}. ${R.playing ? '' : '<span class="muted">(đang tạm dừng — bấm ▶ hoặc → Từng lớp)</span>'}`;
    } else {
      const k = rec.out.pred, p = rec.out.softmax[k], L = State.label;
      const verdict = L == null ? '<span class="muted">ảnh này không có nhãn đúng trong 3 lớp</span>' : (L === k ? `<span class="c-ok">✓ khớp nhãn đúng (${CLASSES[L].vi})</span>` : `<span class="c-bad">✗ khác nhãn đúng (${CLASSES[L].vi})</span>`);
      msg = (ev && ev.phase === 'done' ? `<b class="c-ok">✓ Forward Pass hoàn tất.</b> ${ev.same ? 'Kết quả lượt chạy trùng khớp với phép tính tức thời. ' : ''}` : '') +
        `Dự đoán: <b class="c-pred">${CLASSES[k].vi}</b> (lớp số ${k}) với xác suất Softmax <b>${pct(p)}</b> — ${verdict}.`;
    }
    statusEl.innerHTML = msg;
    renderShapes();
  }
  function renderShapes() {
    const R = State.run, fk = focusKey(shapeBody);
    renderShapeRows(R);
    restoreFocus(shapeBody, fk);
  }
  function renderShapeRows(R) {
    shapeBody.innerHTML = BLOCKS.map(b => {
      const st = !R.active ? '✓' : (b.idx < R.rec.done ? '✓' : b.idx === R.rec.done ? '● vừa tính' : 'chờ');
      const cls = R.active && b.idx === R.rec.done ? 'cur' : (R.active && b.idx > R.rec.done ? 'pending' : '');
      const rec = State.rec(), outS = R.active && b.idx > R.rec.done ? null : Net.shapeOf(b.id, rec), prev = Net.prevOf(b.id);
      const inS = !prev ? null : (R.active && b.idx - 1 > R.rec.done ? null : Net.shapeOf(prev, rec));
      return `<tr class="${cls}${b.id === State.sel ? ' hl' : ''}" data-id="${b.id}" tabindex="0" style="cursor:pointer"><td class="c">${b.idx + 1}</td><td class="l"><b class="c-${b.col}">${esc(b.name)}</b></td><td class="l"><code>${esc(b.torch)}</code></td><td class="c mono">${prev ? (inS ? shapeStr(inS) : '?') : '—'}</td><td class="c mono">${outS ? shapeStr(outS) : '?'}</td><td class="c">${b.params}</td><td class="c">${st}</td></tr>`;
    }).join('') + `<tr><td></td><td class="l" colspan="4"><b>Tổng số tham số học được</b> (chỉ Conv2d và Linear có tham số)</td><td class="c"><b>${Net.paramCount()}</b></td><td></td></tr>`;

  function syncProgress() {

    progTxt.innerHTML = `Đã khám phá <b>${s.items}/${s.total}</b> mục (${s.full}/${s.blocks} khối xem đủ 4 tab)`;

  function init() {

      </div>

    <div class="card" id="region1">
      <div class="rhead"><span class="rnum">1</span><h2>Sơ đồ kiến trúc CNN</h2><span class="badge net">dữ liệu thật của mạng</span><span class="small muted">Mọi khối hiển thị tensor của <b>cùng một</b> lần Forward Pass.</span></div>
      <div class="r1ctl">
        <div class="row inrow">

          <button type="button" class="prevbtn" id="exPrevBtn" title="Mở khối Input để xem / vẽ ảnh" aria-label="Mở khối Input để vẽ ảnh"><canvas id="exPrev" width="48" height="48"></canvas></button>
          <button type="button" class="btn sm" id="exDraw">✎ Vẽ / sửa ảnh</button>

        <div class="row runrow">

/* ===================== 12-panel.js ===================== */
/* =====================================================================
   12-panel.js — Khu vực 2: chi tiết khối đang chọn với 4 tab
   (Kiến thức · Mô phỏng tương tác · PyTorch · Tự kiểm tra).
   Nội dung từng khối đăng ký qua Panel.def(id, {know, sim, torch, quiz}).
   ===================================================================== */
const SimMem = {};          /* trạng thái riêng của từng mô phỏng (bước đang xem, kênh, chế độ) — giữ khi vẽ lại */
const Panel = (() => {
  const DEF = {};
  let host = null, tabsApi = null, cur = null, wrap = null;
  const def = (id, o) => { DEF[id] = o; };

  function header(b) {
    const i = b.idx;
    return `<div class="rhead"><span class="rnum">2</span><h2>Chi tiết lớp đang chọn</h2><span class="spacer"></span>
      <button type="button" class="btn sm" data-nav="-1" ${i === 0 ? 'disabled' : ''} aria-label="Khối trước">◀ ${i > 0 ? esc(BLOCKS[i - 1].name.replace(' → Logits', '')) : ''}</button>
      <button type="button" class="btn sm" data-nav="1" ${i === ORDER.length - 1 ? 'disabled' : ''} aria-label="Khối sau">${i < ORDER.length - 1 ? esc(BLOCKS[i + 1].name.replace(' → Logits', '')) : ''} ▶</button></div>
      <div class="bhead">
        <div class="bname c-${b.col}">${esc(b.name)} <span class="bvi">— ${esc(b.vi)}</span></div>
        <div class="row small">
          <code class="decl">${esc(b.torch)}</code>
          <span>vào ${HT.shape(b.inShape || ['—'])} → ra ${HT.shape(b.outShape)}</span>
          <span class="muted">tham số học được: <b>${b.params}</b></span>
        </div>
      </div>`;
  }
  function render() {
    Player.pauseAll();
    const fk = focusKey(host);
    const b = BLOCK[State.sel]; cur = b.id;
    host.innerHTML = header(b);
    host.querySelectorAll('[data-nav]').forEach(x => x.addEventListener('click', () => {
      const id = ORDER[clamp(b.idx + +x.dataset.nav, 0, ORDER.length - 1)]; State.select(id);
    }));
    wrap = el('div', { class: 'ptabs' });
    host.append(wrap);
    const tab = (id, label) => ({ id, label, render: h => renderTab(id, h) });
    tabsApi = makeTabs(wrap, [tab('know', '📘 Kiến thức'), tab('sim', '▶ Mô phỏng tương tác'), tab('torch', '🐍 PyTorch'), tab('quiz', '✅ Tự kiểm tra')], {
      label: 'Các tab của khối ' + b.name, initial: State.tab,
      onSelect: id => { State.tab = id; Progress.seeTab(cur, id); syncSeen(); }
    });
    tabsApi._av = State.avail(cur);
    syncSeen();
    restoreFocus(host, fk);
  }
  function syncSeen() { if (!tabsApi) return; const s = Progress.d.seen[cur] || {}; for (const t of TABS) tabsApi.markSeen(t, !!s[t]); }
  function pendingNote(h) {
    const R = State.run, b = BLOCK[cur];
    h.innerHTML = `<div class="alert warn"><b>⏳ ${esc(b.name)} chưa được tính trong lượt chạy hiện tại.</b><br>Forward Pass đang dừng ở lớp ${R.rec.done + 1}/${ORDER.length} (<b>${esc(BLOCKS[R.rec.done].name)}</b>). Mỗi lớp chỉ có dữ liệu sau khi lớp trước nó đã tính xong.</div>
      <div class="row"><button type="button" class="btn primary" data-a="step">→ Tính lớp kế tiếp</button><button type="button" class="btn" data-a="fin">Tính hết các lớp còn lại ⏭</button></div>`;
    h.querySelector('[data-a=step]').onclick = () => Runner.stepOnce();
    h.querySelector('[data-a=fin]').onclick = () => Runner.finish();
  }
  function renderTab(tab, h) {
    const d = DEF[cur];
    if (!d || !d[tab]) { h.innerHTML = `<div class="alert bad">Thiếu nội dung cho ${esc(cur)} / ${tab}.</div>`; return; }
    if (tab === 'sim' && !State.avail(cur)) { pendingNote(h); return; }
    if (tab === 'quiz') { renderQuiz(d, h); return; }
    d[tab](h, { rec: State.avail(cur) ? State.rec() : State.fp, id: cur });
  }
  function renderQuiz(d, h) {
    const qs = d.quiz(State.fp);
    h.append(el('p', { class: 'small muted', html: 'Các câu hỏi bám sát khối vừa học; câu có nhãn <span class="badge net">dữ liệu thật</span> dùng số của ảnh đang chọn nên sẽ đổi khi bạn đổi ảnh. Trả lời xong, đọc phần giải thích để biết <b>vì sao</b> đúng hoặc sai.' }));
    qs.forEach((q, k) => h.append(QKit.render(q, { num: k + 1, retry: true, onResult: ok => Progress.quizDone(cur, q.id, ok) })));
  }
  /* Đổi ảnh → vẽ lại tab đang mở. Riêng khi đang VẼ trong bảng vẽ của khối Input, không dựng lại bảng vẽ
     (sẽ làm đứt nét vẽ); bảng vẽ và các phần phụ thuộc tự cập nhật. */
  const refreshData = debounce(ev => {
    if (!tabsApi) return;
    if (ev && ev.from === 'paint' && cur === 'input' && tabsApi.cur === 'sim') { tabsApi.dirtyOthers(); return; }
    tabsApi.dirtyAll();
  }, 200);
  function init(h) {
    host = h;
    render();
    Bus.on('select', ({ changed, tab }) => { if (changed || !tabsApi) render(); else if (tab && tabsApi.cur !== tab) tabsApi.select(tab); });
    Bus.on('image', refreshData);
    Bus.on('label', () => { if (tabsApi && (cur === 'pred' || (cur === 'input' && tabsApi.cur !== 'sim'))) tabsApi.rerender(tabsApi.cur); });
    Bus.on('run', ev => {
      if (!tabsApi) return;
      if (['step', 'start', 'reset', 'done', 'abort'].includes(ev.phase)) {
        /* chỉ vẽ lại tab mô phỏng khi trạng thái "đã tính / chưa tính" của khối đang xem thay đổi */
        const av = State.avail(cur);
        if (av !== tabsApi._av || ev.phase === 'done') { tabsApi._av = av; if (tabsApi.cur === 'sim') tabsApi.rerender('sim'); else tabsApi.dirtyAll(); }
      }
    });
    Bus.on('reset', () => { for (const k in SimMem) delete SimMem[k]; render(); });
    Bus.on('progress', syncSeen);
    Bus.on('theme', () => { if (tabsApi) tabsApi.dirtyAll(); });
  }
  return { init, def, rerender: () => tabsApi && tabsApi.dirtyAll(), DEF };
})();

/* ===================== 13-tracker.js ===================== */
/* =====================================================================
   13-tracker.js — Khu vực 3: theo dõi dữ liệu của khối đang chọn.
   Tensor đầu vào, giá trị trung gian, tensor đầu ra (xem từng channel);
   nhấp một ô đầu ra → tô các phần tử đầu vào đã tạo ra nó + phép tính cụ thể
   + vùng tiếp nhận trên ảnh gốc.
   ===================================================================== */
const Tracker = (() => {
  let host = null;
  const mem = {};                     /* {inCh, outCh} theo từng khối */
  const M = id => (mem[id] = mem[id] || { inCh: 'all', outCh: 'all' });

  function chanNames(id) {
    if (id === 'input') return ['ảnh xám'];
    if (['conv1', 'relu1', 'pool1'].includes(id)) return NET.conv1Names;
    if (['conv2', 'relu2', 'pool2'].includes(id)) return NET.conv2Names;
    return [];
  }
  function chanSel(n, val, onCh, aria) {
    if (n <= 1) return null;
    const opts = [['all', 'Tất cả']]; for (let c = 0; c < n; c++) opts.push([String(c), 'kênh ' + c]);
    return segCtl(opts, String(val), v => onCh(v === 'all' ? 'all' : +v), aria);
  }
  /* một hàng các bản đồ (mỗi channel một lưới) */
  function mapsRow(T, o) {
    const row = el('div', { class: 'maps' }), gvs = [];
    const names = o.names || [];
    const mx = o.mode === 'div' ? (TN.maxAbs(T) || 1) : undefined;
    T.forEach((m, c) => {
      if (o.ch !== 'all' && o.ch !== c) { gvs.push(null); return; }
      const g = gridView(m, {
        title: `<span class="c-${o.cls}">kênh ${c}</span>${names[c] ? ` <span class="muted">· ${esc(names[c])}</span>` : ''}`,
        mode: o.mode, maxAbs: mx, pad: o.pad || 0, cls: o.cls, cs: o.cs || (m.length > 4 ? 28 : 34),
        onCell: o.onCell ? (r, q) => o.onCell(c, r, q) : null, aria: `${o.aria || 'tensor'} kênh ${c}`
      });
      row.append(g.el); gvs.push(g);
    });
    return { el: row, gvs };
  }
  const sec = (title, extra) => { const d = el('div', { class: 'tsec' }); d.append(el('div', { class: 'tsh', html: title })); if (extra) d.append(extra); return d; };

  function receptiveBox(id, t) {
    const cells = Net.receptive(id, t.c, t.i, t.j);
    const set = new Set(cells.map(([r, q]) => r * 8 + q));
    const g = gridView(State.fp.img, { mode: 'img', cs: 17, labels: false, showVals: false, aria: 'vùng tiếp nhận trên ảnh gốc' });
    for (let r = 0; r < 8; r++) for (let q = 0; q < 8; q++) if (!set.has(r * 8 + q)) g.cell(r, q).classList.add('dimc'); else g.cell(r, q).classList.add('rf');
    const rs = cells.map(x => x[0]), qs = cells.map(x => x[1]);
    const hh = Math.max(...rs) - Math.min(...rs) + 1, ww = Math.max(...qs) - Math.min(...qs) + 1;
    const box = el('div', { class: 'rfbox' }, g.el, el('div', { class: 'small', html: `Ô được chọn phụ thuộc vào <b>${cells.length}</b> pixel của ảnh gốc (vùng ${hh} × ${ww}). Đây là <b>vùng tiếp nhận</b> (receptive field): càng vào sâu trong mạng, mỗi ô “nhìn thấy” vùng ảnh càng rộng.` }));
    return sec('🔭 Vùng tiếp nhận trên ảnh gốc 8 × 8', box);
  }

  /* ---------- từng loại khối ---------- */
  function vInput(body, rec) {
    const t = State.trace && State.trace.block === 'input' ? State.trace : null;
    const g = gridView(rec.out.input[0], { mode: 'img', cs: 32, cls: 'inp', title: 'x[0, 0, :, :] <span class="muted">— kênh xám duy nhất</span>', onCell: (r, q) => State.setTrace({ block: 'input', c: 0, i: r, j: q }, 'tracker'), aria: 'ảnh đầu vào' });
    body.append(sec(`➡ Tensor đầu vào = đầu ra ${HT.shape([1, 1, 8, 8])}`, el('div', { class: 'scrollx' }, g.el)));
    body.append(el('p', { class: 'small muted', html: 'Khối Input không biến đổi dữ liệu: nó chỉ sắp xếp 64 giá trị pixel thành tensor 4 chiều N × C × H × W. Muốn vẽ ảnh, mở tab <b>Mô phỏng tương tác</b> ở Khu vực 2.' }));
    if (t) {
      g.mark('sel', [[t.i, t.j]]);
      const v = rec.out.input[0][t.i][t.j];
      const r0 = Math.max(0, t.i - 1), r1 = Math.min(7, t.i + 1), c0 = Math.max(0, t.j - 1), c1 = Math.min(7, t.j + 1);
      const n = (r1 - r0 + 1) * (c1 - c0 + 1);
      body.append(sec('🔎 Ô được chọn', el('div', { class: 'calc', html: `x[0, 0, ${t.i}, ${t.j}] = <span class="res">${fv(v)}</span> <span class="lbl">(${v === 0 ? 'nền tối' : v >= 0.99 ? 'nét đậm nhất' : 'mức xám trung gian'})</span><br><span class="small">Pixel này nằm trong cửa sổ 3 × 3 của <b>${n}</b> ô đầu ra ở <b>mỗi</b> kênh của Conv2d #1 (hàng ${r0}–${r1}, cột ${c0}–${c1}), nên nó ảnh hưởng tới ${n} × 2 = ${2 * n} giá trị của lớp kế tiếp.</span>` })));
    } else body.append(hint());
  }

  function vConv(body, rec, id) {
    const b = BLOCK[id], prev = Net.prevOf(id), X = rec.out[prev], Y = rec.out[id], m = M(id);
    const W = id === 'conv1' ? NET.W1 : NET.W2, B = id === 'conv1' ? NET.b1 : NET.b2;
    const Cin = X.length, Cout = Y.length;
    const t = State.trace && State.trace.block === id ? State.trace : null;
    const inNames = chanNames(prev);
    /* đầu vào (có viền đệm số 0 vì padding = 1) */
    const inSec = sec(`➡ Tensor đầu vào ${HT.shape([1, Cin, X[0].length, X[0].length])} <span class="muted small">(output của ${esc(BLOCK[prev].name)}; viền gạch chéo = padding 0)</span>`);
    const sIn = chanSel(Cin, m.inCh, v => { m.inCh = v; render(); }, 'Chọn kênh đầu vào');
    if (sIn) inSec.append(sIn);
    const inRow = mapsRow(X, { ch: m.inCh, pad: 1, mode: prev === 'input' ? 'img' : 'div', cls: prev === 'input' ? 'inp' : 'fm', names: inNames, aria: 'đầu vào', cs: X[0].length > 4 ? 28 : 34 });
    inSec.append(el('div', { class: 'scrollx' }, inRow.el)); body.append(inSec);
    /* trung gian: kernel + bias của kênh ra đang xét */
    const o = t ? t.c : (m.outCh === 'all' ? 0 : m.outCh);
    const kSec = sec(`⚙ Trọng số cho kênh ra ${o}: W[${o}] ${HT.shape([Cin, 3, 3])} và bias b[${o}] = <b class="c-bias">${fv(B[o])}</b>`);
    const kr = el('div', { class: 'maps' });
    for (let c = 0; c < Cin; c++) kr.append(gridView(W[o][c], { title: `<span class="c-ker">W[${o}, ${c}]</span> <span class="muted">· nhân với kênh vào ${c}</span>`, mode: 'div', cs: 34, cls: 'ker', aria: `kernel ${o} ${c}` }).el);
    kSec.append(kr);
    if (!t) kSec.append(el('div', { class: 'tiny muted', text: 'Đang hiện kernel của kênh ra ' + o + '. Nhấp một ô ở tensor đầu ra để xem kernel của kênh đó.' }));
    body.append(kSec);
    /* đầu ra */
    const outSec = sec(`⬅ Tensor đầu ra ${HT.shape([1, Cout, Y[0].length, Y[0].length])} <span class="muted small">— nhấp một ô</span>`);
    const sOut = chanSel(Cout, m.outCh, v => { m.outCh = v; render(); }, 'Chọn kênh đầu ra');
    if (sOut) outSec.append(sOut);
    const outRow = mapsRow(Y, { ch: m.outCh, mode: 'div', cls: 'fm', names: chanNames(id), aria: 'đầu ra', onCell: (c, r, q) => State.setTrace({ block: id, c, i: r, j: q }, 'tracker'), cs: Y[0].length > 4 ? 28 : 34 });
    outSec.append(el('div', { class: 'scrollx' }, outRow.el)); body.append(outSec);
    if (!t) { body.append(hint()); return; }
    const g = outRow.gvs[t.c]; if (g) g.mark('sel', [[t.i, t.j]]);
    inRow.gvs.forEach(gv => { if (!gv) return; gv.win(t.i - 1, t.j - 1, 3, 3); const L = []; for (let u = -1; u <= 1; u++) for (let v = -1; v <= 1; v++) L.push([t.i + u, t.j + v]); gv.mark('src', L); });
    /* phép tính chi tiết */
    const T = TN.convTerms(X, W, B, 1, 1, t.c, t.i, t.j);
    const det = el('div', { class: 'convdet' });
    for (let c = 0; c < Cin; c++) {
      const win = [0, 1, 2].map(u => [0, 1, 2].map(v => T.terms.find(x => x.c === c && x.u === u && x.v === v).x));
      const prod = [0, 1, 2].map(u => [0, 1, 2].map(v => T.terms.find(x => x.c === c && x.u === u && x.v === v).prod));
      det.append(el('div', { class: 'mrow' },
        gridView(win, { title: `cửa sổ kênh ${c}`, mode: prev === 'input' ? 'img' : 'div', maxAbs: TN.maxAbs(X) || 1, cs: 34, labels: false, cls: 'inp' }).el,
        el('span', { class: 'op', text: '⊙' }),
        gridView(W[t.c][c], { title: `W[${t.c}, ${c}]`, mode: 'div', cs: 34, labels: false, cls: 'ker' }).el,
        el('span', { class: 'op', text: '=' }),
        gridView(prod, { title: 'tích từng cặp', mode: 'div', cs: 38, labels: false, cls: 'fm' }).el,
        el('span', { class: 'op', html: `→ Σ = <b>${fv(T.part[c])}</b>` })));
    }
    const sumTxt = T.part.map((s, c) => `<span title="tổng kênh ${c}">${fpar(s)}</span>`).join(' + ');
    det.append(el('div', { class: 'calc', html: `y[0, ${t.c}, ${t.i}, ${t.j}] = ${Cin > 1 ? '(tổng kênh 0) + (tổng kênh 1) + bias' : 'tổng 9 tích + bias'}<br>= ${sumTxt} + <span class="c-bias">${fpar(T.bias)}</span> = <span class="res">${fv(T.y)}</span>` }));
    if (Cin > 1) det.append(el('p', { class: 'small', html: `Một kênh đầu ra <b>cộng dồn qua mọi kênh đầu vào</b>: mỗi kênh vào có lát kernel riêng W[${t.c}, c], các tổng riêng được cộng lại rồi mới cộng bias.` }));
    body.append(sec(`🔎 Ô được chọn: y[0, ${t.c}, ${t.i}, ${t.j}] = ${fv(T.y)}`, det));
    body.append(receptiveBox(id, t));
  }

  function vRelu(body, rec, id) {
    const prev = Net.prevOf(id), X = rec.out[prev], Y = rec.out[id], m = M(id), n = X.length;
    const t = State.trace && State.trace.block === id ? State.trace : null;
    const s1 = sec(`➡ Đầu vào ${HT.shape([1, n, X[0].length, X[0].length])} <span class="muted small">(output ${esc(BLOCK[prev].name)})</span>`);
    const sc = chanSel(n, m.outCh, v => { m.outCh = v; render(); }, 'Chọn kênh'); if (sc) s1.append(sc);
    const inRow = mapsRow(X, { ch: m.outCh, mode: 'div', cls: 'fm', names: chanNames(id), aria: 'trước ReLU' });
    inRow.gvs.forEach((g, c) => { if (!g) return; const L = []; X[c].forEach((r, i) => r.forEach((v, j) => { if (v < 0) L.push([i, j]); })); g.mark('negc', L); });
    s1.append(el('div', { class: 'scrollx' }, inRow.el)); body.append(s1);
    const s2 = sec(`⬅ Đầu ra sau ReLU ${HT.shape([1, n, Y[0].length, Y[0].length])} <span class="muted small">— ô có gạch là số âm đã thành 0</span>`);
    const outRow = mapsRow(Y, { ch: m.outCh, mode: 'div', cls: 'relu', names: chanNames(id), aria: 'sau ReLU', onCell: (c, r, q) => State.setTrace({ block: id, c, i: r, j: q }, 'tracker') });
    outRow.gvs.forEach((g, c) => { if (!g) return; const L = []; X[c].forEach((r, i) => r.forEach((v, j) => { if (v < 0) L.push([i, j]); })); g.mark('zeroed', L); });
    s2.append(el('div', { class: 'scrollx' }, outRow.el)); body.append(s2);
    const neg = TN.count(X, v => v < 0), zer = TN.count(X, v => v === 0), pos = TN.count(X, v => v > 0);
    body.append(el('p', { class: 'small', html: `Thống kê toàn tensor: <b>${neg}</b> phần tử âm → 0, <b>${zer}</b> phần tử bằng 0 giữ nguyên, <b>${pos}</b> phần tử dương giữ nguyên. Shape không đổi.` }));
    if (!t) { body.append(hint()); return; }
    const v = X[t.c][t.i][t.j];
    if (inRow.gvs[t.c]) inRow.gvs[t.c].mark('src', [[t.i, t.j]]);
    if (outRow.gvs[t.c]) outRow.gvs[t.c].mark('sel', [[t.i, t.j]]);
    body.append(sec('🔎 Ô được chọn', el('div', { class: 'calc', html: `ReLU(x[0, ${t.c}, ${t.i}, ${t.j}]) = max(0, ${fv(v)}) = <span class="res">${fv(Math.max(0, v))}</span> <span class="lbl">${v < 0 ? '← số âm bị đưa về 0' : v === 0 ? '← bằng 0, giữ nguyên' : '← số dương giữ nguyên'}</span>` })));
    body.append(receptiveBox(id, t));
  }

  function vPool(body, rec, id) {
    const prev = Net.prevOf(id), X = rec.out[prev], Y = rec.out[id], m = M(id), n = X.length, arg = rec.aux[id];
    const t = State.trace && State.trace.block === id ? State.trace : null;
    const s1 = sec(`➡ Đầu vào ${HT.shape([1, n, X[0].length, X[0].length])} <span class="muted small">(output ${esc(BLOCK[prev].name)})</span>`);
    const sc = chanSel(n, m.outCh, v => { m.outCh = v; render(); }, 'Chọn kênh'); if (sc) s1.append(sc);
    const inRow = mapsRow(X, { ch: m.outCh, mode: 'div', cls: 'relu', names: chanNames(id), aria: 'trước pooling' });
    /* vạch chia các cửa sổ 2×2 */
    inRow.gvs.forEach(g => { if (g) g.el.classList.add('pool2x2'); });
    s1.append(el('div', { class: 'scrollx' }, inRow.el)); body.append(s1);
    const s2 = sec(`⬅ Đầu ra ${HT.shape([1, n, Y[0].length, Y[0].length])} <span class="muted small">— nhấp một ô</span>`);
    const outRow = mapsRow(Y, { ch: m.outCh, mode: 'div', cls: 'pool', names: chanNames(id), aria: 'sau pooling', onCell: (c, r, q) => State.setTrace({ block: id, c, i: r, j: q }, 'tracker') });
    s2.append(el('div', { class: 'scrollx' }, outRow.el)); body.append(s2);
    if (!t) { body.append(hint()); return; }
    const g = inRow.gvs[t.c];
    const win = TN.windowOf(X[t.c], t.i, t.j, 2, 2);
    if (g) { g.win(2 * t.i, 2 * t.j, 2, 2); g.mark('src', win.map(w => [w.r, w.c])); g.mark('max', arg[t.c][t.i][t.j]); }
    if (outRow.gvs[t.c]) outRow.gvs[t.c].mark('sel', [[t.i, t.j]]);
    const mx = Y[t.c][t.i][t.j], avg = win.reduce((s, w) => s + w.v, 0) / 4;
    const nmax = arg[t.c][t.i][t.j].length;
    body.append(sec('🔎 Ô được chọn', el('div', { class: 'calc', html: `y[0, ${t.c}, ${t.i}, ${t.j}] = max(${win.map(w => fv(w.v)).join(', ')}) = <span class="res">${fv(mx)}</span><br><span class="lbl">cửa sổ</span> hàng ${2 * t.i}–${2 * t.i + 1}, cột ${2 * t.j}–${2 * t.j + 1} của kênh ${t.c}${nmax > 1 ? ` · có ${nmax} ô cùng bằng giá trị lớn nhất (★) — kết quả không đổi` : ''}<br><span class="lbl">so sánh</span> Average Pooling sẽ cho (${win.map(w => fpar(w.v)).join(' + ')}) / 4 = ${fv(avg)}` })));
    body.append(receptiveBox(id, t));
  }

  function vFlatten(body, rec) {
    const X = rec.out.pool2, v = rec.out.flatten, map = rec.aux.flatten;
    const t = State.trace && State.trace.block === 'flatten' ? State.trace : null;
    const inRow = mapsRow(X, { ch: 'all', mode: 'div', cls: 'pool', names: NET.conv2Names, aria: 'trước flatten', cs: 40 });
    body.append(sec(`➡ Đầu vào ${HT.shape([1, 4, 2, 2])} <span class="muted small">(4 kênh × 2 × 2 = 16 số)</span>`, el('div', { class: 'scrollx' }, inRow.el)));
    const vg = gridView([v.slice(0, 8), v.slice(8, 16)], { mode: 'div', maxAbs: TN.maxAbs(X) || 1, cls: 'flat', cs: 38, rowLbl: r => (r ? '8–15' : '0–7'), colLbl: c => '+' + c, onCell: (r, q) => State.setTrace({ block: 'flatten', c: 0, i: 0, j: r * 8 + q }, 'tracker'), aria: 'vector sau flatten' });
    body.append(sec(`⬅ Đầu ra ${HT.shape([1, 16])} <span class="muted small">— vector 16 phần tử, xếp thành 2 hàng để dễ nhìn; nhấp một ô</span>`, el('div', { class: 'scrollx' }, vg.el)));
    if (!t) { body.append(hint()); return; }
    const k = t.j, s = map[k];
    vg.mark('sel', [[Math.floor(k / 8), k % 8]]);
    if (inRow.gvs[s.c]) inRow.gvs[s.c].mark('src', [[s.i, s.j]]);
    body.append(sec('🔎 Phần tử được chọn', el('div', { class: 'calc', html: `v[${k}] = x[0, ${s.c}, ${s.i}, ${s.j}] = <span class="res">${fv(v[k])}</span><br><span class="lbl">chỉ số</span> k = c·(H·W) + i·W + j = ${s.c}·4 + ${s.i}·2 + ${s.j} = ${k}` })));
    body.append(receptiveBox('flatten', t));
  }

  function vLinear(body, rec) {
    const x = rec.out.flatten, z = rec.out.linear;
    const t = State.trace && State.trace.block === 'linear' ? State.trace : null;
    const xg = gridView([x.slice(0, 8), x.slice(8, 16)], { mode: 'div', cls: 'flat', cs: 36, rowLbl: r => (r ? '8–15' : '0–7'), colLbl: c => '+' + c, aria: 'vector đầu vào x' });
    body.append(sec(`➡ Đầu vào x ${HT.shape([1, 16])}`, el('div', { class: 'scrollx' }, xg.el)));
    const wg = gridView(NET.WL, { mode: 'div', cls: 'ker', cs: 26, rowLbl: r => 'W' + r, aria: 'ma trận trọng số W', title: '<span class="c-ker">W</span> <span class="muted">shape [3, 16] = [out, in] (hàng k dùng cho logit k)</span>' });
    const bg = gridView([NET.bL], { mode: 'div', cls: 'bias', cs: 34, labels: false, aria: 'bias', title: '<span class="c-bias">b</span> [3]' });
    body.append(sec('⚙ Trọng số và bias', el('div', { class: 'col' }, el('div', { class: 'scrollx' }, wg.el), bg.el)));
    const zg = gridView([z], { mode: 'div', cls: 'logit', cs: 52, labels: true, rowLbl: () => 'z', colLbl: c => CLASSES[c].vi, onCell: (r, q) => State.setTrace({ block: 'linear', c: 0, i: 0, j: q }, 'tracker'), aria: 'logits' });
    body.append(sec(`⬅ Đầu ra: logits z ${HT.shape([1, 3])} <span class="muted small">— nhấp một logit</span>`, zg.el));
    if (!t) { body.append(hint()); return; }
    const k = t.j;
    zg.mark('sel', [[0, k]]);
    wg.mark('src', Array.from({ length: 16 }, (_, i) => [k, i]));
    const terms = x.map((xi, i) => ({ i, xi, w: NET.WL[k][i], p: xi * NET.WL[k][i] }));
    const nz = terms.filter(q => q.xi !== 0 && q.w !== 0);
    xg.mark('src', nz.map(q => [Math.floor(q.i / 8), q.i % 8]));
    const sumNZ = nz.reduce((s, q) => s + q.p, 0);
    body.append(sec(`🔎 Logit z${k} (${CLASSES[k].vi})`, el('div', { class: 'calc', html:
      `z<sub>${k}</sub> = Σ<sub>i=0..15</sub> W[${k}, i]·x<sub>i</sub> + b<sub>${k}</sub><br>` +
      (nz.length ? `= ${nz.map(q => `${fpar(q.w)}·${fpar(q.xi)}`).join(' + ')} + ${fpar(NET.bL[k])}` : `= 0 (mọi tích đều bằng 0) + ${fpar(NET.bL[k])}`) +
      `<br>= ${fv(sumNZ)} + ${fpar(NET.bL[k])} = <span class="res">${fv(z[k])}</span><br><span class="lbl">ghi chú</span> ${16 - nz.length} tích còn lại bằng 0 (vì x<sub>i</sub> = 0 hoặc W[${k}, i] = 0) nên không ghi ra.` })));
    body.append(receptiveBox('linear', t));
  }

  function vSoftmax(body, rec) {
    const z = rec.out.linear, S = rec.aux.softmax, p = rec.out.softmax;
    const t = State.trace && State.trace.block === 'softmax' ? State.trace : null;
    const tb = el('div', { class: 'tablewrap' });
    tb.innerHTML = `<table class="data"><thead><tr><th class="l">Lớp k</th><th>logit z<sub>k</sub></th><th>z<sub>k</sub> − max</th><th>e<sup>z<sub>k</sub> − max</sup></th><th>p<sub>k</sub> = e/Σ</th></tr></thead><tbody>${[0, 1, 2].map(k => `<tr class="${t && t.j === k ? 'hl' : ''}" data-k="${k}" tabindex="0" style="cursor:pointer"><td class="l">${k} · ${CLASSES[k].vi}</td><td>${fx(z[k])}</td><td>${fx(S.sh[k])}</td><td>${fsci(S.ex[k], 6)}</td><td><b>${fsci(p[k], 4)}</b></td></tr>`).join('')}<tr><td class="l">Tổng</td><td></td><td></td><td>Σ = ${fx(S.sum, 6)}</td><td><b>${fx(TN.sum(p))}</b></td></tr></tbody></table>`;
    tb.querySelectorAll('tr[data-k]').forEach(tr => { const f = () => State.setTrace({ block: 'softmax', c: 0, i: 0, j: +tr.dataset.k }, 'tracker'); tr.addEventListener('click', f); tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }); });
    body.append(sec(`➡ Logits ${HT.shape([1, 3])} → trung gian → ⬅ xác suất ${HT.shape([1, 3])} <span class="muted small">— nhấp một hàng</span>`, tb));
    body.append(barsEl(p));
    if (!t) { body.append(hint()); return; }
    const k = t.j;
    body.append(sec(`🔎 Xác suất lớp ${k} (${CLASSES[k].vi})`, el('div', { class: 'calc', html: `m = max(z) = ${fv(S.m)}<br>p<sub>${k}</sub> = ${HT.frac(`e<sup>${fpar(z[k])} − ${fpar(S.m)}</sup>`, [0, 1, 2].map(j => `e<sup>${fpar(S.sh[j])}</sup>`).join(' + '))} = ${HT.frac(fx(S.ex[k], 6), fx(S.sum, 6))} = <span class="res">${fx(p[k])}</span>` })));
  }
  function barsEl(p, z) {
    const top = TN.argmax(p);
    const d = el('div', { class: 'bars', role: 'img', 'aria-label': 'Biểu đồ xác suất: ' + p.map((v, k) => `${CLASSES[k].vi} ${pct(v)}`).join(', ') });
    p.forEach((v, k) => { d.innerHTML += `<span class="lab${k === top ? ' toplab' : ''}">${CLASSES[k].vi}${k === top ? ' ★' : ''}</span><div class="bar"><i style="width:${(v * 100).toFixed(2)}%"></i></div><span class="num">${pct(v)}</span>`; });
    return d;
  }
  function vPred(body, rec) {
    const z = rec.out.linear, p = rec.out.softmax, k = rec.out.pred, L = State.label;
    body.append(sec(`➡ Đầu vào: xác suất ${HT.shape([1, 3])}`, barsEl(p)));
    body.append(sec(`⬅ Đầu ra: chỉ số lớp ${HT.shape([1])}`, el('div', { class: 'calc', html:
      `argmax(p) = argmax(${p.map(v => fx(v)).join(', ')}) = <span class="res">${k}</span> → <b class="c-pred">${CLASSES[k].vi}</b><br>` +
      `argmax(z) = argmax(${z.map(v => fv(v)).join(', ')}) = ${TN.argmax(z)} <span class="lbl">(cùng kết quả)</span><br>` +
      `<span class="lbl">nhãn đúng</span> ${L == null ? 'không có (ảnh không thuộc 3 lớp hoặc ảnh tự vẽ chưa gán nhãn)' : `${L} → ${CLASSES[L].vi} ${L === k ? '<span class="c-ok">✓ dự đoán đúng</span>' : '<span class="c-bad">✗ dự đoán sai</span>'}`}` })));
    const sorted = [...p].sort((a, b) => b - a);
    if (sorted[0] - sorted[1] < 1e-9) body.append(el('div', { class: 'alert warn small', html: `<b>Hòa điểm!</b> Hai lớp có xác suất bằng nhau tuyệt đối. Khi đó argmax (cả trong JavaScript lẫn <code>torch.argmax</code>) trả về <b>chỉ số nhỏ nhất</b> — ở đây là lớp ${k}. Đây là quy ước, không phải mạng “tin” lớp ${k} hơn.` }));
  }
  const hint = () => el('div', { class: 'hintbox small', html: '👆 Nhấp vào một ô của <b>tensor đầu ra</b> để xem những phần tử đầu vào đã tạo ra giá trị đó (được viền cam) cùng phép tính cụ thể.' });

  function render() {
    if (!host) return;
    const fk = focusKey(host), st = host.scrollTop;
    try { draw(); } finally { host.scrollTop = st; restoreFocus(host, fk); }
  }
  function draw() {
    const id = State.sel, b = BLOCK[id];
    host.innerHTML = '';
    host.append(el('div', { class: 'rhead' }, el('span', { class: 'rnum', text: '3' }), el('h2', { text: 'Theo dõi dữ liệu' }), el('span', { class: 'badge net', text: 'cùng một Forward Pass' })));
    host.append(el('div', { class: 'small', html: `<b class="c-${b.col}">${esc(b.name)}</b> · <code>${esc(b.torch)}</code>` }));
    const body = el('div', { class: 'tbody' }); host.append(body);
    if (!State.avail(id)) { body.append(el('div', { class: 'alert warn', html: `⏳ Khối này <b>chưa được tính</b> trong lượt chạy hiện tại. Dữ liệu sẽ xuất hiện khi Forward Pass đi tới ${esc(b.name)}.` })); return; }
    const rec = State.rec();
    try {
      switch (b.kind) {
        case 'input': vInput(body, rec); break;
        case 'conv': vConv(body, rec, id); break;
        case 'relu': vRelu(body, rec, id); break;
        case 'pool': vPool(body, rec, id); break;
        case 'flatten': vFlatten(body, rec); break;
        case 'linear': vLinear(body, rec); break;
        case 'softmax': vSoftmax(body, rec); break;
        case 'pred': vPred(body, rec); break;
      }
    } catch (e) { console.error(e); body.append(el('div', { class: 'alert bad', text: 'Lỗi hiển thị: ' + e.message })); }
  }
  const renderSoon = debounce(render, 90);
  function init(h) {
    host = h; render();
    Bus.on('select', render); Bus.on('image', renderSoon); Bus.on('trace', render); Bus.on('label', render);
    Bus.on('run', ev => { if (['step', 'start', 'reset', 'done', 'abort'].includes(ev.phase)) render(); });
    Bus.on('theme', render);
    Bus.on('reset', () => { for (const k in mem) delete mem[k]; render(); });
  }
  return { init, render, barsEl, mem };
})();

/* ===================== 14-quiz.js ===================== */
/* =====================================================================
   14-quiz.js — QKit: câu hỏi tương tác (trắc nghiệm / nhập số / nhiều ô số)
   có giải thích vì sao đúng, vì sao sai. Dùng cho tab Tự kiểm tra, bài học, đánh giá.
   q = {id, level: 'NB'|'TH'|'VD', type: 'mcq'|'num'|'nums', live: bool, q: html,
        options: [{t: html, why: html}], answer: index | số | [số], tol, labels: [..] (nums),
        explain: html (lời giải), diagnose(v) -> html (gợi ý lỗi thường gặp cho câu nhập số)}
   ===================================================================== */
const LVL = { NB: 'Nhận biết', TH: 'Thông hiểu', VD: 'Vận dụng' };
const QKit = (() => {
  let uid = 0;
  function render(q, o = {}) {
    const id = 'q' + (++uid);
    const box = el('div', { class: 'q', 'data-qid': q.id || id });
    const head = el('div', { class: 'qh' },
      el('span', { class: 'qn', text: o.num ? `Câu ${o.num}.` : 'Câu hỏi.' }),
      q.level ? el('span', { class: 'lvl ' + q.level, text: LVL[q.level] }) : null,
      q.live ? el('span', { class: 'badge net', text: 'dữ liệu thật' }) : null,
      q.fixed ? el('span', { class: 'badge fixed', text: 'số cố định' }) : null);
    box.append(head, el('div', { class: 'qbody', html: q.q }));
    const fb = el('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
    const ctl = el('div', { class: 'row' });
    const bCheck = el('button', { type: 'button', class: 'btn primary sm', text: o.checkText || 'Kiểm tra' });
    const bRetry = el('button', { type: 'button', class: 'btn sm hidden', text: '↺ Làm lại câu này' });
    let answered = false, getVal, mark;
    /* xáo thứ tự phương án để đáp án đúng không luôn ở cùng một chỗ */
    let OPTS = q.options || [], ANS = q.answer;
    if (q.type === 'mcq' && q.shuffle !== false) {
      const order = OPTS.map((_, k) => k);
      for (let k = order.length - 1; k > 0; k--) { const r = Math.floor(Math.random() * (k + 1)); [order[k], order[r]] = [order[r], order[k]]; }
      OPTS = order.map(k => q.options[k]); ANS = order.indexOf(q.answer);
    }
    if (q.type === 'mcq') {
      const opts = el('div', { class: 'opts', role: 'radiogroup', 'aria-label': 'Các phương án' });
      OPTS.forEach((op, k) => {
        const inp = el('input', { type: 'radio', name: id, value: String(k) });
        opts.append(el('label', {}, inp, el('span', { html: `<b>${'ABCDEF'[k]}.</b> ${op.t}` })));
      });
      box.append(opts);
      getVal = () => { const c = opts.querySelector('input:checked'); return c ? +c.value : null; };
      mark = (v, ok) => {
        $$('label', opts).forEach((lb, k) => { lb.classList.toggle('right', k === ANS); lb.classList.toggle('wrong', k === v && !ok); });
        $$('input', opts).forEach(i => { i.disabled = true; });
        const chosen = OPTS[v], right = OPTS[ANS];
        return (ok ? `<b>✓ Chính xác.</b> ${right.why || ''}` : `<b>✗ Chưa đúng.</b> ${chosen.why ? `Phương án ${'ABCDEF'[v]}: ${chosen.why}` : ''}<div class="solx"><b>Đáp án đúng: ${'ABCDEF'[ANS]}.</b> ${right.why || ''}</div>`);
      };
    } else {
      const n = q.type === 'nums' ? q.answer.length : 1;
      const row = el('div', { class: 'numrow' }), ins = [];
      for (let k = 0; k < n; k++) {
        const inp = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': (q.labels && q.labels[k]) || 'Đáp án' });
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); bCheck.click(); } });
        ins.push(inp);
        row.append(el('label', { class: 'small' }, (q.labels && q.labels[k]) ? el('span', { html: q.labels[k] + ' ' }) : null, inp));
      }
      if (q.unit) row.append(el('span', { class: 'small muted', html: q.unit }));
      box.append(row);
      getVal = () => {
        const vs = ins.map(i => parseNum(i.value));
        if (vs.some(v => !isFinite(v))) return null;
        return n === 1 ? vs[0] : vs;
      };
      mark = (v, ok) => {
        const ans = n === 1 ? [q.answer] : q.answer, vs = n === 1 ? [v] : v, tol = q.tol == null ? 0.011 : q.tol;
        ins.forEach((i, k) => { const good = Math.abs(vs[k] - ans[k]) <= tol; i.classList.toggle('okin', good); i.classList.toggle('badin', !good); i.disabled = true; });
        const dg = !ok && q.diagnose ? q.diagnose(v) : '';
        return (ok ? '<b>✓ Chính xác.</b>' : `<b>✗ Chưa đúng.</b> Đáp án: <b>${ans.map(a => fv(a)).join(' ; ')}</b>. ${dg || ''}`);
      };
    }
    const err = el('div', { class: 'err' });
    ctl.append(bCheck, bRetry);
    box.append(ctl, err, fb);
    bCheck.addEventListener('click', () => {
      if (answered) return;
      const v = getVal();
      if (v == null) { err.textContent = q.type === 'mcq' ? 'Hãy chọn một phương án trước khi kiểm tra.' : 'Hãy nhập số hợp lệ vào mọi ô (dùng dấu chấm thập phân, ví dụ 2.75 hoặc −1.5).'; return; }
      err.textContent = '';
      let ok;
      if (q.type === 'mcq') ok = v === ANS;
      else { const ans = q.type === 'nums' ? q.answer : [q.answer], vs = q.type === 'nums' ? v : [v], tol = q.tol == null ? 0.011 : q.tol; ok = ans.every((a, k) => Math.abs(vs[k] - a) <= tol); }
      answered = true;
      fb.className = 'fb show ' + (ok ? 'ok' : 'no');
      fb.innerHTML = mark(v, ok) + (q.explain ? `<div class="solx"><b>Lời giải:</b> ${q.explain}</div>` : '');
      bCheck.disabled = true;
      if (o.retry !== false) bRetry.classList.remove('hidden');
      box.dataset.result = ok ? 'ok' : 'no';
      if (o.onResult) o.onResult(ok, v);
    });
    bRetry.addEventListener('click', () => {
      const n = render(q, o); box.replaceWith(n); const f = n.querySelector('input'); if (f) f.focus();
    });
    box.reveal = () => { if (!answered) { /* dùng trong bài đánh giá khi nộp bài mà còn câu bỏ trống */ answered = true; fb.className = 'fb show no'; fb.innerHTML = `<b>Chưa trả lời.</b> ${q.type === 'mcq' ? `Đáp án đúng: <b>${'ABCDEF'[ANS]}</b>. ${OPTS[ANS].why || ''}` : `Đáp án: <b>${(Array.isArray(q.answer) ? q.answer : [q.answer]).map(a => fv(a)).join(' ; ')}</b>.`}` + (q.explain ? `<div class="solx"><b>Lời giải:</b> ${q.explain}</div>` : ''); bCheck.disabled = true; $$('input', box).forEach(i => { i.disabled = true; }); box.dataset.result = 'skip'; } };
    box.check = () => bCheck.click();
    box.isAnswered = () => answered;
    return box;
  }
  return { render };
})();

/* ===================== 15-pyhelp.js ===================== */
/* =====================================================================
   15-pyhelp.js — sinh code Python/PyTorch từ dữ liệu thật của trang
   (cùng input, cùng trọng số với JavaScript để đối chiếu).
   ===================================================================== */
const PY = (() => {
  const n = x => (Number.isInteger(x) ? x.toFixed(1) : pyNum(x));   /* luôn có dấu chấm → torch hiểu là số thực */
  /* mảng lồng nhau → literal Python; xuống dòng khi quá dài */
  function arr(a, ind = 0, width = 88) {
    if (!Array.isArray(a)) return n(a);
    if (!a.some(Array.isArray)) return '[' + a.map(n).join(', ') + ']';
    const one = '[' + a.map(x => arr(x, 0, 1e9)).join(', ') + ']';
    if (one.length + ind <= width) return one;
    const pad = ' '.repeat(ind + 1);
    return '[' + a.map((x, k) => (k ? pad : '') + arr(x, ind + 1, width)).join(',\n') + ']';
  }
  const tensor = (a, ind = 0) => `torch.tensor(${arr(a, ind + 13)})`;
  const IMPORTS = `import torch\nimport torch.nn as nn\n\n# JavaScript tính bằng số thực 64-bit; đặt float64 để hai bên khớp từng chữ số.\n# (Thực tế PyTorch hay dùng float32: kết quả chỉ lệch ở khoảng chữ số thứ 7.)\ntorch.set_default_dtype(torch.float64)\n`;
  const imgLiteral = (img, name = 'img') => `${name} = ${arr(img, name.length + 3, 70)}`;
  /* kết quả mong đợi theo đúng định dạng f"{v:.4f}" của Python */
  const f4 = v => v.toFixed(4);
  const shapeT = s => '(' + s.join(', ') + ')';
  const list4 = a => '[' + a.map(f4).join(', ') + ']';
  /* làm tròn 6 chữ số như khi ghi literal Python → kết quả mong đợi tính từ ĐÚNG các số đã ghi vào code */
  const r6 = t => (Array.isArray(t) ? t.map(r6) : (() => { const r = +t.toFixed(6); return r === 0 ? 0 : r; })());
  return { arr, tensor, IMPORTS, imgLiteral, f4, shapeT, list4, r6 };
})();

/* ===================== 16-convsim.js ===================== */
/* =====================================================================
   16-convsim.js — ConvSim: animation tích chập đồng bộ với phép tính thật.
   Cửa sổ kernel trượt trên input (có viền đệm), từng tích x·w, tổng theo từng
   kênh vào, cộng bias, ghi vào đúng ô của feature map. Hai mức chi tiết:
   "từng vị trí" (1 bước = 1 ô đầu ra) và "từng phép nhân" (1 bước = 1 tích).
   ===================================================================== */
class ConvSim {
  /* o = {X:[C][H][W], W:[O][C][k][k], b:[O], s, p, outChs:[...], gran, inMode:'img'|'div', inCls,
          inNames, outNames, key, sync (id khối để đồng bộ Khu vực 3), predict (bool), label, cs, csK, csOut} */
  constructor(host, o) {
    this.o = o;
    this.mem = SimMem[o.key] || (SimMem[o.key] = {});
    if (!this.mem.gran) this.mem.gran = o.gran || 'pos';
    if (this.mem.outSel == null || (this.mem.outSel !== 'all' && !o.outChs.includes(this.mem.outSel))) this.mem.outSel = o.defaultOut != null ? o.defaultOut : 'all';
    this.C = o.X.length; this.H = o.X[0].length; this.Wd = o.X[0][0].length; this.k = o.W[0][0].length;
    this.Y = TN.conv2d(o.X, o.W, o.b, o.s, o.p);
    this.Ho = this.Y[0].length; this.Wo = this.Y[0][0].length;
    this.yMax = TN.maxAbs(this.Y) || 1;
    this.root = el('div', { class: 'convsim' });
    host.append(this.root);
    this.ctl = el('div', { class: 'simtop' });
    this.ctl.append(el('span', { class: 'small muted', text: 'Mức chi tiết:' }),
      segCtl([['pos', 'Từng vị trí', '1 bước = tính xong 1 ô đầu ra'], ['mac', 'Từng phép nhân', '1 bước = 1 phép nhân x·w']], this.mem.gran, v => { this.mem.gran = v; this.rebuildKeep(); }, 'Mức chi tiết của animation'));
    if (o.outChs.length > 1) {
      const opts = [['all', 'Mọi kênh ra']].concat(o.outChs.map(c => [String(c), 'kênh ra ' + c]));
      this.ctl.append(el('span', { class: 'small muted', text: 'Kênh ra:' }), segCtl(opts, String(this.mem.outSel), v => { this.mem.outSel = v === 'all' ? 'all' : +v; this.rebuildKeep(); }, 'Chọn kênh đầu ra để mô phỏng'));
    }
    if (o.predict !== false) {
      const cb = el('input', { type: 'checkbox' }); cb.checked = !!this.mem.predict;
      cb.addEventListener('change', () => { this.mem.predict = cb.checked; this.revealed = false; this.player.go(this.player.i, true); });
      this.ctl.append(el('label', { class: 'switch small' }, cb, '🤔 Tự tính trước khi xem kết quả'));
    }
    this.root.append(this.ctl);
    this.revealed = false;
    this.player = new Player(this.root, {
      label: o.label || 'Animation tích chập', speed: this.mem.speed || 3,
      count: () => this.count(), build: st => this.build(st), render: n => this.render(n), caption: n => this.caption(n),
      onStep: n => { this.mem.step = n; this.syncOut(n); }
    });
    if (this.mem.step) this.player.go(this.mem.step);
    if (o.sync) {
      this._onTrace = ev => {
        if (!this.root.isConnected) { Bus.off('trace', this._onTrace); return; }
        if (!ev || ev.src !== 'tracker' || !ev.t || ev.t.block !== o.sync) return;
        const n = this.stepFor(ev.t.c, ev.t.i, ev.t.j); if (n >= 0) { this.player.pause(); this._noSync = true; this.player.go(n); this._noSync = false; }
      };
      Bus.on('trace', this._onTrace, this.root);
    }
  }
  chans() { return this.mem.outSel === 'all' ? this.o.outChs : [this.mem.outSel]; }
  seq() { if (this._seq && this._seqKey === this.mem.outSel) return this._seq; const L = []; for (const o of this.chans()) for (let i = 0; i < this.Ho; i++) for (let j = 0; j < this.Wo; j++) L.push([o, i, j]); this._seq = L; this._seqKey = this.mem.outSel; return L; }
  per() { return this.mem.gran === 'mac' ? this.C * this.k * this.k + 2 : 1; }
  count() { return 1 + this.seq().length * this.per(); }
  decode(n) {
    if (n <= 0) return { intro: true };
    const m = n - 1, per = this.per(), pos = Math.floor(m / per), r = m % per, T = this.C * this.k * this.k;
    const [o, i, j] = this.seq()[pos];
    if (this.mem.gran !== 'mac') return { pos, o, i, j, phase: 'all', t: T };
    return { pos, o, i, j, phase: r < T ? 'term' : (r === T ? 'bias' : 'write'), t: r };
  }
  stepFor(o, i, j) { const idx = this.seq().findIndex(q => q[0] === o && q[1] === i && q[2] === j); if (idx < 0) return -1; return 1 + idx * this.per() + (this.per() - 1); }
  rebuildKeep() {
    const d = this.decode(this.player.i);
    this._seq = null;
    let n = 0; if (!d.intro) { n = this.stepFor(d.o, d.i, d.j); if (n < 0) n = 0; }
    this.player.rebuild(); this.player.go(n, true);
  }
  syncOut(n) {
    if (!this.o.sync || this._noSync) return;
    const d = this.decode(n); if (d.intro) return;
    State.setTrace({ block: this.o.sync, c: d.o, i: d.i, j: d.j }, 'sim');
  }
  isPending(o, r, c) {
    const L = this.seq(), idx = L.findIndex(q => q[0] === o && q[1] === r && q[2] === c);
    if (idx < 0) return false;                 /* kênh không nằm trong lượt mô phỏng: hiện đầy đủ */
    return idx > this.doneIdx;
  }
  build(st) {
    const o = this.o, k = this.k;
    this._kO = undefined; this._lastN = undefined;
    const csIn = o.cs || (this.H + 2 * o.p > 9 ? 26 : 34);
    this.gIn = []; this.gK = []; this.gOut = {}; this.prodT = []; this.partEl = [];
    /* mỗi kênh vào một hàng: [input kênh c] ⊙ [lát kernel W[o, c]] = [bảng tích] → tổng kênh c */
    const rows = el('div', { class: 'convrows' });
    for (let c = 0; c < this.C; c++) {
      const gi = gridView(o.X[c], { pad: o.p, mode: o.inMode || 'div', maxAbs: o.inMode === 'img' ? undefined : (TN.maxAbs(o.X) || 1), cls: o.inCls || 'inp', cs: csIn, title: `<span class="c-inp">Input</span>${this.C > 1 ? ' kênh ' + c : ''}${o.inNames && o.inNames[c] ? ` <span class="muted">· ${esc(o.inNames[c])}</span>` : ''}${o.p ? ` <span class="muted small">(viền gạch = đệm ${o.p})</span>` : ''}`, aria: `input kênh ${c}` });
      const gk = gridView(o.W[0][c], { mode: 'div', cls: 'ker', cs: o.csK || 36, title: `<span class="c-ker">Kernel</span> W[<span class="kO">0</span>, ${c}]`, aria: `kernel kênh vào ${c}` });
      const t = el('table', { class: 'prodtab', 'aria-label': `bảng tích kênh ${c}` });
      for (let u = 0; u < k; u++) { const tr = el('tr'); for (let v = 0; v < k; v++) tr.append(el('td')); t.append(tr); }
      const part = el('div', { class: 'partsum' });
      this.gIn.push(gi); this.gK.push(gk); this.prodT.push(t); this.partEl.push(part);
      rows.append(el('div', { class: 'convrow' }, gi.el, el('div', { class: 'op', text: '⊙' }), gk.el, el('div', { class: 'op', text: '=' }), el('div', { class: 'simcol' }, el('div', { class: 'small', html: `<b>Tích từng cặp</b>${this.C > 1 ? ' (kênh ' + c + ')' : ''}` }), t, part)));
    }
    st.append(el('div', { class: 'scrollx' }, rows));
    this.biasChip = el('span', { class: 'chip' });
    st.append(el('div', { class: 'row small' }, this.biasChip, el('span', { class: 'formula-mini', html: `Kích thước output: H<sub>out</sub> = ⌊(${this.H} + 2·${o.p} − ${k}) / ${o.s}⌋ + 1 = <b>${this.Ho}</b>, W<sub>out</sub> = ⌊(${this.Wd} + 2·${o.p} − ${k}) / ${o.s}⌋ + 1 = <b>${this.Wo}</b>` })));
    this.sumEl = el('div', { class: 'sumline', 'aria-live': 'polite' });
    st.append(this.sumEl);
    this.predEl = el('div', { class: 'predict hidden' });
    st.append(this.predEl);
    const outs = el('div', { class: 'maps' });
    for (const oc of this.o.outChs) {
      const g = gridView(this.Y[oc], { mode: 'div', maxAbs: this.yMax, cls: 'fm', cs: o.csOut || (this.Ho > 6 ? 28 : 38), title: `<span class="c-fm">Output</span> kênh ${oc}${o.outNames && o.outNames[oc] ? ` <span class="muted">· ${esc(o.outNames[oc])}</span>` : ''}`, pending: (r, c) => this.isPending(oc, r, c), aria: `output kênh ${oc}` });
      this.gOut[oc] = g; outs.append(g.el);
    }
    st.append(el('div', { class: 'small', html: '<b>⬇ Feature map (output)</b> — ô viền xanh là ô đang tính; ô xám chưa tính:' }), el('div', { class: 'scrollx' }, outs));
  }
  terms(o, i, j) { return TN.convTerms(this.o.X, this.o.W, this.o.b, this.o.s, this.o.p, o, i, j); }
  render(n) {
    if (n !== this._lastN) { this.revealed = false; this._lastN = n; }
    const d = this.decode(n), o = this.o, k = this.k;
    if (d.intro) {
      this.doneIdx = -1;
      this.gIn.forEach(g => { g.clear('src', 'cur'); g.hideWin(); });
      for (const oc in this.gOut) { this.gOut[oc].set(this.Y[oc]); this.gOut[oc].clear('cur'); }
      this.setKernel(this.chans()[0]);
      this.prodT.forEach(t => $$('td', t).forEach(td => { td.className = 'off'; td.textContent = '·'; }));
      this.partEl.forEach(pe => { pe.innerHTML = ''; });
      const n1 = this.H + 2 * o.p;
      this.sumEl.innerHTML = `<b>Chuẩn bị.</b> Input ${this.H}×${this.Wd}${o.p ? `, đệm ${o.p} vòng số 0 → ${n1}×${this.Wd + 2 * o.p}` : ' (không đệm)'}. Kernel ${k}×${k} trượt với stride ${o.s} → output ${this.Ho}×${this.Wo} = ${this.Ho * this.Wo} vị trí cho mỗi kênh ra${this.chans().length > 1 ? `, ${this.chans().length} kênh ra → ${this.seq().length} ô cần tính` : ''}. Bấm <b>Sau ▶</b> hoặc <b>▶ Chạy</b>.`;
      this.predEl.classList.add('hidden');
      return;
    }
    const T = this.terms(d.o, d.i, d.j);
    const showRes = d.phase === 'all' || d.phase === 'write';
    const hide = this.mem.predict && showRes && !this.revealed;
    this.doneIdx = showRes ? d.pos : d.pos - 1;
    this.setKernel(d.o);
    /* cửa sổ trên input */
    const r0 = d.i * o.s - o.p, c0 = d.j * o.s - o.p;
    const tIdx = d.phase === 'term' ? d.t : T.terms.length;
    this.gIn.forEach((g, c) => {
      g.clear('src', 'cur'); g.win(r0, c0, k, k);
      const L = []; for (let u = 0; u < k; u++) for (let v = 0; v < k; v++) L.push([r0 + u, c0 + v]);
      g.mark('src', L);
    });
    this.gK.forEach(g => g.clear('cur'));
    if (d.phase === 'term') { const tm = T.terms[d.t]; this.gIn[tm.c].mark('cur', [[tm.r, tm.q]]); this.gK[tm.c].mark('cur', [[tm.u, tm.v]]); }
    /* bảng tích */
    T.terms.forEach((tm, m) => {
      const td = this.prodT[tm.c].rows[tm.u].cells[tm.v];
      if (m > tIdx || (d.phase === 'term' && m > d.t)) { td.className = 'off'; td.innerHTML = '?'; return; }
      td.className = (d.phase === 'term' && m === d.t ? 'on' : '') + (tm.pad ? ' padt' : '');
      td.innerHTML = `${fv(tm.x)}·${fpar(tm.w)}<br><b>${fv(tm.prod)}</b>`;
      td.title = tm.pad ? 'ô đệm: x = 0' : `x[${tm.c}, ${tm.r}, ${tm.q}] · W[${d.o}, ${tm.c}, ${tm.u}, ${tm.v}]`;
    });
    /* tổng riêng của từng kênh vào (cuối mỗi hàng) */
    const nT = this.k * this.k;
    this.partEl.forEach((pe, c) => {
      const doneC = d.phase !== 'term' || d.t >= (c + 1) * nT - 1, started = d.phase !== 'term' || d.t >= c * nT;
      const run = T.terms.slice(c * nT, d.phase === 'term' ? Math.min(d.t + 1, (c + 1) * nT) : (c + 1) * nT).reduce((a, tm) => a + tm.prod, 0);
      pe.classList.toggle('on', d.phase === 'term' && started && !doneC);
      pe.innerHTML = doneC ? `→ Σ${this.C > 1 ? '<sub>kênh ' + c + '</sub>' : ''} = <b>${fv(T.part[c])}</b>` : started ? `→ đang cộng: <b>${fv(run)}</b>` : '→ Σ = ?';
    });
    /* dòng tổng */
    let s = `y[0, ${d.o}, ${d.i}, ${d.j}] = `;
    const groups = [];
    for (let c = 0; c < this.C; c++) {
      const parts = [];
      for (let m = c * nT; m < (c + 1) * nT; m++) {
        const tm = T.terms[m], vis = m < tIdx || (d.phase === 'term' && m <= d.t) || d.phase !== 'term';
        parts.push(`<span class="t${d.phase === 'term' && m === d.t ? ' on' : ''}${vis ? '' : ' off'}">${vis ? fpar(tm.prod) : '□'}</span>`);
      }
      const doneC = d.phase !== 'term' || d.t >= (c + 1) * nT - 1;
      groups.push(this.C > 1 ? `[${parts.join(' + ')}]${doneC ? `<sub>kênh ${c}</sub> = <b>${fpar(T.part[c])}</b>` : ''}` : parts.join(' + '));
    }
    s += groups.join(' + ');
    const biasOn = d.phase === 'bias' || d.phase === 'write' || d.phase === 'all';
    s += ` + <span class="t c-bias${d.phase === 'bias' ? ' on' : ''}${biasOn ? '' : ' off'}">${biasOn ? fpar(T.bias) : 'b'}</span>`;
    if (d.phase === 'term') {
      const run = T.terms.slice(0, d.t + 1).reduce((a, tm) => a + tm.prod, 0);
      s += `<br><span class="small">Tạm tính sau ${d.t + 1}/${T.terms.length} tích: <b>${fv(run)}</b></span>`;
    } else if (d.phase === 'bias') {
      s += `<br><span class="small">Tổng các tích = <b>${fv(T.sum)}</b>; cộng bias ${fpar(T.bias)} → <b>${fv(T.y)}</b></span>`;
    } else {
      s += ` = <span class="res">${hide ? '?' : fv(T.y)}</span>${d.phase === 'write' || d.phase === 'all' ? ` <span class="small muted">→ ghi vào ô (${d.i}, ${d.j}) của output kênh ${d.o}</span>` : ''}`;
    }
    this.sumEl.innerHTML = s;
    /* output */
    for (const oc in this.gOut) { const g = this.gOut[oc]; g.set(this.Y[oc], showRes && +oc === d.o && !hide ? { flash: [[d.i, d.j]] } : {}); g.clear('cur'); }
    const go = this.gOut[d.o];
    if (go) { go.mark('cur', [[d.i, d.j]]); if (hide) { const cell = go.cell(d.i, d.j); cell.textContent = '?'; cell.style.backgroundColor = ''; cell.style.color = ''; } }
    /* ô dự đoán */
    if (this.mem.predict && showRes) this.renderPredict(d, T, hide); else this.predEl.classList.add('hidden');
  }
  setKernel(oc) {
    if (this._kO === oc) return; this._kO = oc;
    this.gK.forEach((g, c) => { g.set(this.o.W[oc][c]); const t = g.el.querySelector('.kO'); if (t) t.textContent = oc; });
    this.biasChip.innerHTML = `<span class="c-bias">bias</span> b[${oc}] = <b>${fv(this.o.b[oc])}</b>`;
  }
  renderPredict(d, T, hide) {
    const p = this.predEl; p.classList.remove('hidden'); p.innerHTML = '';
    if (!hide) { p.innerHTML = `<b>Tự tính trước</b><span class="small">Đáp án ô này: y = ${fv(T.y)}. Sang bước sau để thử ô kế tiếp.</span>`; return; }
    const inp = el('input', { type: 'text', inputmode: 'decimal', 'aria-label': `Dự đoán y[0, ${d.o}, ${d.i}, ${d.j}]`, style: { width: '7em' } });
    const fb = el('div', { class: 'small', 'aria-live': 'polite' });
    const chk = el('button', { type: 'button', class: 'btn sm primary', text: 'Kiểm tra' });
    const show = el('button', { type: 'button', class: 'btn sm', text: 'Hiện đáp án' });
    p.append(el('b', { text: 'Tự tính trước' }), el('div', { class: 'row' }, el('span', { html: `y[0, ${d.o}, ${d.i}, ${d.j}] = ` }), inp, chk, show), fb);
    const reveal = () => { this.revealed = true; const n = this.player.i; this.render(n); };
    show.onclick = reveal;
    const go = () => {
      const v = parseNum(inp.value);
      if (!isFinite(v)) { fb.innerHTML = '<span class="c-bad">⚠ Hãy nhập một số (ví dụ 2.75 hoặc −1.5).</span>'; return; }
      const ok = Math.abs(v - T.y) <= 0.011;
      let why = '';
      if (!ok) {
        const flip = this.flipValue(d);
        if (T.bias !== 0 && Math.abs(v - T.sum) <= 0.011) why = `Bạn đã quên cộng bias b = ${fv(T.bias)}.`;
        else if (Math.abs(v - flip) <= 0.011 && Math.abs(flip - T.y) > 0.011) why = 'Bạn đã lật kernel 180° (tích chập kiểu toán học). <code>nn.Conv2d</code> KHÔNG lật kernel.';
        else if (this.C > 1 && T.part.some(pc => Math.abs(v - (pc + T.bias)) <= 0.011 || Math.abs(v - pc) <= 0.011)) why = 'Bạn mới tính tổng của <b>một</b> kênh vào. Kênh ra phải cộng tổng của <b>mọi</b> kênh vào rồi mới cộng bias.';
        else why = 'Hãy so lại từng tích trong bảng bên dưới (chú ý dấu âm và các ô đệm bằng 0).';
      }
      fb.innerHTML = ok ? `<span class="c-ok">✓ Chính xác: y = ${fv(T.y)}.</span>` : `<span class="c-bad">✗ Chưa đúng (bạn nhập ${fv(v)}, đáp án ${fv(T.y)}).</span> ${why}`;
      this.revealed = true;
      const keep = fb.innerHTML; this.render(this.player.i);
      this.predEl.append(el('div', { class: 'small', html: keep }));
    };
    chk.onclick = go;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });
    setTimeout(() => { if (this.root.isConnected && document.activeElement && document.activeElement.closest && document.activeElement.closest('.player') === this.player.root) inp.focus(); }, 0);
  }
  /* giá trị nếu (sai lầm) lật kernel 180° — để chẩn đoán */
  flipValue(d) {
    const W = this.o.W.map(oc => oc.map(m => m.slice().reverse().map(r => r.slice().reverse())));
    return TN.convTerms(this.o.X, W, this.o.b, this.o.s, this.o.p, d.o, d.i, d.j).y;
  }
  caption(n) {
    const d = this.decode(n);
    if (d.intro) return 'Bước chuẩn bị: đệm input và xác định kích thước output';
    const o = this.o, r0 = d.i * o.s, c0 = d.j * o.s;
    const where = `cửa sổ hàng ${r0}–${r0 + this.k - 1}, cột ${c0}–${c0 + this.k - 1}${o.p ? ' (tọa độ trên input đã đệm)' : ''}`;
    if (d.phase === 'term') { const tm = this.terms(d.o, d.i, d.j).terms[d.t]; return `Kênh ra ${d.o} · ô (${d.i}, ${d.j}) · phép nhân ${d.t + 1}: x${tm.pad ? ' (ô đệm)' : `[${tm.c}, ${tm.r}, ${tm.q}]`} × W[${d.o}, ${tm.c}, ${tm.u}, ${tm.v}] = ${fv(tm.x)} × ${fpar(tm.w)} = ${fv(tm.prod)}`; }
    if (d.phase === 'bias') return `Kênh ra ${d.o} · ô (${d.i}, ${d.j}) · cộng bias b[${d.o}]`;
    return `Kênh ra ${d.o} · ô (${d.i}, ${d.j}) · ${where}`;
  }
}

/* =====================================================================
   17-sims.js — mô phỏng dùng chung: ReluSim (từng hàng), PoolSim (cửa sổ
   pooling trượt, đánh dấu max, so sánh trung bình), đồ thị ReLU.
   ===================================================================== */

/* đồ thị y = max(0, x) với các điểm dữ liệu (SVG) */
function reluPlot(points, o = {}) {
  const W = 340, Hh = 210, pad = 26;
  const xs = points.map(p => p.x), lim = Math.max(1, ...xs.map(Math.abs)) * 1.15;
  const X = x => pad + (x + lim) / (2 * lim) * (W - 2 * pad), Y = y => Hh - pad - y / lim * (Hh - 2 * pad) * 0.9 - 0;
  const y0 = Y(0);
  let s = `<svg class="reluplot" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Đồ thị ReLU với ${points.length} điểm">`;
  s += `<line class="ax" x1="${pad}" y1="${y0}" x2="${W - pad}" y2="${y0}"/><line class="ax" x1="${X(0)}" y1="${pad - 8}" x2="${X(0)}" y2="${Hh - pad + 6}"/>`;
  s += `<text x="${W - pad}" y="${y0 + 14}" text-anchor="end">x (đầu vào)</text><text x="${X(0) + 5}" y="${pad - 2}">y = max(0, x)</text>`;
  s += `<text x="${X(-lim * 0.95)}" y="${y0 - 6}">âm → 0</text>`;
  s += `<path class="fn" d="M${X(-lim)},${y0} L${X(0)},${y0} L${X(lim)},${Y(lim)}"/>`;
  for (const p of points) {
    const cls = p.x < 0 ? 'neg' : p.x > 0 ? 'pos' : 'zero';
    s += `<circle class="pt ${cls}${p.cur ? ' cur' : ''}" cx="${X(p.x).toFixed(1)}" cy="${Y(Math.max(0, p.x)).toFixed(1)}" r="${p.cur ? 6 : 4.5}"><title>x = ${fv(p.x)} → y = ${fv(Math.max(0, p.x))}</title></circle>`;
  }
  return s + '</svg>';
}

/* ---------------- ReluSim: duyệt từng hàng của từng kênh ---------------- */
class ReluSim {
  /* o = {X:[C][H][W], chans, names, key, sync, label} */
  constructor(host, o) {
    this.o = o; this.mem = SimMem[o.key] || (SimMem[o.key] = {});
    this.C = o.X.length; this.H = o.X[0].length; this.Wd = o.X[0][0].length;
    this.Y = TN.relu3(o.X); this.mx = TN.maxAbs(o.X) || 1;
    this.root = el('div', { class: 'relusim' }); host.append(this.root);
    this.player = new Player(this.root, {
      label: o.label || 'Animation ReLU', count: () => 1 + o.chans.length * this.H,
      build: st => this.build(st), render: n => this.render(n), caption: n => this.caption(n),
      onStep: n => { this.mem.step = n; this.sync(n); }
    });
    if (this.mem.step) this.player.go(this.mem.step);
  }
  dec(n) { if (n <= 0) return null; const m = n - 1; return { c: this.o.chans[Math.floor(m / this.H)], r: m % this.H, k: Math.floor(m / this.H) }; }
  build(st) {
    const c0 = this.o.chans[0];
    this.gA = gridView(this.o.X[c0], { mode: 'div', maxAbs: this.mx, cls: 'fm', cs: this.H > 4 ? 32 : 40, title: '<span class="c-fm">Trước ReLU</span> (output Conv)', aria: 'trước ReLU' });
    this.gB = gridView(this.Y[c0], { mode: 'div', maxAbs: this.mx, cls: 'relu', cs: this.H > 4 ? 32 : 40, title: '<span class="c-relu">Sau ReLU</span>', pending: (r) => this.pend(r), aria: 'sau ReLU' });
    this.list = el('div', { class: 'sumline' });
    this.plot = el('div');
    st.append(el('div', { class: 'scrollx' }, el('div', { class: 'simgrid' }, this.gA.el, el('div', { class: 'op', html: 'max(0, x)<br>→' }), this.gB.el)),
      el('div', { class: 'simgrid' }, el('div', { class: 'simcalc' }, this.list), this.plot));
  }
  pend(r) { const d = this._d; if (!d) return true; return r > d.r; }
  render(n) {
    const d = this.dec(n); this._d = d;
    const c = d ? d.c : this.o.chans[0];
    if (this._c !== c) { this._c = c; this.gA.set(this.o.X[c]); this.gA.el.querySelector('.gt').innerHTML = `<span class="c-fm">Trước ReLU</span> · kênh ${c}${this.o.names && this.o.names[c] ? ' · ' + esc(this.o.names[c]) : ''}`; this.gB.el.querySelector('.gt').innerHTML = `<span class="c-relu">Sau ReLU</span> · kênh ${c}`; }
    this.gB.set(this.Y[c]);
    this.gA.clear('src', 'negc', 'cur'); this.gB.clear('zeroed', 'cur');
    const negs = []; this.o.X[c].forEach((row, i) => row.forEach((v, j) => { if (v < 0 && (!d || i <= d.r)) negs.push([i, j]); }));
    this.gA.mark('negc', negs); this.gB.mark('zeroed', negs.filter(([i]) => d && i <= d.r));
    if (!d) {
      this.list.innerHTML = 'ReLU xét <b>từng phần tử riêng lẻ</b>: số âm → 0, số dương và số 0 giữ nguyên. Animation đi lần lượt từng hàng của từng kênh. Ô có viền chấm xanh là số âm (sẽ bị đưa về 0).';
      this.plot.innerHTML = reluPlot(this.o.X[c].flat().map(x => ({ x })));
      return;
    }
    const row = this.o.X[c][d.r], L = row.map((_, j) => [d.r, j]);
    this.gA.mark('cur', L); this.gB.mark('cur', L);
    this.gB.set(this.Y[c], { flash: L });
    this.gB.clear('zeroed'); this.gB.mark('zeroed', negs.filter(([i]) => i <= d.r));
    this.gB.mark('cur', L);
    const nNeg = row.filter(v => v < 0).length;
    this.list.innerHTML = `<b>Hàng ${d.r} · kênh ${c}:</b><br>` + row.map((v, j) => `<span class="t ${v < 0 ? 'on' : ''}">ReLU(${fv(v)}) = ${fv(Math.max(0, v))}</span>`).join(' · ') + `<br><span class="small muted">${nNeg} số âm bị đưa về 0; ${row.length - nNeg} số còn lại giữ nguyên.</span>`;
    this.plot.innerHTML = reluPlot(row.map(x => ({ x, cur: true })).concat(this.o.X[c].flat().map(x => ({ x }))).slice(0, 80));
  }
  caption(n) { const d = this.dec(n); return d ? `Kênh ${d.c} · hàng ${d.r}: áp dụng max(0, x) cho ${this.Wd} phần tử` : 'Bước chuẩn bị: tensor trước ReLU (output của lớp Conv)'; }
  sync(n) { if (!this.o.sync) return; const d = this.dec(n); if (!d) return; const row = this.o.X[d.c][d.r]; let j = row.findIndex(v => v < 0); if (j < 0) j = 0; State.setTrace({ block: this.o.sync, c: d.c, i: d.r, j }, 'sim'); }
}

/* ---------------- PoolSim: cửa sổ k×k, bước s ---------------- */
class PoolSim {
  /* o = {X:[C][H][W], k, s, chans, names, key, sync, label, compare (hiện thêm trung bình), inCls, outCls} */
  constructor(host, o) {
    this.o = o; this.mem = SimMem[o.key] || (SimMem[o.key] = {});
    this.C = o.X.length; this.H = o.X[0].length; this.Wd = o.X[0][0].length;
    const r = TN.pool2d(o.X, o.k, o.s, 'max'); this.Y = r.y; this.arg = r.arg; this.A = TN.pool2d(o.X, o.k, o.s, 'avg').y;
    this.Ho = this.Y[0].length; this.Wo = this.Y[0][0].length; this.mx = TN.maxAbs(o.X) || 1;
    this.root = el('div', { class: 'poolsim' }); host.append(this.root);
    this.player = new Player(this.root, {
      label: o.label || 'Animation Max Pooling', count: () => 1 + o.chans.length * this.Ho * this.Wo,
      build: st => this.build(st), render: n => this.render(n), caption: n => this.caption(n),
      onStep: n => { this.mem.step = n; this.sync(n); }
    });
    if (this.mem.step) this.player.go(this.mem.step);
    if (o.sync) {
      this._onTrace = ev => {
        if (!this.root.isConnected) { Bus.off('trace', this._onTrace); return; }
        if (!ev || ev.src !== 'tracker' || !ev.t || ev.t.block !== o.sync) return;
        const k = o.chans.indexOf(ev.t.c); if (k < 0) return;
        this.player.pause(); this._noSync = true; this.player.go(1 + k * this.Ho * this.Wo + ev.t.i * this.Wo + ev.t.j); this._noSync = false;
      };
      Bus.on('trace', this._onTrace, this.root);
    }
  }
  dec(n) { if (n <= 0) return null; const m = n - 1, per = this.Ho * this.Wo, k = Math.floor(m / per), q = m % per; return { k, c: this.o.chans[k], i: Math.floor(q / this.Wo), j: q % this.Wo, pos: m }; }
  build(st) {
    const o = this.o, c0 = o.chans[0], cs = this.H > 4 ? 32 : 40;
    this.gIn = gridView(o.X[c0], { mode: 'div', maxAbs: this.mx, cls: o.inCls || 'relu', cs, title: 'Input', aria: 'input pooling' });
    this.gIn.el.classList.add('pool2x2');
    this.gOut = gridView(this.Y[c0], { mode: 'div', maxAbs: this.mx, cls: o.outCls || 'pool', cs: Math.max(cs, 40), title: '<span class="c-pool">Max Pooling</span>', pending: (r, q) => this.pend(r, q), aria: 'output max pooling' });

    tb.innerHTML = `<table class="data"><thead><tr><th class="l">Lớp</th><th>logit dùng a·z + c</th><th>− max</th><th>e<sup>(…)</sup></th><th>p = e / Σe</th></tr></thead><tbody>${zz.map((v, k) => `<tr class="${shown && k === top ? 'hl' : ''}"><td class="l">${k} · ${CLASSES[k].vi}</td><td>${fx(v)}</td><td>${fx(R.sh[k])}</td><td>${fsci(R.ex[k], 6)}</td><td><b>${shown ? fsci(R.p[k], 4) : '?'}</b></td></tr>`).join('')}<tr><td class="l">Tổng</td><td></td><td></td><td>${fx(R.sum, 6)}</td><td><b>${shown ? fx(TN.sum(R.p)) : '?'}</b></td></tr></tbody></table>`;
    barBox.innerHTML = ''; if (shown) barBox.append(Tracker.barsEl(R.p));
    const N = [];
    if (S.c !== 0) N.push(`Cộng c = ${fv(S.c)} vào mọi logit <b>không đổi</b> xác suất: e<sup>z+c</sup> / Σe<sup>z+c</sup> = e<sup>c</sup>·e<sup>z</sup> / (e<sup>c</sup>·Σe<sup>z</sup>).`);
    if (S.a !== 1) N.push(`Nhân logits với a = ${fv(S.a)} ${S.a > 1 ? 'làm phân phối <b>nhọn hơn</b> (tự tin hơn)' : 'làm phân phối <b>phẳng hơn</b> (bớt tự tin)'} nhưng <b>không đổi lớp argmax</b>. Mức “tự tin” vì thế không đồng nghĩa với “đúng” — đó là lý do cần hiệu chuẩn (calibration).`);
    notes.innerHTML = N.length ? `<div class="info small"><b>Quan sát</b>${N.join('<br>')}</div>` : '';
  }
  build();
  return root;
}

/* đặt các phần tử DOM vào chỗ <div data-slot="..."> trong một khối HTML */
function slotFill(host, html, slots = {}) {
  const d = el('div', { class: 'know', html }); host.append(d);

  const secs = $$('h3.ksec', d);
  if (secs.length >= 4) {
    const toc = el('nav', { class: 'ktoc', 'aria-label': 'Mục lục phần kiến thức' });
    secs.forEach(h3 => { const b = el('button', { type: 'button', class: 'btn sm', text: h3.querySelector('.knum') ? h3.querySelector('.knum').textContent + ' ' + h3.childNodes[1].textContent.trim() : h3.textContent }); b.onclick = () => h3.scrollIntoView({ behavior: 'smooth', block: 'start' }); toc.append(b); });
    d.prepend(toc);
  }
  if (d.querySelector('h3.ksec')) d.insertAdjacentHTML('afterbegin', `<div class="tiny muted kleg">Nhãn trong tab: ${HT.badge('theory', 'lý thuyết')} định nghĩa, công thức tổng quát · ${HT.badge('fixed', 'ví dụ minh họa cố định')} số chọn sẵn để tính tay · ${HT.badge('net', 'dữ liệu thật của mạng')} số của ảnh đang chọn</div>`);
  for (const k in slots) { const s = d.querySelector(`[data-slot="${k}"]`); if (s) { const v = typeof slots[k] === 'function' ? slots[k]() : slots[k]; s.append(...(Array.isArray(v) ? v : [v])); } }
  return d;
}
const slot = (k, cls = '') => `<div data-slot="${k}" class="${cls}"></div>`;

    b.classList.toggle('on', mem.brush === v);
    b.onclick = () => { mem.brush = v; $$('button', br).forEach(x => { x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); }); b.classList.add('on'); b.setAttribute('aria-pressed', 'true'); };

  bar.append(el('b', { class: 'small', text: 'Cọ:' }), br,
    op('🗑 Xóa hết', () => State.setImage(TN.zeros2(8, 8), { sampleId: 'custom', label: null, from: 'paint' })),
    op('↻ Xoay 90°', () => { const m = State.img, r = TN.zeros2(8, 8); for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) r[j][7 - i] = m[i][j]; State.setImage(r, { sampleId: 'custom', label: State.label === 0 ? 1 : State.label === 1 ? 0 : State.label, from: 'paint' }); }, 'Xoay ảnh 90° theo chiều kim đồng hồ (nét ngang ↔ nét dọc)'),
    op('→ Dịch phải 1 ô', () => { const m = State.img, r = TN.zeros2(8, 8); for (let i = 0; i < 8; i++) for (let j = 1; j < 8; j++) r[i][j] = m[i][j - 1]; State.setImage(r, { sampleId: 'custom', label: State.label, from: 'paint' }); }, 'Dịch toàn bộ ảnh sang phải 1 cột (cột cuối bị mất)'));
  root.append(bar);
  const lab = el('select', { 'aria-label': 'Nhãn đúng của ảnh' }, el('option', { value: '', text: '— chưa gán / không thuộc 3 lớp —' }), ...CLASSES.map(c => el('option', { value: String(c.id), text: c.vi })));
  lab.value = State.label == null ? '' : String(State.label);
  lab.onchange = () => State.setLabel(lab.value === '' ? null : +lab.value);

  let painting = false;
  const g = gridView(State.img, { mode: 'img', cs: 44, cls: 'inp paintgrid', title: '✎ Ảnh đầu vào 8 × 8 — nhấp hoặc kéo chuột/ngón tay để tô', onCell: (r, c) => paintAt(r, c), aria: 'bảng vẽ ảnh 8x8' });
  g.el.classList.add('paintgrid', 'big');

  function paintAt(r, c) { if (r < 0 || c < 0 || r > 7 || c > 7) return; State.setPixel(r, c, mem.brush); }
  const grid = g.grid;
  grid.addEventListener('pointerdown', e => { const t = e.target.closest('.c'); if (!t) return; painting = true; try { grid.setPointerCapture(e.pointerId); } catch (er) { /* bỏ qua */ } paintAt(+t.dataset.r, +t.dataset.c); e.preventDefault(); });
  grid.addEventListener('pointermove', e => { if (!painting) return; const t = document.elementFromPoint(e.clientX, e.clientY); const c = t && t.closest && t.closest('.c'); if (c && grid.contains(c)) paintAt(+c.dataset.r, +c.dataset.c); });

  grid.addEventListener('pointerup', stop); grid.addEventListener('pointercancel', stop); grid.addEventListener('lostpointercapture', stop);

  return root;
}

/* ---------------- văn bản tensor có chú thích trục ---------------- */
function tensorText(img, hlRow = -1, hlAx = '') {
  const row = (r, i) => `      [${r.map(v => fv(v, 2).padStart(4)).join(', ')}]${i < 7 ? ',' : ' '}`;
  const L = [];
  L.push(`<span class="${hlAx === 'N' ? 'hlv' : ''}">x = tensor([</span>                       <span class="ax axN">← trục N (batch): 1 ảnh</span>`);
  L.push(`  <span class="${hlAx === 'C' ? 'hlv' : ''}">[</span>                                    <span class="ax axC">← trục C (channel): 1 kênh xám</span>`);
  L.push(`    <span class="${hlAx === 'H' ? 'hlv' : ''}">[</span>                                  <span class="ax axH">← trục H: 8 hàng</span>`);
  L.push(`      <span class="ax axW">↓ mỗi hàng gồm 8 số theo trục W (8 cột)</span>`);
  img.forEach((r, i) => L.push(`<span class="${i === hlRow || hlAx === 'H' ? 'hlv' : ''}">${row(r, i)}</span>  <span class="muted">hàng ${i}</span>`));
  L.push('    ]');
  L.push('  ]');
  L.push(`])   <b>shape = (1, 1, 8, 8)</b> → 1·1·8·8 = 64 phần tử`);
  return L.join('\n');
}

  X: [[[1, 0, 2], [3, 1, 0], [0, 2, 1]], [[2, 1, 0], [0, 1, 3], [1, 0, 2]]],
  W: [[[[1, -1], [0, 2]], [[-1, 0], [1, 1]]]],

/* chọn một ô đầu ra "thú vị" (giá trị dương lớn nhất) để làm ví dụ */
function bestCell(Y, o) { let best = [0, 0], bv = -Infinity; Y[o].forEach((r, i) => r.forEach((v, j) => { if (v > bv) { bv = v; best = [i, j]; } })); return best; }
function termsLine(T, nT, C) {
  const g = [];
  for (let c = 0; c < C; c++) g.push((C > 1 ? '[' : '') + T.terms.slice(c * nT, (c + 1) * nT).map(t => `${fpar(t.x)}·${fpar(t.w)}`).join(' + ') + (C > 1 ? `]<sub>kênh ${c}</sub>` : ''));
  return g.join(' + ');
}
function prodLine(T, nT, C) {
  const g = [];
  for (let c = 0; c < C; c++) g.push((C > 1 ? '[' : '') + T.terms.slice(c * nT, (c + 1) * nT).map(t => fpar(t.prod)).join(' + ') + (C > 1 ? ']' : ''));
  return g.join(' + ');
}

/* dải hình thu nhỏ của toàn mạng (dùng ở bài 9) */
function pipelineStrip(rec, upto = 99) {
  const wrap = el('div', { class: 'pipe' });
  BLOCKS.forEach((b, k) => {
    const card = el('div', { class: 'pipecard' + (k > upto ? ' pend' : '') + (k === upto ? ' cur' : '') });
    card.append(el('div', { class: 'small', html: `<b class="c-${b.col}">${esc(b.name.replace(' → Logits', ''))}</b>` }));
    if (k <= upto) {
      const o = rec.out[b.id];
      if (Array.isArray(o) && Array.isArray(o[0])) { const mx = TN.maxAbs(o) || 1; const r = el('div', { class: 'maps' }); o.forEach(m => r.append(gridView(m, { mode: b.id === 'input' ? 'img' : 'div', maxAbs: mx, cs: m.length > 4 ? 7 : m.length > 2 ? 12 : 16, labels: false, showVals: false, small: true }).el)); card.append(r); }
      else if (b.id === 'flatten') card.append(gridView([o], { mode: 'div', cs: 9, labels: false, showVals: false }).el);
      else if (b.id === 'linear') card.append(el('div', { class: 'mono small', text: '[' + o.map(v => fv(v, 2)).join(', ') + ']' }));
      else if (b.id === 'softmax') card.append(el('div', { class: 'mono small', text: '[' + o.map(v => fx(v, 3)).join(', ') + ']' }));
      else card.append(el('div', { class: 'small', html: `<b class="c-pred">${CLASSES[o].vi}</b>` }));
    } else card.append(el('div', { class: 'muted', text: '?' }));
    card.append(el('div', { class: 'tiny mono', text: shapeStr(b.outShape) }));
    wrap.append(card);
    if (k < BLOCKS.length - 1) wrap.append(el('div', { class: 'pipearr', text: '→' }));
  });
  return wrap;
}

 * (img == 0), 0, 1)\n\n\ndef make_dataset(n_per_class):\n    xs, ys = [], []\n    for label in range(3):\n        for _ in range(n_per_class):\n            xs.append(random_line_image(label))\n            ys.append(label)\n    x = torch.stack(xs).unsqueeze(1)                 # (N, 1, 8, 8)\n    return x, torch.tensor(ys)\n\n\nclass SmallCNN(nn.Module):                           # đúng kiến trúc của bản mô phỏng\n    def __init__(self):\n        super().__init__()\n        self.conv1 = nn.Conv2d(1, 2, kernel_size=3, stride=1, padding=1)\n        self.relu1 = nn.ReLU()\n        self.pool1 = nn.MaxPool2d(kernel_size=2, stride=2)\n        self.conv2 = nn.Conv2d(2, 4, kernel_size=3, stride=1, padding=1)\n        self.relu2 = nn.ReLU()\n        self.pool2 = nn.MaxPool2d(kernel_size=2, stride=2)\n        self.flatten = nn.Flatten()\n        self.fc = nn.Linear(16, 3)\n\n    def forward(self, x):\n        x = self.pool1(self.relu1(self.conv1(x)))\n        x = self.pool2(self.relu2(self.conv2(x)))\n        return self.fc(self.flatten(x))             # logits\n\n\nx_train, y_train = make_dataset(400)\nx_test, y_test = make_dataset(100)\nprint(\"dữ liệu huấn luyện:\", tuple(x_train.shape), \"· kiểm tra:\", tuple(x_test.shape))\n\nmodel = SmallCNN()\nloss_fn = nn.CrossEntropyLoss()                     # nhận LOGITS — không softmax trước\noptimizer = torch.optim.Adam(model.parameters(), lr=0.02)\n\nfor epoch in range(1, 31):\n    model.train()\n    perm = torch.randperm(len(x_train))\n    total = 0.0\n    for i in range(0, len(x_train), 32):\n        idx = perm[i:i + 32]\n        logits = model(x_train[idx])                # 1) Forward Pass\n        loss = loss_fn(logits, y_train[idx])        # 2) Loss\n        optimizer.zero_grad()\n        loss.backward()                             # 3) Backward Pass (tính gradient)\n        optimizer.step()                            # 4) Cập nhật trọng số\n        total += loss.item() * len(idx)\n    if epoch % 5 == 0 or epoch == 1:\n
