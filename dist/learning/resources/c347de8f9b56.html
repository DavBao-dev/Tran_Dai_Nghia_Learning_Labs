:root{
  --desk:#EDF0F5; --paper:#FFFFFF; --ink:#1B2140; --ink-2:#4F5673; --ink-3:#848AA3;
  --rule:#D8DDE7; --grid-dot:#D3D9E4; --pencil:#B3B9CA; --pencil-ink:#959CB2; --frame:#98A0B6;
  --accent:#2346D6; --accent-ink:#FFFFFF; --accent-soft:rgba(35,70,214,.09);
  --pos:35,70,214; --neg:204,62,79; --head2:#D17F22; --hatch:rgba(27,33,64,.16);
  --formula-bg:#F4F6FB; --explain-bg:#F6F7FB;
  --c-tok:#E3E7F0; --c-emb:#F7D3DA; --c-attn:#FAD3A5; --c-norm:#EEEB9C; --c-ffn:#BDE0F0; --c-lin:#D8D2F0; --c-soft:#C6E6BF;
  --edge-done:#59607B; --done-stroke:rgba(27,33,64,.45);
  --bar-h:66px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --desk:#11141D; --paper:#191D2A; --ink:#E5E8F2; --ink-2:#AAB0C8; --ink-3:#767D98;
    --rule:#2C3245; --grid-dot:#282E40; --pencil:#474E68; --pencil-ink:#707792; --frame:#5C647F;
    --accent:#8098FF; --accent-ink:#0D1230; --accent-soft:rgba(128,152,255,.13);
    --pos:128,152,255; --neg:255,118,132; --head2:#F2A65A; --hatch:rgba(229,232,242,.17);
    --formula-bg:#1F2433; --explain-bg:#1E2231;
    --c-tok:#2B3145; --c-emb:#5A3442; --c-attn:#654426; --c-norm:#55522B; --c-ffn:#244A5B; --c-lin:#3F3866; --c-soft:#2F5135;
    --edge-done:#A1A8C2; --done-stroke:rgba(229,232,242,.38);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.6;padding-bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tok{display:inline-block;padding:0 6px;border-radius:5px;background:var(--c-tok);font-size:.93em;line-height:1.45;white-space:nowrap}
.k-tok{--nf:var(--c-tok)} .k-emb{--nf:var(--c-emb)} .k-pe{--nf:var(--paper)} .k-attn{--nf:var(--c-attn)}
.k-norm{--nf:var(--c-norm)} .k-ffn{--nf:var(--c-ffn)} .k-lin{--nf:var(--c-lin)} .k-soft{--nf:var(--c-soft)} .k-out{--nf:transparent}
.tx-raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em}

/* ---------- Đầu trang & bố cục ---------- */
.masthead{max-width:1360px;margin:0 auto;padding:18px 18px 14px}
.masthead h1{margin:0 0 4px;font-size:21px;line-height:1.25;font-weight:600;letter-spacing:-.012em}
.masthead p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink-2);max-width:72ch}
.layout{display:grid;grid-template-columns:minmax(0,1fr)}
.figure-pane{position:sticky;top:0;z-index:10;background:var(--paper);border-block:1px solid var(--rule)}
.fig-bar{display:flex;align-items:center;gap:8px;min-height:46px;padding:4px 6px 4px 16px;border-bottom:1px solid var(--rule)}
.figure-pane.collapsed .fig-bar{border-bottom:0}
.fig-now{flex:1;min-width:0;font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig-now b{color:var(--ink);font-weight:600}
.fig-toggle{flex:none;height:38px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.figure-scroll{position:relative;height:36vh;min-height:210px;max-height:440px;overflow-y:auto;overscroll-behavior:contain;background-color:var(--paper);background-image:radial-gradient(circle,var(--grid-dot) 1px,transparent 1.3px);background-size:16px 16px}
.figure-pane.collapsed .figure-scroll{display:none}
#arch{display:block;width:100%;max-width:470px;height:auto;margin:0 auto}
.legend{display:none}
.step-pane{min-width:0;background:var(--paper);padding:20px 16px 36px}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(380px,450px) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:24px;max-width:1360px;margin:0 auto;padding:14px 32px 28px;align-items:start}
  .masthead{grid-column:2;grid-row:1;max-width:none;margin:0;padding:8px 4px 18px}
  .masthead h1{font-size:26px}
  .masthead p{font-size:15.5px}
  .figure-pane{grid-column:1;grid-row:1 / span 2;top:14px;height:calc(100vh - var(--bar-h) - 28px);display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
  .fig-bar{display:none}
  .figure-scroll{flex:1;height:auto;min-height:0;max-height:none}
  #arch{width:100%;height:100%;min-height:560px;max-width:none}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-2)}
  .step-pane{grid-column:2;grid-row:2;border:1px solid var(--rule);border-radius:14px;padding:30px 40px 48px}
}
.lg{display:inline-flex;align-items:center;gap:7px}
.lg i{display:inline-block;width:22px;height:12px;border-radius:3px}
.lg-todo i{border:1px dashed var(--pencil);background:var(--paper)}
.lg-active i{background:var(--c-attn);border:2px solid var(--accent)}
.lg-done i{background:var(--c-attn);border:1px solid var(--done-stroke)}

/* ---------- Sơ đồ ---------- */
#arch text{font-size:12px}
#arch .t-small{font-size:9.5px}
#arch .frame{fill:none;stroke:var(--frame);stroke-width:1.2}
#arch .cap-bg{fill:var(--paper)}
#arch .cap{font-size:11.5px;font-weight:600;fill:var(--ink-2)}
#arch .nx{font-size:13px;fill:var(--ink-2);font-family:KaTeX_Main,Georgia,serif}
#arch .node{cursor:pointer}
#arch .node:focus{outline:none}
#arch .glow{fill:none;stroke:var(--accent);stroke-width:7;stroke-opacity:0}
#arch .body{fill:var(--paper);stroke:var(--pencil);stroke-width:1;stroke-dasharray:3 2.5;transition:fill .5s ease,stroke .3s ease}
#arch .node text{fill:var(--pencil-ink);transition:fill .3s ease}
#arch .glyph{fill:none;stroke:var(--pencil);stroke-width:1.3;stroke-linecap:round}
#arch .qkv{font-family:KaTeX_Math,'Times New Roman',serif;font-style:italic;font-size:10.5px}
#arch .node.done .body,#arch .node.active .body{fill:var(--nf);stroke:var(--done-stroke);stroke-dasharray:none}
#arch .node.done text,#arch .node.active text{fill:var(--ink)}
#arch .node.done .qkv{fill:var(--ink-2)}
#arch .node.done .glyph,#arch .node.active .glyph{stroke:var(--ink)}
#arch .node.active .body{stroke:var(--accent);stroke-width:2}
#arch .node.active .qkv{fill:var(--accent)}
#arch .node.active .glow{stroke-opacity:.2;animation:glow 1.8s ease-in-out infinite}
#arch .node:focus-visible .body{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:none}
@keyframes glow{50%{stroke-opacity:.05}}
#arch .edge{fill:none;stroke:var(--pencil);stroke-width:1.2;stroke-linejoin:round}
#arch .edge.arr{marker-end:url(#m-todo)}
#arch .edge.done{stroke:var(--edge-done)}
#arch .edge.done.arr{marker-end:url(#m-done)}
#arch .edge.active{stroke:var(--accent);stroke-width:1.9;stroke-dasharray:4 3;animation:flow .7s linear infinite}
#arch .edge.active.arr{marker-end:url(#m-active)}
@keyframes flow{to{stroke-dashoffset:-7}}
#m-todo path{fill:var(--pencil)} #m-done path{fill:var(--edge-done)} #m-active path{fill:var(--accent)}
#arch .pred{opacity:0;transition:opacity .4s ease}
#arch.show-pred .pred{opacity:1}
#arch .pred rect{fill:rgb(var(--pos))}
#arch .node .pred text{fill:var(--accent-ink);font-weight:600}

/* ---------- Nội dung bước ---------- */
.step{max-width:800px}
.step-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 10px;font-size:13.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink);background:var(--desk)}
.chip-block::before{content:'';width:9px;height:9px;border-radius:2px;background:var(--nf);box-shadow:inset 0 0 0 1px var(--done-stroke)}
h2.step-title{margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:-.012em}
h3.sub{margin:30px 0 8px;font-size:18px;line-height:1.35;font-weight:600}
@media (min-width:980px){h2.step-title{font-size:27px}}
.prose{max-width:66ch}
.prose p{margin:0 0 12px}
.formula{margin:18px 0 8px;padding:6px 16px;background:var(--formula-bg);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;overflow-x:auto;overflow-y:hidden}
.f-row{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:2.4em}
.formula .katex-display{margin:9px 0;text-align:left}
.formula .katex-display>.katex{text-align:left;font-size:1.1em}
@media (max-width:520px){.formula{padding:4px 12px}.formula .katex-display>.katex{font-size:1em}}
.hint{margin:8px 0 0;font-size:13.5px;color:var(--ink-3)}
.note{margin:16px 0 0;padding-left:12px;border-left:2px solid var(--rule);font-size:14px;line-height:1.55;color:var(--ink-2);max-width:66ch}
.rid{margin-left:5px;font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.pipe{margin:16px 0 4px}
.pipe-cap{font-size:13px;color:var(--ink-2);margin-bottom:6px}
.pipe-row{display:flex;flex-wrap:wrap;align-items:center;row-gap:6px}
.pp{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:13px;border:1px solid var(--rule);color:var(--ink-3);background:var(--paper);white-space:nowrap}
.pp .katex{font-size:1em}
.pp.done{color:var(--ink);background:var(--c-attn);border-color:transparent}
.pp.active{color:var(--ink);background:var(--c-attn);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pp.off{border-style:dashed;opacity:.6}
.pj{width:8px;height:1px;background:var(--pencil);flex:none}

.tokens{display:flex;flex-wrap:wrap;gap:8px 10px;margin:16px 0 0}
.tk{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;padding:6px 12px 5px;border-radius:9px;background:var(--c-tok)}
.tk b{font-size:16px;font-weight:600}
.tk span{font-size:12px;color:var(--ink-2)}

/* ---------- Ma trận ---------- */
.mgroup{margin:20px 0 6px}
.mrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 14px}
.op{align-self:center;padding-top:22px;font-size:18px;color:var(--ink-2)}
.mx{min-width:0;max-width:100%;margin:0}
.mx-cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin:0 0 6px;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.mx-cap .nm{font-size:15.5px;color:var(--ink)}
.mx-cap .dim{color:var(--ink-3);font-variant-numeric:tabular-nums}
.mx-note{flex-basis:100%}
.mx-scroll{max-width:100%;overflow-x:auto;padding:2px 2px 4px}
.mx-grid{display:inline-grid;align-items:center;row-gap:2px}
.mx-rl{padding-right:7px;font-size:12.5px;text-align:right;white-space:nowrap;color:var(--ink-2)}
.mx-ch{padding:0 2px 1px;font-size:11.5px;text-align:center;white-space:nowrap;color:var(--ink-3)}
.mx-rl.hi,.mx-ch.hi,.mx-rl.lookup{color:var(--accent);font-weight:600}
.mx-band{margin:0 3px 3px;padding-bottom:1px;font-size:11px;text-align:center;white-space:nowrap;color:var(--ink-2);border-bottom:2px solid var(--band,var(--rule))}
.band-1{--band:rgb(var(--pos))} .band-2{--band:var(--head2)}
.br{align-self:stretch;width:7px;border:1.5px solid var(--ink)}
.br-l{border-right:0;margin-right:2px} .br-r{border-left:0;margin-left:2px}
.cell{display:block;min-width:3.3em;margin:0 1px;padding:3px 5px;border:0;border-radius:4px;background:transparent;font-family:KaTeX_Main,'Latin Modern Roman','Times New Roman',Georgia,serif;font-size:15px;line-height:1.3;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
.cell:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
.cell.static{cursor:default}
.cell.static:hover{box-shadow:none}
.cell.zero,.cell.minf{color:var(--ink-3);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 5px)}
.cell.lookup{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell.arg{font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.sel,.cell.sel:hover{position:relative;z-index:1;box-shadow:0 0 0 2px var(--accent)}
@media (max-width:420px){.cell{min-width:3.05em;padding:3px 4px;font-size:14px}}

.explain{position:relative;margin-top:12px;padding:10px 14px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--explain-bg)}
.explain[hidden]{display:none}
.ex-title{padding-right:34px;font-size:13.5px;color:var(--ink-2)}
.ex-title b{color:var(--ink);font-weight:600}
.ex-title .katex{font-size:1.05em;color:var(--ink)}
.ex-line{margin-top:6px;font-size:15px;line-height:2.1;overflow-x:auto;overflow-y:hidden}
.ex-line .katex{font-size:1.08em}
.ex-note{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.ex-close{position:absolute;top:4px;right:4px;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:21px;line-height:1;cursor:pointer}
.ex-close:hover{background:var(--accent-soft)}

details.more{margin:26px 0 0;padding-top:10px;border-top:1px solid var(--rule)}
details.more>summary{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;list-style:none;font-size:14.5px;font-weight:600;color:var(--ink-2)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'';flex:none;width:7px;height:7px;margin-left:2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.more[open]>summary::before{transform:rotate(45deg)}
details.more>summary .katex{font-size:1em}

.attn-wrap{display:flex;flex-wrap:wrap;gap:8px 28px;margin:18px 0 0}
.attnlines{width:200px;max-width:calc(50% - 14px);height:auto;overflow:visible}
.attnlines text{font-size:13px;fill:var(--ink-2)}
.attnlines .al-title{font-size:12.5px;font-weight:600;fill:var(--ink)}
.attnlines .al-q{cursor:pointer}
.attnlines .al-q:focus{outline:none}
.attnlines .al-q:focus-visible{text-decoration:underline}
.attnlines .al-q.on{fill:var(--accent);font-weight:600}
.attnlines line{stroke:rgb(var(--pos));stroke-linecap:round;transition:opacity .2s}
.attnlines.focus line:not(.on){opacity:.04!important}

.bars{margin:18px 0 0}
.bar-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bar-tab{height:36px;padding:0 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-size:14px;cursor:pointer}
.bar-tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.bar{display:grid;grid-template-columns:4.4em minmax(0,1fr) 3em;align-items:center;gap:10px;min-height:27px;font-size:14px;max-width:520px}
.bar-l{text-align:right;color:var(--ink-2)}
.bar-t{height:12px;border-radius:3px;background:var(--desk);overflow:hidden}
.bar-f{height:100%;border-radius:3px;background:rgba(var(--pos),.4);transition:width .45s ease}
.bar.top .bar-f{background:rgb(var(--pos))}
.bar.top .bar-l{color:var(--ink);font-weight:600}
.bar-v{text-align:right;font-family:KaTeX_Main,Georgia,serif;font-variant-numeric:tabular-nums}
.predict{margin:14px 0 0;font-size:16px}
.predict .tok{background:rgba(var(--pos),.18);font-weight:600}

.tbl-wrap{overflow-x:auto;margin:16px 0 4px}
.tbl{border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{padding:7px 18px 7px 0;text-align:left;border-bottom:1px solid var(--rule);vertical-align:baseline}
.tbl th{font-size:13px;font-weight:600;color:var(--ink-2)}
.tbl td.num{font-family:KaTeX_Main,Georgia,serif;font-variant-numeric:tabular-nums}

/* ---------- Chế độ PyTorch ---------- */
:root{--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;--code-bg:#F5F6FA;--code-ink:#1F2544;--code-ln:#A0A6BA;--hit:rgba(35,70,214,.08);--py-k:#7B3FC4;--py-s:#1D7A45;--py-n:#B0521A;--py-c:#6E7590;--py-b:#1E62B8;--py-d:#A8446A}
@media (prefers-color-scheme:dark){:root{--code-bg:#141824;--code-ink:#DDE2F0;--code-ln:#5B6380;--hit:rgba(128,152,255,.13);--py-k:#C49BFF;--py-s:#8BD49C;--py-n:#F2A56B;--py-c:#8A92AB;--py-b:#86B6FF;--py-d:#F08DB5}}
.mode-switch{margin-left:auto;display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--desk)}
.mode-switch button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer}
.mode-switch button:hover{color:var(--ink)}
.mode-switch button[aria-pressed="true"]{background:var(--paper);color:var(--accent);box-shadow:0 0 0 1px var(--rule),0 1px 2px rgba(15,20,40,.1)}
.prose code,.note code,.cm-notes code,.hint code,.fc-info code{padding:1px 4px;border-radius:4px;background:var(--code-bg);font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
.cm-wrap{margin:18px 0 8px}
.cm{border:1px solid var(--rule);border-radius:10px;background:var(--code-bg);overflow:hidden}
.cm+.cm{margin-top:12px}
.cm-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:7px 12px;border-bottom:1px solid var(--rule);background:var(--paper);font-size:12.5px;color:var(--ink-3)}
.cm-head b{font-weight:600;color:var(--ink-2)}
.cm-body{padding:6px 0}
.cm-row{display:grid;grid-template-columns:2.4em minmax(0,1fr) minmax(0,30%);column-gap:14px;align-items:baseline;padding:1px 12px 1px 0}
.cm-ln{text-align:right;color:var(--code-ln);font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;user-select:none}
.cm-code{display:block;margin:0;padding:0;background:none;color:var(--code-ink);font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:calc(var(--ind,0) * 1ch + 2ch);text-indent:-2ch}
.cm-tex{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0;color:var(--ink);font-size:14px;line-height:1.5}
.cm-tex .katex{font-size:1em}
.cm-row.ctx .cm-code,.cm-row.ctx .cm-code span{color:var(--ink-3)}
.cm-row.hit{background:var(--hit);box-shadow:inset 3px 0 0 var(--accent)}
.cm-gap{padding-left:calc(2.4em + 14px);color:var(--code-ln);font-size:12px;line-height:1.2;user-select:none}
.cm-out{margin:2px 12px 6px calc(2.4em + 14px);padding:0;overflow-x:auto;color:var(--ink-2);font-family:var(--mono);font-size:12.5px;line-height:1.5}
.py-k{color:var(--py-k)} .py-s{color:var(--py-s)} .py-n{color:var(--py-n)} .py-c{color:var(--py-c);font-style:italic} .py-b{color:var(--py-b)} .py-d{color:var(--py-d)}
.cm-notes{margin-top:12px;padding:10px 16px 12px;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;background:var(--formula-bg)}
.cm-notes-t{margin-bottom:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.cm-notes p{margin:0 0 8px;font-size:14.5px;line-height:1.6;max-width:70ch}
.cm-notes p:last-child{margin-bottom:0}
.cm-step{flex:none;height:22px;margin-left:auto;padding:0 7px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink-2);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.cm-step:hover{border-color:var(--accent);color:var(--accent)}
.mx-cap .py-nm{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink)}
.mx-cap .nm-sub{font-size:13px;color:var(--ink-3)}
.pp-code{font-family:var(--mono);font-size:11.5px}
.py-inline{padding:0 4px;border-radius:4px;background:var(--code-bg);font-family:var(--mono);font-size:.95em;color:var(--ink)}
.ex-code{margin:8px 0 4px;padding:7px 10px;border-radius:8px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.fullcode{margin-top:6px}
.fc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:4px 0 12px;font-size:13.5px;color:var(--ink-2)}
.fc-copy{height:38px;padding:0 14px;border:1px solid var(--accent);border-radius:9px;background:var(--paper);color:var(--accent);font-size:14px;font-weight:600;cursor:pointer}
.fc-copy:hover{background:var(--accent-soft)}
.fc-status{font-weight:600;color:var(--ink)}
.fc-info{flex-basis:100%}
.fc-sec{border:1px solid var(--rule);border-radius:10px;background:var(--code-bg);overflow:hidden}
.fc-sec+.fc-sec{margin-top:10px}
.fc-sec>summary{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;background:var(--paper);cursor:pointer;list-style:none;font-size:14px;font-weight:600;color:var(--ink-2)}
.fc-sec>summary::-webkit-details-marker{display:none}
.fc-sec>summary::before{content:'';flex:none;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
.fc-sec[open]>summary::before{transform:rotate(45deg)}
.fc-sec[open]>summary{border-bottom:1px solid var(--rule)}
.fc-lines{margin-left:auto;font-size:12px;font-weight:400;color:var(--ink-3)}
.fc-scroll{position:relative;max-height:520px;overflow:auto;padding:6px 0}
.fc-scroll .cm-row{grid-template-columns:2.4em minmax(0,1fr) auto}
.fc-scroll .cm-tex{max-width:300px}
@media (max-width:700px){
  .cm-row,.fc-scroll .cm-row{grid-template-columns:2.4em minmax(0,1fr);column-gap:8px}
  .cm-tex,.fc-scroll .cm-tex{grid-column:2;max-width:none;padding:0 0 4px}
  .cm-tex:empty{display:none}
  .cm-gap{padding-left:calc(2.4em + 8px)}
  .cm-out{margin-left:calc(2.4em + 8px)}
  .cm-code{font-size:12.5px;padding-left:calc(var(--ind,0) * .5ch + 2ch)}
}

/* ---------- Thanh điều khiển ---------- */
.controls{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--rule)}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font-size:15px;font-weight:600;cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.35;cursor:default}
.btn .lbl{display:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:0 14px 0 18px}
.btn-primary .lbl{display:inline}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.progress{flex:1;min-width:0;padding:0 4px}
.p-text{font-size:13px;line-height:1.25;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-text b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-right:4px}
.p-track{display:flex}
.p-seg{flex:1;min-width:0;height:22px;padding:8px 1.5px;border:0;background:none;cursor:pointer}
.p-seg::before{content:'';display:block;height:6px;border-radius:3px;background:var(--rule);transition:background .25s}
.p-seg.done::before{background:var(--ink-3)}
.p-seg.cur::before{background:var(--accent)}
.p-seg.gap{margin-left:5px}
@media (min-width:640px){.btn .lbl{display:inline}.controls{padding-inline:20px;gap:12px}}
@media (min-width:980px){.controls{justify-content:center}.progress{max-width:640px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #arch .edge.active{stroke-dasharray:none}
}
</style>
</head>
<body>
<main class="layout">
<header class="masthead">
  <h1>Transformer chạy từng bước</h1>
  <p>Một mô hình tí hon dịch “I love cats” thành “Tôi yêu mèo”. Bấm Tiếp để chạy từng phép tính trên sơ đồ, kèm công thức và con số thật ở mỗi bước.</p>
</header>
  <section class="figure-pane" id="figurePane" aria-label="Sơ đồ kiến trúc Transformer">

  if (v === -Infinity) return MINUS + '∞';
  if (v === Infinity) return '∞';
  const s = Math.abs(v).toFixed(d);
  return (v < 0 && Number(s) !== 0 ? MINUS : '') + s;
}
function tn(v, d = 2) {
  if (v === -Infinity) return '-\\infty';
  const s = Math.abs(v).toFixed(d);
  return (v < 0 && Number(s) !== 0 ? '-' : '') + s;
}
function tp(v, d = 2) { const s = tn(v, d); return s[0] === '-' ? `(${s})` : s; }
function tx4(v) {
  const s = Math.abs(v).toFixed(4).replace(/(\.\d{2}\d*?)0+$/, '$1');
  return (v < 0 && Number(s) !== 0 ? '-' : '') + s;
}
const IDX = n => Array.from({ length: n }, (_, j) => String(j));

/* ===== Ma trận có tô màu, bấm vào ô để xem cách tính ===== */
function heatColor(v, kind, maxAbs) {
  if (kind === 'plain' || !isFinite(v)) return '';
  if (kind === 'prob') return `rgba(var(--pos), ${(0.03 + 0.52 * Math.max(0, Math.min(1, v))).toFixed(3)})`;
  const a = Math.min(1, Math.abs(v) / maxAbs);
  return `rgba(var(${v >= 0 ? '--pos' : '--neg'}), ${(0.03 + 0.45 * a).toFixed(3)})`;
}
function Matrix(o) {
  const data = o.data, n = data.length, c = data[0].length;
  const digits = o.digits == null ? 2 : o.digits;
  const kind = o.kind || 'signed';
  const finite = data.flat().filter(v => isFinite(v));
  const maxAbs = Math.max(1e-9, ...finite.map(Math.abs));
  const hasRL = !!o.rows, off = hasRL ? 1 : 0;
  const look = o.lookupRows || [];
  const grid = h('div', { class: 'mx-grid' });
  grid.style.gridTemplateColumns = `${hasRL ? 'auto ' : ''}7px repeat(${c}, auto) 7px`;
  const place = (el, row, col) => { el.style.gridRow = String(row); el.style.gridColumn = String(col); grid.append(el); return el; };
  let r = 1;
  if (o.groups) {
    let col = off + 2;
    o.groups.forEach(g => { place(h('div', { class: 'mx-band ' + (g.cls || '') }, g.label), r, `${col} / span ${g.span}`); col += g.span; });
    r++;
  }
  const chEls = [];
  if (o.cols) { for (let j = 0; j < c; j++) chEls.push(place(h('div', { class: 'mx-ch' }, rich(o.cols[j])), r, off + 2 + j)); r++; }
  const r0 = r, rlEls = [], cells = [];
  for (let i = 0; i < n; i++) {
    if (hasRL) rlEls.push(place(h('div', { class: 'mx-rl' + (look.includes(i) ? ' lookup' : '') }, rich(o.rows[i])), r0 + i, 1));
    const rowCells = [];
    for (let j = 0; j < c; j++) {
      const v = data[i][j];
      let cls = 'cell';
      if (!isFinite(v)) cls += ' minf';
      if (o.mark) { const mk = o.mark(i, j, v); if (mk) cls += ' ' + mk; }
      if (look.includes(i)) cls += ' lookup';
      if (!o.explain) cls += ' static';
      const bg = heatColor(v, kind, maxAbs);
      const el = h(o.explain ? 'button' : 'span', { type: o.explain ? 'button' : null, class: cls, style: bg ? `background-color:${bg}` : null }, fmt(v, digits));
      if (o.explain) el.addEventListener('click', () => { if (api.onPick) api.onPick(i, j); });
      rowCells.push(place(el, r0 + i, off + 2 + j));
    }
    cells.push(rowCells);
  }
  place(h('div', { class: 'br br-l' }), `${r0} / span ${n}`, off + 1);
  place(h('div', { class: 'br br-r' }), `${r0} / span ${n}`, off + 2 + c);
  const py = MODE === 'py' ? pyName(o.name) : null;
  const cap = h('figcaption', { class: 'mx-cap' },
    py ? h('code', { class: 'py-nm' }, py) : null,
    h('span', { class: py ? 'nm-sub' : 'nm' }, tex(o.name)),
    h('span', { class: 'dim' }, `${n}×${c}`),
    o.note ? h('span', { class: 'mx-note' }, rich(o.note)) : null);
  const node = h('figure', { class: 'mx' }, cap, h('div', { class: 'mx-scroll' }, grid));
  const api = {
    node, o, py, onPick: null,
    select(i, j, on) {
      cells[i][j].classList.toggle('sel', on);
      if (rlEls[i]) rlEls[i].classList.toggle('hi', on);
      if (chEls[j]) chEls[j].classList.toggle('hi', on);
    },
  };
  return api;
}
const mat = (name, data, rows, cols, extra) => Matrix(Object.assign({ name, data, rows, cols }, extra || {}));

function Group(items, opts) {
  opts = opts || {};
  const row = h('div', { class: 'mrow' });
  const panel = h('div', { class: 'explain', hidden: true, 'aria-live': 'polite' });
  const mats = [];
  items.forEach(it => {
    if (it == null) return;
    if (typeof it === 'string') row.append(h('div', { class: 'op', 'aria-hidden': 'true' }, tex(it)));
    else if (it instanceof Node) row.append(it);
    else { row.append(it.node); mats.push(it); }
  });
  let cur = null;
  function close() {
    if (cur) cur.mx.select(cur.i, cur.j, false);
    cur = null; panel.hidden = true; panel.textContent = '';
  }
  function pick(mx, i, j) {
    const same = cur && cur.mx === mx && cur.i === i && cur.j === j;
    close();
    if (same) return;
    const ex = mx.o.explain(i, j);
    if (!ex) return;
    cur = { mx, i, j };
    mx.select(i, j, true);
    const where = [];
    if (mx.o.rows) where.push(`hàng <b>${mx.o.rows[i]}</b>`);
    if (mx.o.cols) where.push(`cột <b>${mx.o.cols[j]}</b>`);
    const kids = [h('div', { class: 'ex-title' }, rich(`Ô ${where.join(', ')} của `), mx.py ? h('code', { class: 'py-inline' }, mx.py) : tex(mx.o.name))];
    if (mx.py) kids.push(pyCellCode(mx, i, j));
    ex.lines.forEach(L => kids.push(h('div', { class: 'ex-line' }, tex(L))));
    if (ex.note) kids.push(h('p', { class: 'ex-note' }, rich(ex.note)));
    kids.push(h('button', { type: 'button', class: 'ex-close', 'aria-label': 'Đóng phần giải thích', onclick: close }, '×'));
    panel.append(...kids);
    panel.hidden = false;
  }
  mats.forEach(mx => { mx.onPick = (i, j) => pick(mx, i, j); });
  if (opts.auto && mats[opts.auto[0]]) pick(mats[opts.auto[0]], opts.auto[1], opts.auto[2]);
  return h('div', { class: 'mgroup' }, row, panel);
}

function AttnLines(A, qLab, kLab, title) {
  const n = qLab.length, mm = kLab.length;
  const W = 200, top = 30, rowH = 30, xl = 62, xr = 138;
  const Ht = top + Math.max(n, mm) * rowH;
  const yy = i => top + rowH * i + rowH / 2;
  let s = `<svg class="attnlines" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${esc(title)}">`;
  s += `<text class="al-title" x="${W / 2}" y="14" text-anchor="middle">${esc(title)}</text>`;
  for (let i = 0; i < n; i++) for (let j = 0; j < mm; j++) {
    const a = A[i][j];
    if (!(a > 0.004)) continue;
    s += `<line data-q="${i}" x1="${xl + 6}" y1="${yy(i)}" x2="${xr - 6}" y2="${yy(j)}" stroke-width="${(0.8 + 7 * a).toFixed(2)}" style="opacity:${(0.12 + 0.88 * a).toFixed(2)}"/>`;
  }
  for (let i = 0; i < n; i++) s += `<text class="al-q" data-q="${i}" x="${xl}" y="${yy(i)}" dy="0.35em" text-anchor="end" tabindex="0" role="button">${esc(qLab[i])}</text>`;
  for (let j = 0; j < mm; j++) s += `<text x="${xr}" y="${yy(j)}" dy="0.35em">${esc(kLab[j])}</text>`;
  s += '</svg>';
  const t = document.createElement('template');
  t.innerHTML = s;
  const svg = t.content.firstChild;
  let focus = -1;
  const setFocus = i => {
    focus = focus === i ? -1 : i;
    svg.classList.toggle('focus', focus >= 0);
    svg.querySelectorAll('line').forEach(l => l.classList.toggle('on', +l.dataset.q === focus));
    svg.querySelectorAll('.al-q').forEach(q => q.classList.toggle('on', +q.dataset.q === focus));
  };
  svg.querySelectorAll('.al-q').forEach(q => {
    q.addEventListener('click', () => setFocus(+q.dataset.q));
    q.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFocus(+q.dataset.q); } });
  });
  return svg;
}
const AttnRow = (heads, qLab, kLab) => h('div', null,

function Bars(Pm, vocab, rowLabels, initial) {
  const tabs = h('div', { class: 'bar-tabs', role: 'tablist', 'aria-label': 'Chọn vị trí' });
  const list = h('div');
  const pred = h('p', { class: 'predict' });
  const tabBtns = rowLabels.map((lab, t) => h('button', { type: 'button', class: 'bar-tab', role: 'tab', onclick: () => draw(t) }, rich(`Sau ${tokHtml(lab)}`)));
  tabs.append(...tabBtns);
  const bars = vocab.map(v => {
    const f = h('div', { class: 'bar-f' }), val = h('div', { class: 'bar-v' });
    const row = h('div', { class: 'bar' }, h('div', { class: 'bar-l' }, v), h('div', { class: 'bar-t' }, f), val);
    list.append(row);
    return { row, f, val };
  });
  function draw(t) {
    const p = Pm[t], top = p.indexOf(Math.max(...p));
    tabBtns.forEach((b, k) => b.setAttribute('aria-selected', k === t ? 'true' : 'false'));
    bars.forEach((b, v) => { b.f.style.width = (p[v] * 100).toFixed(1) + '%'; b.val.textContent = fmt(p[v]); b.row.classList.toggle('top', v === top); });
    pred.replaceChildren(rich(`Sau ${tokHtml(rowLabels[t])}, mô hình chọn ${tokHtml(vocab[top])} với xác suất ${fmt(p[top])}.`));
  }
  draw(initial);
  return h('div', { class: 'bars' }, tabs, list, pred);
}

/* ===== Giải thích cách tính từng ô ===== */
function exLin(outN, inN, wN, X, W, Out) {
  return (i, j) => ({
    lines: [`${outN}[${i},${j}] = \\sum_k ${inN}[${i},k]\\,${wN}[k,${j}] = ${X[i].map((x, k) => `${tp(x)}\\cdot${tp(W[k][j], 1)}`).join(' + ')} = ${tn(Out[i][j])}`],
    note: `Lấy hàng ${i} của $${inN}$ nhân vô hướng với cột ${j} của $${wN}$.`,
  });
}
function exSum(outN, aN, bN, A, B, O) {
  return (i, j) => ({ lines: [`${outN}[${i},${j}] = ${aN}[${i},${j}] + ${bN}[${i},${j}] = ${tn(A[i][j])} + ${tp(B[i][j])} = ${tn(O[i][j])}`] });
}
function exScore(name, Qh, Kh, S, Sm, M, k) {
  return (i, j) => {
    const dot = Qh[i].reduce((s, q, t) => s + q * Kh[j][t], 0);
    const lines = [
      `q_{${i}}\\cdot k_{${j}} = ${Qh[i].map((q, t) => `${tp(q)}\\cdot${tp(Kh[j][t])}`).join(' + ')} = ${tx4(dot)}`,
      `\\dfrac{q_{${i}}\\cdot k_{${j}}}{\\sqrt{2}} = \\dfrac{${tx4(dot)}}{1.4142} = ${tn(S[i][j])}`,
    ];
    if (Sm) lines.push(`${name}[${i},${j}] = ${tn(S[i][j])} + M[${i},${j}] = ${tn(S[i][j])} + ${tp(M[i][j], 0)} = ${tn(Sm[i][j])}`);
    return { lines, note: `$q_{${i}}$ là hàng ${i} của $Q_${k + 1}$, $k_{${j}}$ là hàng ${j} của $K_${k + 1}$ (tức ${k === 0 ? 'cột 0–1' : 'cột 2–3'} của $Q$ và $K$).` };
  };
}
function exSoftmax(name, sName, Sr, A) {
  return (i, j) => {
    const z = Sr[i], e = z.map(v => (isFinite(v) ? Math.exp(v) : 0)), sum = e.reduce((a, b) => a + b, 0);
    const pow = v => (isFinite(v) ? `e^{${tn(v)}}` : 'e^{-\\infty}');
    return {
      lines: [
        `\\sum_k e^{${sName}[${i},k]} = ${z.map(pow).join(' + ')} = ${e.map(v => tn(v)).join(' + ')} = ${tn(sum)}`,
        `${name}[${i},${j}] = \\dfrac{${pow(z[j])}}{${tn(sum)}} = \\dfrac{${tn(e[j])}}{${tn(sum)}} = ${tn(A[i][j])}`,
      ],
      note: z.some(v => !isFinite(v)) ? 'Vì $e^{-\\infty} = 0$, ô bị che không nhận chút chú ý nào.' : null,
    };
  };
}
function exWsum(outN, aN, vN, A, Vh, O, k) {
  return (i, j) => ({
    lines: [`${outN}[${i},${j}] = \\sum_t ${aN}[${i},t]\\,${vN}[t,${j}] = ${A[i].map((a, t) => `${tp(a)}\\cdot${tp(Vh[t][j])}`).join(' + ')} = ${tn(O[i][j])}`],
    note: `$${vN}$ là ${k === 0 ? 'cột 0–1' : 'cột 2–3'} của $V$.`,
  });
}
const exConcat = C => (i, j) => ({
  lines: [`\\text{Concat}[${i},${j}] = \\text{head}_{${j < 2 ? 1 : 2}}[${i},${j < 2 ? j : j - 2}] = ${tn(C[i][j])}`],
  note: 'Ghép nối: cột 0–1 lấy từ head 1, cột 2–3 lấy từ head 2.',
});
const exMu = ln => i => ({ lines: [`\\mu_{${i}} = \\tfrac{1}{4}\\big(${ln.S[i].map((v, k) => (k ? tp(v) : tn(v))).join(' + ')}\\big) = ${tn(ln.mu[i], 3)}`] });
const exSd = ln => i => {
  const mu = ln.mu[i];
  const vr = ln.S[i].reduce((a, v) => a + (v - mu) ** 2, 0) / 4;
  return {
    lines: [
      `\\sigma_{${i}}^2 = \\tfrac{1}{4}\\big[${ln.S[i].map(v => `(${tn(v)} - ${tp(mu, 3)})^2`).join(' + ')}\\big] = ${vr.toFixed(4)}`,
      `\\sqrt{\\sigma_{${i}}^2 + \\epsilon} = \\sqrt{${vr.toFixed(4)} + 0.00001} = ${ln.sd[i].toFixed(3)}`,
    ],
  };
};
const exLN = (ln, outN) => (i, j) => ({
  lines: [`${outN}[${i},${j}] = \\dfrac{R[${i},${j}] - \\mu_{${i}}}{\\sqrt{\\sigma_{${i}}^2+\\epsilon}} = \\dfrac{${tn(ln.S[i][j])} - ${tp(ln.mu[i], 3)}}{${ln.sd[i].toFixed(3)}} = ${tn(ln.out[i][j])}`],
  note: 'Lấy $\\mu$ và $\\sqrt{\\sigma^2+\\epsilon}$ ở hai cột bên trái (bấm vào để xem cách tính). Vì $\\gamma = 1$, $\\beta = 0$ nên đây là kết quả cuối.',
});
function exFfnHid(inN, Xin, F) {
  return (i, j) => {
    const pre = F.pre[i][j];
    return {
      lines: [
        `z[${i},${j}] = \\sum_k ${inN}[${i},k]\\,W_1[k,${j}] + b_1[${j}] = ${Xin[i].map((x, k) => `${tp(x)}\\cdot${tp(F.W.W1[k][j], 1)}`).join(' + ')} + ${tp(F.W.b1[j], 1)} = ${tn(pre)}`,
        `h[${i},${j}] = \\max(0,\\ ${tn(pre)}) = ${tn(F.hid[i][j])}`,
      ],
      note: pre <= 0 ? 'Giá trị âm nên ReLU trả về 0: nơ-ron này không kích hoạt với token này.' : 'Giá trị dương nên ReLU giữ nguyên.',
    };
  };
}
function exFfnOut(outN, F) {
  return (i, j) => {
    const act = [];
    F.hid[i].forEach((v, k) => { if (v > 0) act.push(`${tp(v)}\\cdot${tp(F.W.W2[k][j], 1)}`); });
    const body = act.length ? `${act.join(' + ')} + ${tp(F.W.b2[j], 1)}` : tp(F.W.b2[j], 1);
    return {
      lines: [`${outN}[${i},${j}] = \\sum_k h[${i},k]\\,W_2[k,${j}] + b_2[${j}] = ${body} = ${tn(F.out[i][j])}`],
      note: `Chỉ ${act.length} trên 8 nơ-ron có $h > 0$ nên chỉ chúng đóng góp vào tổng.`,
    };
  };
}

class PositionalEncoding(nn.Module):
    def __init__(self, d_model, max_len=64):
        super().__init__()
        pos = torch.arange(max_len).unsqueeze(1)          # (max_len, 1) ⟦2§pos = 0, 1, 2, \dots⟧
        div = 10000 ** (torch.arange(0, d_model, 2) / d_model) ⟦2§10000^{2i/d_{\text{model}}}⟧
        pe = torch.zeros(max_len, d_model) ⟦2⟧
        pe[:, 0::2] = torch.sin(pos / div)                # cột chẵn ⟦2§PE_{(pos,\,2i)} = \sin\big(pos / 10000^{2i/d_{\text{model}}}\big)⟧
        pe[:, 1::2] = torch.cos(pos / div)                # cột lẻ ⟦2§PE_{(pos,\,2i+1)} = \cos\big(pos / 10000^{2i/d_{\text{model}}}\big)⟧
        self.register_buffer('pe', pe)                    # hằng số, không học ⟦2⟧

    def forward(self, x):                                 # x: (B, T, d_model)
        return x + self.pe[: x.size(1)] ⟦2§X = X^{\text{emb}} + PE|10§Y = Y^{\text{emb}} + PE⟧


class MultiHeadAttention(nn.Module):
    def __init__(self, d_model, n_heads):

        self.d_k = d_model // n_heads ⟦3§d_k = d_{\text{model}} / h = 2⟧
        self.W_q = nn.Linear(d_model, d_model, bias=False) ⟦3,11,14§W^Q \in \mathbb{R}^{4\times 4}⟧
        self.W_k = nn.Linear(d_model, d_model, bias=False) ⟦3,11,14§W^K \in \mathbb{R}^{4\times 4}⟧
        self.W_v = nn.Linear(d_model, d_model, bias=False) ⟦3,11,14§W^V \in \mathbb{R}^{4\times 4}⟧
        self.W_o = nn.Linear(d_model, d_model, bias=False) ⟦6,12,15§W^O \in \mathbb{R}^{4\times 4}⟧

    def forward(self, query, key, value, mask=None):
        B, T_q, _ = query.shape ⟦3,11,14⟧
        T_k = key.size(1) ⟦3,11,14⟧
        Q = self.W_q(query)                               # (B, T_q, d_model) ⟦3§Q = XW^Q|11§Q = YW^Q|14§Q = Y'W^Q⟧
        K = self.W_k(key)                                 # (B, T_k, d_model) ⟦3§K = XW^K|11§K = YW^K|14§K = ZW^K⟧
        V = self.W_v(value)                               # (B, T_k, d_model) ⟦3§V = XW^V|11§V = YW^V|14§V = ZW^V⟧
        # Tách d_model thành h head, mỗi head d_k chiều ⟦3,4,11,14⟧
        Q_h = Q.view(B, T_q, self.h, self.d_k).transpose(1, 2) ⟦3,4,11,14§Q \to Q_1,\ Q_2⟧
        K_h = K.view(B, T_k, self.h, self.d_k).transpose(1, 2) ⟦3,4,11,14§K \to K_1,\ K_2⟧
        V_h = V.view(B, T_k, self.h, self.d_k).transpose(1, 2) ⟦3,6,11,12,14,15§V \to V_1,\ V_2⟧
        S = Q_h @ K_h.transpose(-2, -1) / math.sqrt(self.d_k) ⟦0,4,11,14§S_h = \dfrac{Q_h K_h^\top}{\sqrt{d_k}}⟧
        if mask is not None: ⟦11⟧

        heads = A @ V_h                                   # (B, h, T_q, d_k) ⟦0,6,12,15§\text{head}_h = A_h V_h⟧
        concat = heads.transpose(1, 2).contiguous().view(B, T_q, -1) ⟦6,12,15§\text{Concat}(\text{head}_1, \text{head}_2)⟧
        self.last = dict(Q=Q, K=K, V=V, S=S, A=A, heads=heads)  # để in ra xem ⟦15⟧
        return self.W_o(concat)                           # (B, T_q, d_model) ⟦6§\text{MultiHead}(X) = \text{Concat}\cdot W^O|12§\text{MaskedMHA}(Y) = \text{Concat}\cdot W^O|15§\text{CrossAttn} = \text{Concat}\cdot W^O⟧


class FeedForward(nn.Module):
    def __init__(self, d_model, d_ff):
        super().__init__()
        self.lin1 = nn.Linear(d_model, d_ff)              # W_1, b_1 ⟦8,17§W_1 \in \mathbb{R}^{4\times 8},\ b_1⟧

def translate(model, src_ids, tgt_vocab, max_len=20):

    'model = Transformer(len(src_vocab), len(tgt_vocab))',
    'load_demo_weights(model)',
    'model.eval()',
    'torch.set_grad_enabled(False)'.padEnd(46) + '# chỉ chạy thử, không tính gradient',
    '',
    c(`src_ids = torch.tensor([[${m.srcIds.join(', ')}]])`, m.srcTok.join(' '), '⟦1⟧'),
    c(`tgt_in = torch.tensor([[${m.tgtIds.join(', ')}]])`, m.tgtIn.join(' '), '⟦10⟧'),
    c(`tgt_out = torch.tensor([[${m.goldIds.join(', ')}]])`, m.tgtOut.join(' '), '⟦10,20⟧'),
    '',
    c('logits = model(src_ids, tgt_in)', `(1, 3, ${m.tgtVocab.length})`, TX`⟦19§\text{logits} = HW_{\text{vocab}}^\top + b⟧`),
    c('probs = logits.softmax(dim=-1)', 'ma trận P', TX`⟦20§P_t = \operatorname{softmax}(\text{logits}_t)⟧`),
    c('pred = probs.argmax(dim=-1)', 'từ có xác suất cao nhất', TX`⟦20§\hat{y}_t = \arg\max_v P_{t,v}⟧`),
    TX`loss = F.cross_entropy(logits.view(-1, logits.size(-1)), tgt_out.view(-1)) ⟦20§\mathcal{L} = -\tfrac{1}{3}\textstyle\sum_t \log P_{t,\,y_t^*}⟧`,
    '',
    c('print([tgt_vocab[i] for i in pred[0]])', q(m.pred.map(i => m.tgtVocab[i])), '⟦20⟧'),
    c('print(probs[0])', 'so với ma trận P ở bước 20', '⟦20⟧'),
    c('print(round(loss.item(), 3))', `trang ghi ${m.loss.toFixed(3)}`, '⟦20⟧'),
    c("print(model.decoder[0].cross_attn.last['A'][0, 0])", 'A_1 ở bước 15', '⟦15⟧'),
    c('print(translate(model, src_ids, tgt_vocab, max_len=3))', 'sinh từng từ', '⟦20⟧'),
  ].join('\n');
}

let PY_LINES = null;
function pyLines() {
  if (PY_LINES) return PY_LINES;
  const src = PY_MODEL.replace(/^\n/, '') + pyWeights() + pyRun();
  PY_LINES = src.split('\n').map((line, k) => {
    const mt = /^(.*?)\s*⟦([^⟧]*)⟧\s*$/.exec(line);
    const L = { n: k + 1, code: (mt ? mt[1] : line).replace(/\s+$/, ''), steps: [], tex: {} };
    if (mt) mt[2].split('|').forEach(g => {
      const [st, tx] = g.split('§');
      st.split(',').forEach(tok => {
        const r = tok.trim().split('-').map(Number);
        for (let s = r[0]; s <= (r.length > 1 ? r[1] : r[0]); s++) { if (!L.steps.includes(s)) L.steps.push(s); if (tx) L.tex[s] = tx.trim(); }
      });
    });
    return L;
  });
  return PY_LINES;
}

const PY_TOKEN = /(#.*$)|('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|\b(class|def|return|if|else|elif|for|while|in|import|from|as|is|not|and|or|None|True|False|with|lambda|break|continue|pass)\b|\b(self|super|range|len|print|dict|float|round|list|int)\b|(^\s*@[\w.]+)/g;
function hlPy(src) {
  let out = '', last = 0, mt;
  PY_TOKEN.lastIndex = 0;
  while ((mt = PY_TOKEN.exec(src))) {
    if (mt[0] === '') { PY_TOKEN.lastIndex++; continue; }
    out += esc(src.slice(last, mt.index));
    const cls = mt[1] ? 'c' : mt[2] ? 's' : mt[3] ? 'n' : mt[4] ? 'k' : mt[5] ? 'b' : 'd';
    out += `<span class="py-${cls}">${esc(mt[0])}</span>`;
    last = mt.index + mt[0].length;
  }
  return out + esc(src.slice(last));
}

/* ===== Khối code trong giao diện ===== */
function codeRow(L, o) {
  let text = o.dedent ? L.code.slice(o.dedent) : L.code;
  const ind = indentOf(text);
  text = text.trimStart().replace(/(\S)\s{2,}#/, '$1  #');
  const code = h('code', { class: 'cm-code', style: ind ? `--ind:${ind}` : null });
  code.innerHTML = hlPy(text) || '\u200b';
  return h('div', { class: 'cm-row' + (o.ctx ? ' ctx' : '') + (o.hit ? ' hit' : '') },
    h('span', { class: 'cm-ln', 'aria-hidden': 'true' }, L.n == null ? '' : String(L.n)),
    code,
    h('span', { class: 'cm-tex' }, o.tex ? tex(o.tex) : null, o.badge || null));
}
function StepCode(step) {
  const L = pyLines();
  const hits = [];
  L.forEach((l, k) => { if (l.steps.includes(step)) hits.push(k); });
  if (!hits.length) return null;
  const ctx = new Set();
  hits.forEach(k => {
    let ind = indentOf(L[k].code);
    for (let u = k - 1; u >= 0 && ind > 0; u--) {
      const c = L[u].code;
      if (!c.trim()) continue;
      const iu = indentOf(c);
      if (iu < ind) { if (!L[u].steps.includes(step)) ctx.add(u); ind = iu; }
    }
  });
  const idx = [...new Set(hits.concat([...ctx]))].sort((a, b) => a - b);
  const dedent = Math.min(...idx.map(k => indentOf(L[k].code)));
  const body = h('div', { class: 'cm-body' });
  idx.forEach((k, n) => {
    if (n > 0 && k > idx[n - 1] + 1) body.append(h('div', { class: 'cm-gap', 'aria-hidden': 'true' }, '⋯'));
    body.append(codeRow(L[k], { ctx: ctx.has(k), tex: ctx.has(k) ? null : L[k].tex[step], dedent }));
  });
  return h('div', { class: 'cm' },
    h('div', { class: 'cm-head' }, h('b', null, 'transformer.py'),
      h('span', null, step === 0 ? 'lõi của attention, dòng mờ là hàm chứa chúng' : `các dòng chạy ở bước ${step}, dòng mờ là hàm chứa chúng`)),
    body);
}
function Snippet(title, rows) {
  const body = h('div', { class: 'cm-body' });
  rows.forEach(r => {
    if (r[0] === '#out') body.append(h('pre', { class: 'cm-out' }, r[1]));
    else body.append(codeRow({ n: null, code: r[0] }, { tex: r[1] || null }));
  });
  return h('div', { class: 'cm cm-snip' }, h('div', { class: 'cm-head' }, h('b', null, title)), body);
}
const PyNotes = notes => h('div', { class: 'cm-notes' }, h('div', { class: 'cm-notes-t' }, 'Ghi chú PyTorch'), notes.map(n => h('p', null, rich(n))));

function pyBegin(step) { pyStep = step; pySlot = 0; }
function pyFormulaSlot() {
  const k = pySlot++, conf = pyConf()[pyStep] || {};
  if (k === 0) return h('div', { class: 'cm-wrap' }, StepCode(pyStep), (conf.snips || []).map(s => Snippet(s[0], s[1])), conf.notes ? PyNotes(conf.notes) : null);
  if (k === 1 && conf.second) return h('div', { class: 'cm-wrap' }, conf.second.map(s => Snippet(s[0], s[1])));
  return document.createDocumentFragment();
}
function pyTail(step) {
  const d = h('details', { class: 'more' }, h('summary', null, step === 0 ? 'Toàn bộ code PyTorch' : 'Xem các dòng này trong toàn bộ code'));
  let built = false;
  const build = () => { if (!built) { built = true; d.append(FullCode(step)); } };
  if (step === 0) { build(); d.open = true; }
  d.addEventListener('toggle', () => {
    if (!d.open) return;
    build();
    const hit = d.querySelector('.fc-scroll .cm-row.hit');
    if (hit) { const box = hit.closest('.fc-scroll'); box.scrollTop = Math.max(0, hit.offsetTop - 48); }
  });
  return d;
}
function copyText(text, status) {
  const done = ok => {
    status.textContent = ok ? 'Đã sao chép.' : 'Trình duyệt chặn sao chép; hãy chọn code rồi nhấn Ctrl+C.';
    setTimeout(() => { status.textContent = ''; }, 3500);
  };
  const fallback = () => {
    const ta = h('textarea', { class: 'sr', readonly: true });
    ta.value = text;
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    done(ok);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}
function FullCode(step) {
  const L = pyLines();
  const raw = L.map(l => l.code).join('\n') + '\n';
  const status = h('span', { class: 'fc-status', role: 'status' });
  const nHit = L.filter(l => l.steps.includes(step)).length;
  const bar = h('div', { class: 'fc-bar' },
    h('button', { type: 'button', class: 'fc-copy', onclick: () => copyText(raw, status) }, 'Sao chép toàn bộ code'),
    status,
    h('span', { class: 'fc-info' }, step === 0
      ? `${L.length} dòng, chạy được với PyTorch 2.x và in ra các ma trận của trang (lệch tối đa khoảng ${CODE_DIFF} do trang làm tròn). Bấm nhãn bước ở cuối dòng để tới bước đó.`
      : `${nHit} dòng tô sáng là các dòng chạy ở bước ${step}.`));
  const p2 = L.findIndex(l => l.code.startsWith('# ===== Phần 2'));
  const p3 = L.findIndex(l => l.code.startsWith('# ===== Phần 3'));
  const parts = [['Phần 1: mô hình', 0, p2], ['Phần 2: trọng số minh họa của trang', p2, p3], ['Phần 3: chạy ví dụ', p3, L.length]];
  const secs = parts.map(([title, a, b], si) => {
    const scroll = h('div', { class: 'fc-scroll' });
    let anyHit = false;
    for (let k = a; k < b; k++) {
      const l = L[k], hit = step > 0 && l.steps.includes(step);
      anyHit = anyHit || hit;
      const first = l.steps.filter(s => s > 0)[0];
      const overview = step === 0 && first != null;
      scroll.append(codeRow(l, {
        hit,
        tex: hit ? l.tex[step] || null : overview ? l.tex[first] || null : null,
        badge: overview ? h('button', { type: 'button', class: 'cm-step', onclick: () => go(first) }, `bước ${first}`) : null,
      }));
    }
    return h('details', { class: 'fc-sec', open: si !== 1 || anyHit ? true : null },
      h('summary', null, title, h('span', { class: 'fc-lines' }, `dòng ${a + 1}–${b}`)), scroll);
  });
  return h('div', { class: 'fullcode' }, bar, secs);
}

/* ===== Tên tensor và câu lệnh cho từng ma trận ===== */
const PIPE_PY = { proj: 'W_q, W_k, W_v', matmul: 'Q_h @ K_h.transpose(-2, -1)', scale: '/ math.sqrt(d_k)', mask: 'masked_fill', softmax: 'softmax(dim=-1)', matmul2: 'A @ V_h', concat: 'transpose, view', out: 'W_o' };
const PY_NAMES = {
  [TX`E_{\text{src}}`]: 'self.src_emb.weight', [TX`X^{\text{emb}}`]: 'x_emb[0]', PE: 'self.pos.pe[:3]', X: 'x[0]',
  Q: 'Q[0]', K: 'K[0]', V: 'V[0]',
  'W^Q': 'self.W_q.weight.T', 'W^K': 'self.W_k.weight.T', 'W^V': 'self.W_v.weight.T', 'W^O': 'self.W_o.weight.T',
  S_1: 'S[0, 0]', S_2: 'S[0, 1]', A_1: 'A[0, 0]', A_2: 'A[0, 1]',
  [TX`\text{head}_1`]: 'heads[0, 0]', [TX`\text{head}_2`]: 'heads[0, 1]', [TX`\text{Concat}`]: 'concat[0]',
  [TX`\text{MultiHead}(X)`]: 'self.self_attn(x, x, x)[0]', R: 'R[0]', [TX`\mu`]: 'mu[0]', [TX`\sqrt{\sigma^2+\epsilon}`]: 'torch.sqrt(var + 1e-5)[0]',
  "X'": 'x1[0]', h: 'hidden[0]', [TX`\text{FFN}(X')`]: 'self.ffn(x1)[0]',
  W_1: 'self.lin1.weight.T', b_1: 'self.lin1.bias', W_2: 'self.lin2.weight.T', b_2: 'self.lin2.bias',
  Z: 'z[0]', [TX`Y^{\text{emb}}`]: 'y_emb[0]', Y: 'y[0]', [TX`E_{\text{tgt}}`]: 'self.tgt_emb.weight', M: 'mask',
  [TX`\text{MaskedMHA}(Y)`]: 'self.self_attn(y, y, y, mask)[0]', "Y'": 'y1[0]', [TX`\text{CrossAttn}`]: 'self.cross_attn(y1, z, z)[0]', "Y''": 'y2[0]',
  [TX`\text{FFN}(Y'')`]: 'self.ffn(y2)[0]', H: 'h[0]', [TX`\text{logits}`]: 'logits[0]', [TX`W_{\text{vocab}}`]: 'self.out.weight', b: 'self.out.bias', P: 'probs[0]',
};
const pyName = name => PY_NAMES[name] || null;
const pyWo = (i, j) => `concat[0, ${i}] @ self.W_o.weight[${j}]`;
const pyFfo = (i, j) => `hidden[0, ${i}] @ self.lin2.weight[${j}] + self.lin2.bias[${j}]`;
const pyLn = (i, j) => `(R[0, ${i}, ${j}] - mu[0, ${i}, 0]) / torch.sqrt(var[0, ${i}, 0] + 1e-5)`;
const pyScore = (hh, i, j, s) => `Q_h[0, ${hh}, ${i}] @ K_h[0, ${hh}, ${j}] / math.sqrt(2)` + (s === 11 && j > i ? '  # rồi masked_fill thành -inf' : '');
const PY_RES = { 7: ['x', 'self.self_attn(x, x, x)'], 9: ['x1', 'self.ffn(x1)'], 13: ['y', 'self.self_attn(y, y, y, mask)'], 16: ['y1', 'self.cross_attn(y1, z, z)'], 18: ['y2', 'self.ffn(y2)'] };
const PY_CALC = {
  [TX`X^{\text{emb}}`]: (i, j) => `self.src_emb.weight[${m.srcIds[i]}, ${j}] * math.sqrt(4)`,
  [TX`Y^{\text{emb}}`]: (i, j) => `self.tgt_emb.weight[${m.tgtIds[i]}, ${j}] * math.sqrt(4)`,
  PE: (i, j) => `math.${j % 2 ? 'cos' : 'sin'}(${i} / 10000 ** (${j - (j % 2)} / 4))`,
  X: (i, j) => `x_emb[0, ${i}, ${j}] + self.pos.pe[${i}, ${j}]`,
  Y: (i, j) => `y_emb[0, ${i}, ${j}] + self.pos.pe[${i}, ${j}]`,
  Q: (i, j) => `query[0, ${i}] @ self.W_q.weight[${j}]`,
  K: (i, j) => `key[0, ${i}] @ self.W_k.weight[${j}]`,
  V: (i, j) => `value[0, ${i}] @ self.W_v.weight[${j}]`,
  S_1: (i, j, s) => pyScore(0, i, j, s),
  S_2: (i, j, s) => pyScore(1, i, j, s),
  A_1: (i, j) => `S[0, 0, ${i}].softmax(dim=-1)[${j}]`,
  A_2: (i, j) => `S[0, 1, ${i}].softmax(dim=-1)[${j}]`,
  [TX`\text{head}_1`]: (i, j) => `A[0, 0, ${i}] @ V_h[0, 0, :, ${j}]`,
  [TX`\text{head}_2`]: (i, j) => `A[0, 1, ${i}] @ V_h[0, 1, :, ${j}]`,
  [TX`\text{Concat}`]: (i, j) => `heads[0, ${j < 2 ? 0 : 1}, ${i}, ${j % 2}]`,
  [TX`\text{MultiHead}(X)`]: pyWo, [TX`\text{MaskedMHA}(Y)`]: pyWo, [TX`\text{CrossAttn}`]: pyWo,
  R: (i, j, s) => `${PY_RES[s][0]}[0, ${i}, ${j}] + ${PY_RES[s][1]}[0, ${i}, ${j}]`,
  [TX`\mu`]: i => `R[0, ${i}].mean()`,
  [TX`\sqrt{\sigma^2+\epsilon}`]: i => `torch.sqrt(((R[0, ${i}] - mu[0, ${i}]) ** 2).mean() + 1e-5)`,
  "X'": pyLn, Z: pyLn, "Y'": pyLn, "Y''": pyLn, H: pyLn,
  h: (i, j, s) => `torch.relu(${s === 17 ? 'y2' : 'x1'}[0, ${i}] @ self.lin1.weight[${j}] + self.lin1.bias[${j}])`,
  [TX`\text{FFN}(X')`]: pyFfo, [TX`\text{FFN}(Y'')`]: pyFfo,
  [TX`\text{logits}`]: (t, v) => `h[0, ${t}] @ self.out.weight[${v}] + self.out.bias[${v}]`,
  P: (t, v) => `logits[0, ${t}].softmax(dim=-1)[${v}]`,
  M: () => "S.masked_fill(mask, float('-inf'))  # ô True nhận -inf",
};
function pyCellCode(mx, i, j) {
  const o = mx.o, py = mx.py;
  const isCol = !o.cols && o.data[0].length === 1, isRow = !o.rows && o.data.length === 1;
  const tail = isCol ? `${i}, 0` : isRow ? `${j}` : `${i}, ${j}`;
  let idx;
  if (py.endsWith('[:3]')) idx = `${py.slice(0, -4)}[${i}, ${j}]`;
  else { const mt = /^(.*)\[([^\]:]*)\]$/.exec(py); idx = mt ? `${mt[1]}[${mt[2]}, ${tail}]` : `${py}[${tail}]`; }
  const v = o.data[isRow ? 0 : i][isCol ? 0 : j];
  const val = o.name === 'M' ? (j > i ? 'True' : 'False') : '≈ ' + (isFinite(v) ? tn(v, o.digits == null ? 2 : o.digits) : '-inf');
  const calc = PY_CALC[o.name] ? PY_CALC[o.name](i, j, pyStep) : null;
  const lines = [`${idx}  # ${val}`];
  if (calc) lines.push('# tính bằng câu lệnh:', calc);
  const pre = h('pre', { class: 'ex-code' });
  pre.innerHTML = lines.map(hlPy).join('\n');
  return pre;
}

/* ===== Mô hình & nhãn ===== */
const m = buildModel(59861);
const SRC = m.srcTok.map(esc), TGT = m.tgtIn.map(esc), VOC = m.tgtVocab.map(esc);
const POS = ['pos 0', 'pos 1', 'pos 2'];
const W4 = (name, W) => mat(name, W, IDX(4), IDX(4), { digits: 1 });

function AddNormGroups({ inN, subN, outN, inp, sub, ln, rows, auto }) {
  return [
    Group([
      mat(inN, inp, rows, IDX(4)),
      '+',
      mat(subN, sub, rows, IDX(4)),
      '=',
      mat('R', ln.S, rows, IDX(4), { note: 'tổng của kết nối tắt', explain: exSum('R', inN, subN, inp, sub, ln.S) }),
    ]),
    Group([
      mat('\\mu', ln.mu.map(v => [v]), rows, null, { kind: 'plain', digits: 3, note: 'trung bình hàng', explain: exMu(ln) }),
      mat('\\sqrt{\\sigma^2+\\epsilon}', ln.sd.map(v => [v]), rows, null, { kind: 'plain', digits: 3, note: 'độ lệch chuẩn', explain: exSd(ln) }),
      '\\to',
      mat(outN, ln.out, rows, IDX(4), { note: 'mỗi hàng: trung bình 0, phương sai 1', explain: exLN(ln, outN) }),
    ], { auto: [2, auto[0], auto[1]] }),
  ];
}
function FfnGroups({ inN, outN, inp, F, rows, from, auto }) {
  return [
    Group([mat('h', F.hid, rows, IDX(8), {
      note: `$h = \\max(0,\\ ${inN}W_1 + b_1)$; ô gạch chéo là nơi ReLU cắt về 0`,
      mark: (i, j) => (F.pre[i][j] <= 0 ? 'zero' : ''),
      explain: exFfnHid(inN, inp, F),
    })], { auto: [0, auto[0], auto[1]] }),
    Group([mat(outN, F.out, rows, IDX(4), { note: 'thu về 4 chiều', explain: exFfnOut(outN, F) })]),
    More(`Xem đầu vào $${inN}$ và trọng số $W_1, b_1, W_2, b_2$`,
      Group([mat(inN, inp, rows, IDX(4), { note: `từ bước ${from}` })]),
      Group([mat('W_1', F.W.W1, IDX(4), IDX(8), { digits: 1 }), mat('b_1', [F.W.b1], null, IDX(8), { digits: 1 })]),
      Group([mat('W_2', F.W.W2, IDX(8), IDX(4), { digits: 1 }), mat('b_2', [F.W.b2], null, IDX(4), { digits: 1 })])),
  ];
}
function HeadsMore(A, rows) {
  return More('Xem từng head, $\\text{Concat}$, $V$ và $W^O$',
    Group([
      ...A.heads.map((hd, k) => mat(`\\text{head}_${k + 1}`, hd.O, rows, IDX(2), { explain: exWsum(`\\text{head}_${k + 1}`, `A_${k + 1}`, `V_${k + 1}`, hd.A, hd.Vh, hd.O, k) })),
      '\\to',
      mat('\\text{Concat}', A.C, rows, IDX(4), { groups: HEADS, explain: exConcat(A.C) }),
    ]),
    Group([mat('V', A.V, A.V.length === 3 && A === m.decCross ? SRC : rows, IDX(4), { groups: HEADS }), W4('W^O', A.W.O)]));
}
const exPE = (i, j) => {
  const i2 = j - (j % 2), fn = j % 2 === 0 ? '\\sin' : '\\cos';
  return {
    lines: [`PE[${i},${j}] = ${fn}\\!\\left(\\dfrac{${i}}{10000^{${i2}/4}}\\right) = ${fn}(${(i / Math.pow(10000, i2 / 4)).toFixed(4)}) = ${tn(m.pe[i][j])}`],
    note: `pos = ${i}; chiều ${j} là chiều ${j % 2 === 0 ? `chẵn ($2i = ${i2}$) nên dùng sin` : `lẻ ($2i+1 = ${j}$) nên dùng cos`}.`,
  };
};

      Prose('Lớp tuyến tính chấm điểm từng từ trong từ điển đích: nhân vector 4 chiều của mỗi vị trí với hàng trọng số của từng từ, rồi cộng bias. Kết quả là 8 điểm gọi là logit; logit càng cao thì từ đó càng được ưu tiên.'),
      Formula('\\text{logits} = H\\,W_{\\text{vocab}}^\\top + b,\\qquad W_{\\text{vocab}} \\in \\mathbb{R}^{8\\times 4}'),
      Hint(),
      Group([mat('\\text{logits}', m.logits, TGT, VOC, {
        note: 'hàng: vị trí, cột: từ trong từ điển',
        explain: (t, v) => ({
          lines: [`\\text{logits}[${t},${v}] = \\sum_k H[${t},k]\\,W_{\\text{vocab}}[${v},k] + b[${v}] = ${m.Hd[t].map((x, k) => `${tp(x)}\\cdot${tp(m.Wout[v][k], 1)}`).join(' + ')} + ${tp(m.outBias[v], 1)} = ${tn(m.logits[t][v])}`],
          note: `Điểm của từ ${tokHtml(m.tgtVocab[v])} tại vị trí sau ${tokHtml(m.tgtIn[t])}.`,
        }),
      })], { auto: [0, 2, 4] }),
      Note('Các hàng của $W_{\\text{vocab}}$ ứng với “Tôi”, “yêu”, “mèo” được chọn tay để ví dụ dịch đúng. Trong mô hình thật, chúng được học qua huấn luyện.'),
      More('Xem $H$, $W_{\\text{vocab}}$ và $b$',
        Group([mat('H', m.Hd, TGT, IDX(4), { note: 'từ bước 18' })]),
        Group([mat('W_{\\text{vocab}}', m.Wout, VOC, IDX(4), { digits: 1 }), mat('b', m.outBias.map(v => [v]), VOC, null, { digits: 1 })])),
    ],
  },
  {
    part: 'out', block: ['Softmax', 'soft'], short: 'Softmax: dự đoán', title: 'Softmax: xác suất của từ tiếp theo',
    render: () => {
      const last = m.tgtIn.length - 1;
      return [
        Prose('Softmax trên từng hàng biến logit thành phân phối xác suất. Khi dịch thật, ta lấy từ có xác suất cao nhất ở vị trí cuối, nối vào đầu vào Decoder rồi lặp lại cho tới khi gặp <span class="tok">&lt;/s&gt;</span>. Nhờ mặt nạ nhân quả, hàng cuối này giống hệt kết quả khi sinh từng từ một.'),
        Formula('P_t = \\operatorname{softmax}(\\text{logits}_t),\\qquad \\hat{y}_t = \\arg\\max_v P_{t,v}'),
        Hint(),
        Group([mat('P', m.probs, TGT, VOC, {
          kind: 'prob', note: 'ô viền đậm là xác suất cao nhất của mỗi hàng',
          mark: (i, j) => (j === m.pred[i] ? 'arg' : ''),
          explain: (t, v) => {
            const z = m.logits[t], e = z.map(Math.exp), sum = e.reduce((a, b) => a + b, 0);
            return {
              lines: [
                `\\sum_u e^{\\text{logits}[${t},u]} = ${e.map(x => tn(x)).join(' + ')} = ${tn(sum)}`,
                `P[${t},${v}] = \\dfrac{e^{${tn(z[v])}}}{${tn(sum)}} = \\dfrac{${tn(e[v])}}{${tn(sum)}} = ${tn(m.probs[t][v])}`,
              ],
            };
          },
        })], { auto: [0, last, m.pred[last]] }),
        Bars(m.probs, m.tgtVocab, m.tgtIn, last),
        h('h3', { class: 'sub' }, 'Khi huấn luyện'),
        Prose('Cả 3 vị trí được tính song song và so với đáp án bằng hàm mất mát cross-entropy: xác suất gán cho từ đúng càng gần 1 thì mất mát càng nhỏ. Gradient của mất mát này được dùng để cập nhật mọi ma trận trọng số bạn đã gặp.'),
        Table(['Sau token', 'Đáp án', '$P$ của đáp án', '$-\\log P$'],
          m.goldIds.map((g, t) => [tokHtml(m.tgtIn[t]), tokHtml(m.tgtOut[t]), fmt(m.probs[t][g]), m.lossTerms[t].toFixed(3)]), [2, 3]),
        Formula(`\\mathcal{L} = -\\dfrac{1}{3}\\sum_{t} \\log P_{t,\\,y_t^*} = \\dfrac{${m.lossTerms.map(v => v.toFixed(3)).join(' + ')}}{3} = ${m.loss.toFixed(3)}`),
        Note('Hết 20 bước. Bấm “Làm lại” để xem từ đầu, hoặc bấm vào một khối trên sơ đồ để quay lại bước đó.'),
      ];
    },
  },
];

/* ===== Điều khiển ===== */
const N = STEPS.length;
const PART = { intro: 'Tổng quan', enc: 'Encoder', dec: 'Decoder', out: 'Đầu ra' };
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pane = $('stepPane'), host = $('figScroll'), figPane = $('figurePane');
host.innerHTML = buildFigure(m);
const svg = $('arch');
const nodeEls = Array.from(svg.querySelectorAll('[data-node]'));
const edgeEls = Array.from(svg.querySelectorAll('[data-edge]'));
const PLAY_D = 'M8 5.5v13l10.5-6.5z', PAUSE_D = 'M7.5 5h3.2v14H7.5zM13.3 5h3.2v14h-3.2z';
let cur = 0, playing = false, timer = null;

const segs = STEPS.map((s, i) => {
  const b = h('button', { type: 'button', class: 'p-seg' + ([1, 10, 19].includes(i) ? ' gap' : ''), 'aria-label': i === 0 ? 'Tổng quan' : `Bước ${i}: ${s.short}`, onclick: () => go(i) });
  $('pTrack').append(b);
  return b;
});

function stateFor(steps) {
  if (cur === 0) return 'done';
  if (steps.includes(cur)) return 'active';
  return cur > Math.min(...steps) ? 'done' : 'todo';
}
function paintFigure() {
  const paint = (el, steps) => { const st = stateFor(steps); el.classList.toggle('active', st === 'active'); el.classList.toggle('done', st === 'done'); };
  nodeEls.forEach(el => paint(el, FIG_NODES[el.dataset.node]));
  edgeEls.forEach(el => paint(el, FIG_EDGES[el.dataset.edge]));
  svg.classList.toggle('show-pred', cur === N - 1);
}
function centerActive(smooth) {
  if (figPane.classList.contains('collapsed') || host.scrollHeight <= host.clientHeight + 2) return;
  const act = nodeEls.filter(el => el.classList.contains('active'));
  if (!act.length) return;
  const c = host.getBoundingClientRect();
  let top = Infinity, bottom = -Infinity;
  act.forEach(el => { const r = el.getBoundingClientRect(); top = Math.min(top, r.top); bottom = Math.max(bottom, r.bottom); });
  host.scrollBy({ top: (top + bottom) / 2 - (c.top + c.height / 2), behavior: smooth && !reduceMotion ? 'smooth' : 'auto' });
}
function renderStep() {
  const s = STEPS[cur];
  let content;
  pyBegin(cur);
  try { content = s.render(); if (MODE === 'py') content = [content, pyTail(cur)]; } catch (err) { console.error(err); content = [Note('Không hiển thị được bước này: ' + esc(err.message))]; }
  pane.replaceChildren(h('article', { class: 'step' },
    h('div', { class: 'step-head' },
      cur > 0 ? h('span', null, `Bước ${cur} trên ${N - 1}`) : null,
      h('span', { class: 'chip' }, PART[s.part]),
      s.block ? h('span', { class: `chip chip-block k-${s.block[1]}` }, s.block[0]) : null,
      ModeSwitch()),
    h('h2', { class: 'step-title' }, rich(s.title)),
    content));
}
function paintControls() {
  const last = cur === N - 1;
  $('btnPrev').disabled = cur === 0;
  $('nextLbl').textContent = cur === 0 ? 'Bắt đầu' : last ? 'Làm lại' : 'Tiếp';
  $('btnNext').setAttribute('aria-label', cur === 0 ? 'Bắt đầu' : last ? 'Làm lại từ đầu' : 'Bước tiếp theo');
  const label = cur === 0 ? '<b>Tổng quan</b>' : `<b>${cur}/${N - 1}</b>${esc(STEPS[cur].short)}`;
  $('pText').innerHTML = label;
  $('figNow').innerHTML = cur === 0 ? '<b>Tổng quan</b>' : `<b>Bước ${cur}:</b> ${esc(STEPS[cur].short)}`;
  segs.forEach((b, i) => { b.classList.toggle('cur', i === cur); b.classList.toggle('done', i < cur); if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
}
function go(i, opts) {
  opts = opts || {};
  i = Math.max(0, Math.min(N - 1, i));
  const changed = i !== cur;
  cur = i;
  renderStep(); paintFigure(); paintControls();
  requestAnimationFrame(() => centerActive(!opts.initial));
  if (changed) {
    const stick = window.matchMedia('(min-width: 980px)').matches ? 0 : figPane.offsetHeight;
    const y = pane.getBoundingClientRect().top + window.scrollY - stick - 8;
    if (window.scrollY > y) window.scrollTo({ top: y, behavior: 'auto' });
    $('announce').textContent = `${cur === 0 ? 'Tổng quan' : 'Bước ' + cur}: ${STEPS[cur].title}`;
  }
  writeHash();
  if (playing) restartTimer();
}
function restartTimer() {
  clearInterval(timer);
  timer = setInterval(() => { if (cur >= N - 1) setPlaying(false); else go(cur + 1); }, 4500);
}
function setPlaying(p) {
  playing = p;
  clearInterval(timer); timer = null;
  $('btnPlay').setAttribute('aria-pressed', p ? 'true' : 'false');
  $('playLbl').textContent = p ? 'Tạm dừng' : 'Tự chạy';
  $('btnPlay').setAttribute('aria-label', p ? 'Tạm dừng tự chạy' : 'Tự chạy từng bước');
  $('icoPlay').setAttribute('d', p ? PAUSE_D : PLAY_D);
  if (p) { if (cur === N - 1) go(0); else go(cur + 1); }
}

$('btnNext').addEventListener('click', () => { if (cur === N - 1) { setPlaying(false); go(0); } else go(cur + 1); });
$('btnPrev').addEventListener('click', () => go(cur - 1));
$('btnPlay').addEventListener('click', () => setPlaying(!playing));
nodeEls.forEach(el => {
  const jump = () => go(Math.min(...FIG_NODES[el.dataset.node]));
  el.addEventListener('click', jump);
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jump(); } });
});
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('input, textarea, select'))) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(N - 1); }
  else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); setMode(MODE === 'py' ? 'math' : 'py'); }
});
$('figToggle').addEventListener('click', () => {
  const col = figPane.classList.toggle('collapsed');
  $('figToggle').textContent = col ? 'Mở sơ đồ' : 'Thu gọn';
  $('figToggle').setAttribute('aria-expanded', col ? 'false' : 'true');
  if (!col) requestAnimationFrame(() => centerActive(false));
});
let resizeRaf = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(() => centerActive(false)); });

function writeHash() {
  try { history.replaceState(null, '', '#buoc-' + cur + (MODE === 'py' ? '-pytorch' : '')); } catch (err) { /* bỏ qua khi bị sandbox chặn */ }
}
function ModeSwitch() {
  const b = (md, label) => h('button', { type: 'button', 'data-mode': md, 'aria-pressed': MODE === md ? 'true' : 'false', onclick: () => setMode(md) }, label);
  return h('div', { class: 'mode-switch', role: 'group', 'aria-label': 'Chế độ hiển thị', title: 'Phím tắt: P' }, b('math', 'Công thức'), b('py', 'PyTorch'));
}
function setMode(md) {
  if (md === MODE) return;
  MODE = md;
  const y = window.scrollY;
  renderStep();
  window.scrollTo(0, y);
  writeHash();
  const btn = pane.querySelector(`.mode-switch [data-mode="${md}"]`);
  if (btn) btn.focus({ preventScroll: true });
  $('announce').textContent = md === 'py' ? 'Đã chuyển sang code PyTorch' : 'Đã chuyển sang công thức';
}
const fromHash = /buoc-(\d+)(-pytorch)?/.exec(location.hash);
if (fromHash && fromHash[2]) MODE = 'py';
cur = -1;
go(fromHash ? +fromHash[1] : 0, { initial: true });

})();
</script>
</body>
</html>
