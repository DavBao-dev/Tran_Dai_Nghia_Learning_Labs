function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeExam(seed) {
  const R = mulberry32(seed), ri = (a, b) => a + Math.floor(R() * (b - a + 1)), pick = a => a[Math.floor(R() * a.length)];
  const Q = [];
  /* ---- Nhận biết ---- */
  Q.push({ id: 'e1', level: 'NB', type: 'mcq', q: 'Trong <code>nn.Conv2d(1, 2, kernel_size=3, stride=1, padding=1)</code>, tham số <code>padding=1</code> có tác dụng gì?', options: [
    { t: 'Thêm một vòng số 0 quanh input để kernel đặt được cả ở mép ảnh; với k = 3, s = 1 thì output giữ nguyên kích thước', why: 'H_out = ⌊(H + 2·1 − 3)/1⌋ + 1 = H.' },
    { t: 'Bỏ đi một hàng và một cột ở mép ảnh', why: 'Padding thêm vào, không bỏ đi.' },
    { t: 'Cộng thêm 1 vào mọi pixel', why: 'Đó không phải padding; giá trị đệm là 0 và chỉ nằm ở viền.' },
    { t: 'Cho kernel dịch 1 ô mỗi bước', why: 'Đó là stride.' }], answer: 0, explain: 'Padding = số vòng số 0 đệm quanh input. Không có padding, kernel 3 × 3 không thể đặt tâm ở pixel mép, nên output nhỏ đi 2 hàng, 2 cột.' });
  const rv = Array.from({ length: 4 }, () => pick([-2.5, -1.5, -1, -0.5, 0, 0.5, 1.25, 2, 3]));
  if (!rv.some(v => v < 0)) rv[0] = -1.5; if (!rv.some(v => v > 0)) rv[3] = 2;
  Q.push({ id: 'e2', level: 'NB', type: 'nums', q: `Tính ReLU cho các số: ${rv.map(v => fv(v)).join(', ')}.`, labels: rv.map(v => `ReLU(${fv(v)}) =`), answer: rv.map(v => Math.max(0, v)), explain: `ReLU(x) = max(0, x): ${rv.map(v => `max(0, ${fv(v)}) = ${fv(Math.max(0, v))}`).join('; ')}.` });
  const fc = pick([4, 8, 16]), fh = pick([2, 3, 4]);
  Q.push({ id: 'e3', level: 'NB', type: 'num', q: `Tensor có shape [1, ${fc}, ${fh}, ${fh}] đi qua <code>nn.Flatten()</code>. Vector cho mỗi ảnh có bao nhiêu phần tử?`, answer: fc * fh * fh, tol: 0.1, explain: `C·H·W = ${fc}·${fh}·${fh} = <b>${fc * fh * fh}</b>. Flatten không thêm, không bớt phần tử; output shape [1, ${fc * fh * fh}].` });
  /* ---- Thông hiểu ---- */
  Q.push({ id: 'e4', level: 'TH', type: 'mcq', q: 'Lớp <code>nn.Conv2d(2, 4, kernel_size=3)</code> nhận input 2 kênh. Một ô của kênh ra số 3 được tính như thế nào?', options: [
    { t: 'Chỉ dùng kênh vào số 1 (vì 3 = 1 + 2)', why: 'Không có quy tắc ghép kênh theo số thứ tự.' },
    { t: 'Tổng các tích trên kênh vào 0 (với lát W[3, 0]) + tổng các tích trên kênh vào 1 (với lát W[3, 1]) + bias b[3]', why: 'Mỗi kênh ra dùng MỌI kênh vào, mỗi kênh vào có lát kernel riêng, cộng một bias.' },
    { t: 'Lấy trung bình hai kênh vào rồi nhân với một kernel 3 × 3', why: 'Mỗi kênh vào có lát kernel riêng, không lấy trung bình trước.' },
    { t: 'Tính riêng hai kênh và giữ cả hai kết quả trong kênh ra 3', why: 'Một ô của kênh ra là một số duy nhất.' }], answer: 1, explain: 'y[3, i, j] = Σ<sub>c=0..1</sub> Σ<sub>u,v</sub> x[c, i+u, j+v]·W[3, c, u, v] + b[3]. Weight có shape [4, 2, 3, 3].' });
  const add = pick([3, 5, 10, 100]);
  Q.push({ id: 'e5', level: 'TH', type: 'mcq', q: `Logits của một ảnh là [2.0, 0.5, −1.0]. Nếu cộng thêm ${add} vào cả ba logits, điều gì xảy ra?`, options: [
    { t: 'Xác suất Softmax và lớp dự đoán đều không đổi', why: `e^(z+${add}) = e^${add}·e^z: thừa số chung triệt tiêu giữa tử và mẫu.` },
    { t: 'Xác suất của cả ba lớp cùng tăng', why: 'Tổng xác suất luôn bằng 1 nên không thể cùng tăng.' },
    { t: 'Lớp dự đoán đổi thành lớp có logit nhỏ nhất', why: 'Thứ tự giữa các logit không đổi.' },
    { t: 'Mạng báo lỗi vì logits lớn hơn 1', why: 'Logits là số thực bất kỳ.' }], answer: 0, explain: 'Softmax chỉ phụ thuộc vào <b>hiệu</b> giữa các logit. Đó cũng là lý do có thể trừ max trước khi lấy mũ để ổn định số học.' });
  Q.push({ id: 'e6', level: 'TH', type: 'mcq', q: 'Conv2d #1 của mạng (input 8 × 8, k = 3, p = 1) đang dùng stride 1. Nếu đổi sang <b>stride 2</b> và giữ nguyên các thứ khác, điều gì xảy ra?', options: [
    { t: 'Output 4 × 4 thay vì 8 × 8; shape ở mọi lớp sau đều đổi, phải sửa Linear(16, 3) thành Linear(4, 3)', why: '⌊(8 + 2 − 3)/2⌋ + 1 = 4; kích thước giảm làm thay đổi shape ở mọi lớp phía sau.' },
    { t: 'Output vẫn 8 × 8, chỉ chạy nhanh gấp đôi', why: 'Stride lớn hơn thì có ít vị trí đặt kernel hơn → output nhỏ hơn.' },
    { t: 'Số kênh ra tăng gấp đôi', why: 'Số kênh ra do out_channels quyết định.' },
    { t: 'Số tham số của Conv2d #1 tăng', why: 'Số tham số chỉ phụ thuộc C_in, C_out, k — không phụ thuộc stride.' }], answer: 0, explain: 'Stride 2: kernel nhảy 2 ô mỗi lần, số vị trí theo mỗi chiều = ⌊(8 + 2 − 3)/2⌋ + 1 = 4. Vì vậy sau MaxPool chỉ còn 2 × 2, rồi 1 × 1 sau MaxPool thứ hai → Flatten ra 4 số, phải sửa Linear(16, 3) thành Linear(4, 3).' });
  /* ---- Vận dụng ---- */
  const win = Array.from({ length: 3 }, () => Array.from({ length: 3 }, () => ri(0, 3)));
  const ker = Array.from({ length: 3 }, () => Array.from({ length: 3 }, () => pick([-1, 0, 1, 2])));
  const bb = pick([-2, -1, 0.5, 1]);
  const T = TN.convTerms([win], [[ker]], [bb], 1, 0, 0, 0, 0);
  const flipT = TN.convTerms([win], [[ker.slice().reverse().map(r => r.slice().reverse())]], [bb], 1, 0, 0, 0, 0);
  Q.push({ id: 'e7', level: 'VD', type: 'num', q: `Cửa sổ input 3 × 3 = <code>${JSON.stringify(win)}</code>, kernel = <code>${JSON.stringify(ker).replace(/-/g, '−')}</code>, bias = ${fv(bb)}. Tính giá trị ô output (giống <code>nn.Conv2d</code>, không lật kernel).`, answer: T.y,
    explain: `y = ${T.terms.map(t => `${t.x}·${fpar(t.w)}`).join(' + ')} + ${fpar(bb)} = ${T.terms.map(t => fpar(t.prod)).join(' + ')} + ${fpar(bb)} = <b>${fv(T.y)}</b>.`,
    diagnose: v => (Math.abs(v - T.sum) < 0.011 && bb !== 0 ? 'Bạn quên cộng bias.' : Math.abs(v - flipT.y) < 0.011 && Math.abs(flipT.y - T.y) > 0.011 ? 'Bạn đã lật kernel 180° — Conv2d của PyTorch không lật.' : '') });
  const Hin = pick([28, 32]), k = pick([3, 5]), pd = pick([0, (k - 1) / 2]), cin = pick([1, 3]), cout = pick([8, 16]);
  const H1 = Math.floor((Hin + 2 * pd - k) / 1) + 1, H2 = Math.floor((H1 - 2) / 2) + 1, P = cout * cin * k * k + cout;
  Q.push({ id: 'e8', level: 'VD', type: 'nums', q: `Input [1, ${cin}, ${Hin}, ${Hin}] → <code>nn.Conv2d(${cin}, ${cout}, kernel_size=${k}, stride=1, padding=${pd})</code> → ReLU → <code>nn.MaxPool2d(2, 2)</code>. Tính: (a) H sau Conv; (b) H sau MaxPool; (c) số tham số học được của lớp Conv.`, labels: ['(a) H sau Conv =', '(b) H sau MaxPool =', '(c) số tham số ='], answer: [H1, H2, P], tol: 0.1,
    explain: `(a) ⌊(${Hin} + 2·${pd} − ${k})/1⌋ + 1 = <b>${H1}</b> → tensor [1, ${cout}, ${H1}, ${H1}]. (b) ReLU giữ shape; MaxPool: ⌊(${H1} − 2)/2⌋ + 1 = <b>${H2}</b>. (c) ${cout}·${cin}·${k}·${k} + ${cout} = <b>${P}</b>.`,
    diagnose: v => (v[2] === cout * cin * k * k ? 'Ở (c) đừng quên cộng bias.' : v[2] === cout * k * k + cout && cin > 1 ? 'Ở (c) phải nhân thêm số kênh vào C_in.' : '') });
  const M = Array.from({ length: 4 }, () => Array.from({ length: 4 }, () => ri(0, 9))), MP = TN.pool2d([M], 2, 2, 'max').y[0];
  Q.push({ id: 'e9', level: 'VD', type: 'nums', q: `Áp dụng <code>nn.MaxPool2d(kernel_size=2, stride=2)</code> cho ma trận 4 × 4: <code>${JSON.stringify(M)}</code>. Điền output 2 × 2.`, labels: ['y[0,0] =', 'y[0,1] =', 'y[1,0] =', 'y[1,1] ='], answer: MP.flat(), tol: 0.01,
    explain: `Cửa sổ trên trái max(${M[0][0]}, ${M[0][1]}, ${M[1][0]}, ${M[1][1]}) = ${MP[0][0]}; trên phải max(${M[0][2]}, ${M[0][3]}, ${M[1][2]}, ${M[1][3]}) = ${MP[0][1]}; dưới trái max(${M[2][0]}, ${M[2][1]}, ${M[3][0]}, ${M[3][1]}) = ${MP[1][0]}; dưới phải max(${M[2][2]}, ${M[2][3]}, ${M[3][2]}, ${M[3][3]}) = ${MP[1][1]}.` });
  const x = [pick([1, 2]), pick([-1, 0.5, 1]), pick([2, -2, 1.5])];
  const W = [[pick([1, 0.5, -1]), pick([2, -1, 0.5]), pick([0.5, 1, -0.5])], [pick([-1, 0, 1]), pick([1, 0.5, -0.5]), pick([-1, 1, 2])]];
  const b = [pick([0, 0.5, -0.5]), pick([1, -1, 0])];
  const y = TN.linear(x, W, b), S = TN.softmax(y), top = TN.argmax(y);
  Q.push({ id: 'e10', level: 'VD', type: 'nums', q: `Lớp Linear có x = [${x.map(v => fv(v)).join(', ')}], W = [${W.map(r => '[' + r.map(v => fv(v)).join(', ') + ']').join(', ')}], b = [${b.map(v => fv(v)).join(', ')}]. (a) Tính hai logits y₀, y₁. (b) Tính xác suất Softmax của lớp có logit lớn hơn (làm tròn 3 chữ số; nếu hai logits bằng nhau thì p = 0.5).`, labels: ['y₀ =', 'y₁ =', 'p (lớp lớn hơn) ='], answer: [y[0], y[1], S.p[top]], tol: 0.011,
    explain: `y₀ = ${W[0].map((w, i) => `${fpar(w)}·${fpar(x[i])}`).join(' + ')} + ${fpar(b[0])} = <b>${fv(y[0])}</b>; y₁ = ${W[1].map((w, i) => `${fpar(w)}·${fpar(x[i])}`).join(' + ')} + ${fpar(b[1])} = <b>${fv(y[1])}</b>. Softmax hai lớp: p = e<sup>${fv(y[top])}</sup> / (e<sup>${fv(y[0])}</sup> + e<sup>${fv(y[1])}</sup>) = 1 / (1 + e<sup>${fv(y[1 - top] - y[top])}</sup>) ≈ <b>${fx(S.p[top], 3)}</b>.` });
  return Q;
}

const Exam = (() => {
  let root, list, scoreEl, boxes = [], seed = 0;
  function update() {
    const ans = boxes.filter(b => b.dataset.result === 'ok' || b.dataset.result === 'no').length, ok = boxes.filter(b => b.dataset.result === 'ok').length;
    const done = boxes.filter(b => b.dataset.result).length;
    scoreEl.innerHTML = `<b>${ok}/10</b> điểm <span class="small muted">· đã trả lời ${ans}/10${done > ans ? ` · bỏ trống ${done - ans}` : ''}${Progress.d.exam != null ? ` · điểm cao nhất: ${Progress.d.exam}/10` : ''}</span>`;
    if (done === 10) {
      if (Progress.d.exam == null || ok > Progress.d.exam) { Progress.d.exam = ok; Progress.save(); }
      $('#examMsg').innerHTML = ok >= 8 ? '🎉 Rất tốt! Bạn nắm vững cơ chế CNN.' : ok >= 5 ? '👍 Khá. Xem lại lời giải các câu sai rồi bấm “Làm lại” (số liệu sẽ đổi).' : '📚 Hãy ôn lại phần 🎓 Học từng bước rồi làm lại.';
    }
  }
  function build() {
    Player.pauseAll();
    list.innerHTML = ''; boxes = [];
    const Q = makeExam(seed);
    const groups = [['NB', 'Nhận biết (3 câu)'], ['TH', 'Thông hiểu (3 câu)'], ['VD', 'Vận dụng (4 câu)']];
    let n = 0;
    for (const [lv, title] of groups) {
      list.append(el('h3', { class: 'gap-top', text: title }));
      for (const q of Q.filter(x => x.level === lv)) { const b = QKit.render(q, { num: ++n, retry: false, onResult: () => update() }); boxes.push(b); list.append(b); }
    }
    $('#examMsg').textContent = '';
    update();
  }
  function init() {
    root = $('#examRoot');
    seed = Store.get('exam-seed', 0) || 20261016;
    root.innerHTML = `<div class="viewhead"><h2>📝 Đánh giá kiến thức — 10 câu</h2><span class="small muted">3 câu nhận biết · 3 câu thông hiểu · 4 câu vận dụng. Mỗi câu 1 điểm. Bấm “Kiểm tra” ở từng câu để xem lời giải chi tiết.</span></div>
      <div class="score" role="status" aria-live="polite"><span id="examScore"></span><span class="spacer"></span><span id="examMsg" class="small"></span>
        <button type="button" class="btn primary sm" id="examSubmit">✔ Nộp bài (chấm mọi câu)</button><button type="button" class="btn sm" id="examRetry">↺ Làm lại (đổi số liệu)</button></div>
      <div id="examList"></div>`;
    list = $('#examList'); scoreEl = $('#examScore');
    $('#examSubmit').onclick = () => {
      boxes.forEach(b => { if (b.isAnswered()) return; const nums = [...b.querySelectorAll('.numrow input')]; const full = b.querySelector('input:checked') || (nums.length && nums.every(i => isFinite(parseNum(i.value)))); if (full) b.check(); });
      boxes.forEach(b => { if (!b.isAnswered()) b.reveal(); });
      update(); toast('Đã chấm bài. Câu bỏ trống được tính 0 điểm và hiện lời giải.', 'ok');
    };
    $('#examRetry').onclick = () => { seed = (seed * 48271 + 11) % 2147483647; Store.set('exam-seed', seed); build(); window.scrollTo({ top: 0 }); };
    build();
    Bus.on('reset', ({ wipe }) => { if (wipe) { seed = 20261016; Store.del('exam-seed'); } build(); });
  }
  return { init };
})();
App.registerView('exam', { init: () => Exam.init() });

/* bộ ảnh nét tổng hợp (cùng cách sinh như khi thiết kế trọng số) */
function synthSet(seed) {
  const D = [];
  for (const val of [1, 0.6]) for (let L = 4; L <= 8; L++) {
    for (let r = 0; r < 8; r++) for (let c0 = 0; c0 <= 8 - L; c0++) {
      const a = TN.zeros2(8, 8); for (let j = c0; j < c0 + L; j++) a[r][j] = val; D.push({ img: a, y: 0 });
      const b = TN.zeros2(8, 8); for (let j = c0; j < c0 + L; j++) b[j][r] = val; D.push({ img: b, y: 1 });
    }
    for (let r0 = 0; r0 < 8; r0++) for (let c0 = 0; c0 < 8; c0++) {
      if (r0 + L <= 8 && c0 + L <= 8) { const a = TN.zeros2(8, 8); for (let t = 0; t < L; t++) a[r0 + t][c0 + t] = val; D.push({ img: a, y: 2 }); }
      if (r0 + L <= 8 && c0 - L + 1 >= 0) { const a = TN.zeros2(8, 8); for (let t = 0; t < L; t++) a[r0 + t][c0 - t] = val; D.push({ img: a, y: 2 }); }
    }
  }
  const R = mulberry32(seed), n = D.length;
  for (let k = 0; k < n; k++) D.push({ img: D[k].img.map(r => r.map(v => (v === 0 ? Math.round(R() * 20) / 100 : v))), y: D[k].y, noisy: true });
  return D;
}
function runSynth() {
  const out = $('#synthOut'), t0 = performance.now();
  const D = synthSet(2026), conf = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  const res = D.map(d => { const r = Net.forward(d.img); conf[d.y][r.out.pred]++; return { d, k: r.out.pred, p: r.out.softmax[d.y] }; });
  const ok = res.filter(r => r.k === r.d.y).length, ms = performance.now() - t0;
  res.sort((a, b) => a.p - b.p);
  const thumb = (img, cap) => el('div', { class: 'col center' }, gridView(img, { mode: 'img', cs: 9, labels: false, showVals: false }).el, el('div', { class: 'tiny', html: cap }));
  out.innerHTML = '';
  out.append(el('p', { html: `${HT.badge('net', 'tính thật')} Đúng <b>${ok}/${D.length}</b> ảnh (${pct(ok / D.length)}) trong ${ms.toFixed(0)} ms. Xác suất thấp nhất mà mạng gán cho lớp đúng: <b>${pct(res[0].p)}</b>.` }));
  out.append(el('div', { class: 'tablewrap' }, el('table', { class: 'data', style: { maxWidth: '520px' }, html: `<thead><tr><th class="l">Nhãn đúng ↓ / Dự đoán →</th>${CLASSES.map(c => `<th>${c.vi}</th>`).join('')}</tr></thead><tbody>${conf.map((r, i) => `<tr><td class="l"><b>${CLASSES[i].vi}</b></td>${r.map((v, j) => `<td class="${i === j ? 'okc' : v ? 'badc' : ''}">${v}</td>`).join('')}</tr>`).join('')}</tbody>` })));
  out.append(el('div', { class: 'small gap-top', html: '<b>6 ảnh mạng “kém tự tin” nhất</b> (vẫn đúng, nhưng xác suất lớp đúng thấp):' }), el('div', { class: 'row' }, ...res.slice(0, 6).map(r => thumb(r.d.img, `${CLASSES[r.d.y].vi} · ${pct(r.p)}`))));
  const odd = [
    ['Chữ L', m => { for (let i = 1; i < 7; i++) m[i][1] = 1; for (let j = 1; j < 7; j++) m[6][j] = 1; }],
    ['Hình vuông', m => { for (let k = 1; k < 7; k++) { m[1][k] = 1; m[6][k] = 1; m[k][1] = 1; m[k][6] = 1; } }],
    ['Dấu ×', m => { for (let i = 0; i < 8; i++) { m[i][i] = 1; m[i][7 - i] = 1; } }],
    ['Khối đặc 4×4', m => { for (let i = 2; i < 6; i++) for (let j = 2; j < 6; j++) m[i][j] = 1; }],
    ['Nét nghiêng dốc', m => { for (let i = 0; i < 8; i++) m[i][Math.min(7, 2 + (i >> 1))] = 1; }],
    ['Nhiễu ngẫu nhiên', m => { const R = mulberry32(7); for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) m[i][j] = Math.round(R() * 10) / 10; }]
  ].map(([n, f]) => { const m = TN.zeros2(8, 8); f(m); const r = Net.forward(m); return thumb(m, `${n}<br>→ <b>${CLASSES[r.out.pred].vi}</b> ${pct(r.out.softmax[r.out.pred])}`); });
  out.append(el('div', { class: 'small gap-top', html: '<b>Ảnh “lạ” (không thuộc lớp nào)</b> — mạng vẫn buộc phải chọn một lớp, đôi khi với xác suất cao:' }), el('div', { class: 'row' }, ...odd));
  out.append(el('div', { class: 'pit small', html: '<b>Kết luận trung thực</b>Bộ trọng số thủ công hoạt động tốt với đúng loại ảnh nó được thiết kế (nét thẳng mảnh), nhưng xác suất Softmax <b>không</b> cho biết ảnh có “lạ” hay không. Mạng thật cần được huấn luyện trên dữ liệu đa dạng và hiệu chuẩn nếu muốn xác suất đáng tin.' }));
}
