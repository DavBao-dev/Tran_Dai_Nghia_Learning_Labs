<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Phòng thí nghiệm CNN tương tác: ảnh 8×8, tích chập, ReLU, Max Pooling, Flatten, Linear, Softmax — mọi phép tính chạy thật bằng JavaScript và khớp với code PyTorch.">
<title>CNN Lab tương tác</title>
<script>
/* chọn giao diện sáng/tối và cỡ chữ trước khi vẽ để tránh nhấp nháy */
(function () {
  var t = null, f = null;
  try { t = localStorage.getItem('cnnlab-theme'); f = localStorage.getItem('cnnlab-font'); } catch (e) { t = null; f = null; }
  if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  var n = parseInt(f, 10);
  if (n >= 13 && n <= 24) document.documentElement.style.fontSize = n + 'px';
})();
</script>
<style>
/* ===== 00-base.css ===== */
/* =====================================================================
   00-base.css — hệ màu, chữ, nút, hộp, công thức, code, tab, player, quiz
   (cùng ngôn ngữ thiết kế với GAN Lab và Transformer Lab)
   ===================================================================== */
:root{
  --bg:#f3f5fa; --panel:#ffffff; --ink:#1b2437; --muted:#5a6780; --line:#dfe5ef; --soft:#f7f9fc; --soft2:#edf1f7;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef0ff;
  /* màu khái niệm CNN (luôn đi kèm nhãn chữ) */
  --inp:#0369a1;  --inp-soft:#dbeefe;
  --ker:#c2410c;  --ker-soft:#ffe8d6;
  --bias:#a16207; --bias-soft:#fdf3d0;
  --fm:#0f766e;   --fm-soft:#d5f3ee;
  --relu:#be185d; --relu-soft:#fce4ef;
  --pool:#7c3aed; --pool-soft:#ece5ff;
  --flat:#b45309; --flat-soft:#fdf0d5;
  --lin:#4338ca;  --lin-soft:#e3e6ff;
  --logit:#854d0e;--logit-soft:#fbf1d9;
  --prob:#15803d; --prob-soft:#dcf5e3;
  --pred:#047857; --pred-soft:#d1fae5;
  --pad:#64748b;  --pad-soft:#e2e8f0;
  /* thang giá trị phân kỳ: âm = xanh dương, dương = cam đỏ */
  --vneg:#1d64c2; --vpos:#d9480f;
  --win:#d97706; --winbg:#fff4cc;
  --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2; --warn:#92400e; --warn-bg:#fef6d8; --warn-bd:#f2c94c; --hl:#fde68a; --hl2:#fff7c2;
  --code-bg:#0f172a; --code-ink:#e2e8f0; --code-hl:#334155; --code-ln:#64748b;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 10px rgba(15,23,42,.05);
  --top:#14123a; --top-ink:#e0e7ff;
  --hatch:repeating-linear-gradient(135deg, rgba(100,116,139,.25) 0 4px, transparent 4px 8px);
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#0b1020; --panel:#131a2c; --ink:#e3e8f2; --muted:#9aa6bd; --line:#2a3550; --soft:#18203a; --soft2:#1d2742;
  --accent:#8b8cf8; --accent-ink:#0b1020; --accent-soft:#1f2550;
  --inp:#38bdf8;  --inp-soft:#0c2c40;
  --ker:#fb923c;  --ker-soft:#43230f;
  --bias:#facc15; --bias-soft:#3a300a;
  --fm:#2dd4bf;   --fm-soft:#0d3a36;
  --relu:#f472b6; --relu-soft:#481a33;
  --pool:#b18cff; --pool-soft:#2c1f52;
  --flat:#fbbf24; --flat-soft:#3f300c;
  --lin:#a5b4fc;  --lin-soft:#232a5c;
  --logit:#fcd34d;--logit-soft:#3a300a;
  --prob:#4ade80; --prob-soft:#123321;
  --pred:#34d399; --pred-soft:#0f3328;
  --pad:#94a3b8;  --pad-soft:#1f2a3f;
  --vneg:#60a5fa; --vpos:#fb8c4a;
  --win:#fbbf24; --winbg:#3b300c;
  --ok:#4ade80; --ok-bg:#123321; --bad:#f87171; --bad-bg:#3d1717; --warn:#fcd34d; --warn-bg:#2f280d; --warn-bd:#a16207; --hl:#5c4a10; --hl2:#3a3214;
  --code-bg:#070b16; --code-ink:#e2e8f0; --code-hl:#26324a; --code-ln:#5b6b85;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --top:#090c1b; --top-ink:#c7d2fe;
  --hatch:repeating-linear-gradient(135deg, rgba(148,163,184,.3) 0 4px, transparent 4px 8px);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{font-size:16px;scroll-padding-top:calc(var(--toph, 90px) + 10px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;overflow-x:hidden;padding-bottom:2.7rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:.2rem .4rem}
textarea{width:100%;font-family:Consolas,"Cascadia Mono",monospace;font-size:.9rem}
input[type=number]{width:5.2em}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);vertical-align:middle}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
input.bad,textarea.bad,select.bad{border-color:var(--bad);background:var(--bad-bg)}
code,pre,kbd,.mono{font-family:Consolas,"Cascadia Mono","SFMono-Regular",Menlo,monospace}
code{background:var(--soft2);border:1px solid var(--line);border-radius:5px;padding:0 .25em;font-size:.92em}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .3em;font-size:.85em;background:var(--soft)}
h1,h2,h3,h4{line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.28rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:.45em 0}
ul,ol{margin:.35em 0;padding-left:1.45em}
li{margin:.18em 0}
a{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:1rem 0}
details{margin:.5rem 0}
summary{cursor:pointer;font-weight:600;color:var(--accent)}
sub,sup{line-height:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.tiny{font-size:.78rem}
.nowrap{white-space:nowrap}
.center{text-align:center}
.right{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:#fff;padding:.4rem .8rem;z-index:200;border-radius:0 0 8px 0}
.skip:focus{left:0}

/* ---------- thanh trên cùng ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--top);color:var(--top-ink);display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .8rem;padding:.4rem 1rem;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand{font-weight:700;font-size:1.08rem;white-space:nowrap;color:#fff;display:flex;align-items:center;gap:.45rem;margin-right:auto}
.brand .logo{display:inline-grid;place-items:center;width:2.1rem;height:1.75rem;border-radius:7px;background:linear-gradient(135deg,#0369a1,#0f766e 45%,#7c3aed);font-size:.74rem;letter-spacing:.02em}
.brand-sub{font-weight:400;opacity:.75;font-size:.86rem}
.navs{display:flex;flex-wrap:wrap;gap:.15rem;flex:1 1 100%;order:3;border-top:1px solid rgba(255,255,255,.1);padding-top:.3rem}
.navs button{background:transparent;color:var(--top-ink);border:1px solid transparent;border-radius:8px;padding:.26rem .6rem;font-size:.92rem}
.navs button:hover{background:rgba(255,255,255,.08)}
.navs button.active{background:rgba(129,140,248,.28);color:#fff;border-color:rgba(165,180,252,.6);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.tbtn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:.2rem .55rem;font-size:.86rem}
.tbtn:hover{background:rgba(255,255,255,.16)}
.tbtn.warnbtn{border-color:rgba(252,165,165,.6)}

main{max-width:1600px;margin:0 auto;padding:1rem}
.view{display:none}
.view.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--shadow);margin-bottom:1rem;min-width:0}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
h2 .badge,h3 .badge{margin-left:.35rem}
.sub{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:.7rem .85rem;margin:.6rem 0;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:1rem}
.grid2>.sub,.grid3>.sub{margin:0}
.row{display:flex;flex-wrap:wrap;gap:.45rem .8rem;align-items:center}
.col{display:flex;flex-direction:column;gap:.4rem}
.spacer{flex:1}
.gap-top{margin-top:.8rem}
.scrollx{overflow-x:auto;max-width:100%}
.viewhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem;margin-bottom:.6rem}
.viewhead h2{margin:0;font-size:1.4rem}
.rnum{display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.95rem;flex:none}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .7rem;margin-bottom:.5rem}
.rhead h2{margin:0;font-size:1.22rem}

/* ---------- huy hiệu nguồn số liệu ---------- */
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.74rem;font-weight:600;border-radius:99px;padding:.06rem .55rem;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.badge.net{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.badge.net::before{content:"●";font-size:.7em}
.badge.fixed{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-bd)}
.badge.fixed::before{content:"✎"}
.badge.lab{background:var(--pool-soft);color:var(--pool);border-color:var(--pool)}
.badge.lab::before{content:"⚗"}
.badge.theory{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.badge.theory::before{content:"📘";font-size:.85em}
.badge.hand{background:var(--soft2);color:var(--muted);border-color:var(--line)}
.badge.hand::before{content:"◇"}

/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;gap:.3rem;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.32rem .75rem;color:var(--ink);transition:background .12s,border-color .12s;line-height:1.3}
.btn:hover{background:var(--soft2);border-color:var(--muted)}
.btn:focus-visible,.navs button:focus-visible,.tab:focus-visible,.tbtn:focus-visible,[tabindex]:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.go{background:var(--ok);color:#fff;border-color:var(--ok)}
:root[data-theme="dark"] .btn.go{color:#0b1020}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:.16rem .5rem;font-size:.86rem;border-radius:7px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap;vertical-align:middle}
.seg button{border:0;background:var(--panel);padding:.24rem .6rem;border-right:1px solid var(--line);font-size:.9rem}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.switch{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;user-select:none;font-size:.93rem}
.switch input{width:1.05rem;height:1.05rem}

/* ---------- hộp ghi chú ---------- */
.note{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:10px;padding:.5rem .8rem;font-size:.93rem;margin:.6rem 0}
.info{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:.5rem .8rem;margin:.6rem 0}
.pit{background:var(--bad-bg);border-left:4px solid var(--bad);border-radius:8px;padding:.5rem .8rem;margin:.6rem 0}
.pit>b:first-child,.info>b:first-child,.good>b:first-child,.predict>b:first-child{display:block;margin-bottom:.15rem}
.good{background:var(--ok-bg);border-left:4px solid var(--ok);border-radius:8px;padding:.5rem .8rem;margin:.6rem 0}
.predict{background:var(--soft);border:1px dashed var(--accent);border-radius:10px;padding:.55rem .85rem;margin:.6rem 0}
.err{color:var(--bad);font-size:.9rem;min-height:1.1em}
.err:not(:empty)::before{content:"⚠ "}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.alert{border-radius:10px;padding:.5rem .8rem;margin:.5rem 0;border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-bd)}
.alert.bad{background:var(--bad-bg);border-color:var(--bad)}
.alert.ok{background:var(--ok-bg);border-color:var(--ok)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}

/* ---------- công thức ---------- */
.eq{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.12rem;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.5rem .85rem;margin:.5rem 0;overflow-x:auto;line-height:2}
.eq.big{font-size:1.25rem;text-align:center}
.m{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.06em;white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.25}
.frac>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.c-inp{color:var(--inp)} .c-ker{color:var(--ker)} .c-bias{color:var(--bias)} .c-fm{color:var(--fm)} .c-relu{color:var(--relu)} .c-pool{color:var(--pool)} .c-flat{color:var(--flat)} .c-lin{color:var(--lin)} .c-logit{color:var(--logit)} .c-prob{color:var(--prob)} .c-pred{color:var(--pred)} .c-ok{color:var(--ok)} .c-bad{color:var(--bad)} .c-acc{color:var(--accent)} .c-pad{color:var(--pad)}
.symtab{border-collapse:collapse;margin:.4rem 0;font-size:.94rem;width:100%}
.symtab td{border-bottom:1px solid var(--line);padding:.25rem .5rem;vertical-align:top}
.symtab td:first-child{white-space:nowrap;font-family:"Cambria Math",Cambria,serif;font-size:1.06em;width:1%}
@media (max-width:640px){.symtab td:first-child{white-space:normal;width:auto;min-width:3.5em}.symtab td{overflow-wrap:anywhere}}
.calc{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:1.04rem;line-height:1.9;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;margin:.45rem 0;overflow-x:auto}
.calc .res{font-weight:700;background:var(--hl2);border-radius:4px;padding:0 .2em}
.calc .lbl{font-family:"Segoe UI",system-ui,sans-serif;font-size:.84rem;color:var(--muted);display:inline-block;min-width:7.5em}
.calc .step{display:block}

/* ---------- code ---------- */
.codebox{background:var(--code-bg);color:var(--code-ink);border-radius:11px;margin:.5rem 0;overflow:hidden;border:1px solid #1e293b}
.codehead{display:flex;align-items:center;gap:.5rem;padding:.3rem .5rem .3rem .8rem;background:rgba(255,255,255,.05);font-size:.82rem;color:#94a3b8;flex-wrap:wrap}
.codehead .spacer{flex:1}
.codehead button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#e2e8f0;border-radius:6px;padding:.1rem .5rem;font-size:.8rem}
.codehead button:hover{background:rgba(255,255,255,.16)}
.code{margin:0;padding:.5rem 0;overflow:auto;font-size:.85rem;line-height:1.5;max-height:600px;tab-size:4}
.code.tall{max-height:none}
.code .ln{display:block;padding:0 .8rem 0 0;white-space:pre;min-height:1.5em}
.code .ln::before{content:attr(data-n);display:inline-block;width:2.8em;padding-right:.8em;text-align:right;color:var(--code-ln);user-select:none}
.code .ln.cur{background:var(--code-hl);box-shadow:inset 3px 0 0 #facc15}
.code .ln.mark{background:rgba(250,204,21,.13);box-shadow:inset 3px 0 0 #a16207}
.tok-kw{color:#c792ea}.tok-str{color:#c3e88d}.tok-com{color:#7f8ea8;font-style:italic}.tok-num{color:#f78c6c}.tok-fn{color:#82aaff}.tok-bi{color:#ffcb6b}.tok-self{color:#ff9cac}
.codeline{font-family:Consolas,monospace;font-size:.88rem;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:.35rem .7rem;margin:.35rem 0;overflow-x:auto;white-space:pre;border-left:3px solid #facc15}
.outbox{font-family:Consolas,monospace;font-size:.84rem;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;white-space:pre;overflow-x:auto;margin:.4rem 0;line-height:1.5}

/* ---------- tab ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:.25rem;border-bottom:2px solid var(--line);margin-bottom:.8rem}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:.4rem .75rem;color:var(--muted);font-weight:600;border-radius:8px 8px 0 0}
.tab:hover{color:var(--ink);background:var(--soft)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.tab .seen{font-size:.78em;color:var(--ok);margin-left:.2em}
.tabpanel{display:none}
.tabpanel.active{display:block}

/* ---------- bảng ---------- */
table.data{border-collapse:collapse;width:100%;font-size:.9rem}
table.data th,table.data td{border:1px solid var(--line);padding:.25rem .45rem;text-align:right}
table.data th{background:var(--soft2);text-align:center;font-weight:600}
table.data td.l,table.data th.l{text-align:left}
table.data td.c,table.data th.c{text-align:center}
table.data tr.hl td{background:var(--hl2)}
table.data tr.cur td{background:var(--hl2);font-weight:600}
table.data tr.pending td{color:var(--muted)}
table.data td.okc{background:var(--ok-bg);color:var(--ok);font-weight:600;text-align:center}
table.data td.badc{background:var(--bad-bg);color:var(--bad);font-weight:600;text-align:center}
.tablewrap{overflow-x:auto;max-width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;font-size:.92rem}
.kv>dt{color:var(--muted)} .kv>dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.shapechip{display:inline-block;font-family:Consolas,monospace;font-size:.82rem;background:var(--soft2);border:1px solid var(--line);border-radius:6px;padding:0 .35rem;white-space:nowrap}

/* ---------- player (Play/Pause/Next/Prev/Reset) ---------- */
.player{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:.6rem 0;overflow:hidden}
.player .pbar{display:flex;flex-wrap:wrap;gap:.35rem .45rem;align-items:center;padding:.4rem .6rem;background:var(--soft2);border-bottom:1px solid var(--line)}
.player .pbar .stepno{font-weight:700;font-variant-numeric:tabular-nums;margin-left:.2rem;white-space:nowrap}
.player .pbar label{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:.3rem}
.player .pbar input[type=range].speed{width:90px}
.player .scrub{display:flex;align-items:center;gap:.5rem;padding:.25rem .7rem;border-bottom:1px solid var(--line);background:var(--soft)}
.player .scrub input{flex:1;min-width:80px}
.player .scrub .tiny{white-space:nowrap}
.player .stage{padding:.7rem .85rem;min-height:120px}
.player .caption{font-weight:600;margin:0 0 .4rem;min-height:1.4em}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.dots button{width:12px;height:12px;border-radius:50%;background:var(--line);border:0;padding:0}
.dots button.on{background:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.dots button.done{background:var(--muted)}

/* ---------- thanh xác suất ---------- */
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:.3rem .55rem;align-items:center;font-size:.92rem}
.bar{height:16px;border-radius:99px;background:var(--soft2);position:relative;overflow:hidden;min-width:60px;border:1px solid var(--line)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--prob);border-radius:99px;transition:width .35s}
.bar.logit>i{background:var(--logit)}
.bars .lab{font-weight:600;white-space:nowrap}
.bars .num{font-family:Consolas,monospace;font-size:.86rem;text-align:right;white-space:nowrap}
.bars .top .lab::after{content:" ★";color:var(--pred)}

/* ---------- câu hỏi (QKit) ---------- */
.q[data-qid]{border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0;background:var(--panel)}
.q .qh{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.q .qn{font-weight:700;color:var(--accent)}
.q .lvl{font-size:.72rem;font-weight:700;border-radius:6px;padding:.02rem .45rem;background:var(--soft2);color:var(--muted);white-space:nowrap}
.q .lvl.NB{background:var(--fm-soft);color:var(--fm)} .q .lvl.TH{background:var(--accent-soft);color:var(--accent)} .q .lvl.VD{background:var(--ker-soft);color:var(--ker)}
.q .qbody{margin:.35rem 0}
.q .opts{display:flex;flex-direction:column;gap:.3rem;margin:.5rem 0}
.q .opts label{display:flex;gap:.5rem;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:.35rem .6rem;cursor:pointer;background:var(--soft)}
.q .opts label:hover{border-color:var(--accent)}
.q .opts label.right{border-color:var(--ok);background:var(--ok-bg)}
.q .opts label.right::after{content:"✓ đáp án đúng";margin-left:auto;font-size:.8rem;color:var(--ok);font-weight:700;white-space:nowrap;padding-left:.4rem}
.q .opts label.wrong{border-color:var(--bad);background:var(--bad-bg)}
.q .opts label.wrong::after{content:"✗ bạn đã chọn";margin-left:auto;font-size:.8rem;color:var(--bad);font-weight:700;white-space:nowrap;padding-left:.4rem}
.q .numrow{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;margin:.5rem 0}
.q .numrow input{width:7.5em}
.q .numrow input.okin{border-color:var(--ok);background:var(--ok-bg)}
.q .numrow input.badin{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:.5rem;border-radius:9px;padding:.5rem .75rem;display:none}
.fb.show{display:block}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb .solx{margin-top:.35rem;color:var(--ink)}
.fb ol,.fb ul{margin:.2rem 0}
.score{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:calc(var(--toph, 90px) + 6px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5rem .9rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.score b{font-size:1.25rem}

/* ---------- thông báo ---------- */
#toasts{position:fixed;right:16px;bottom:52px;z-index:120;display:flex;flex-direction:column;gap:.4rem;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:9px;padding:.5rem .8rem;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:.92rem;animation:tin .2s ease-out}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn-bd)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ---------- thanh trạng thái dưới cùng ---------- */
.statusbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:flex;gap:.4rem 1.2rem;align-items:center;flex-wrap:nowrap;overflow:hidden;background:var(--panel);border-top:1px solid var(--line);padding:.32rem 1rem;font-size:.84rem;box-shadow:0 -2px 10px rgba(15,23,42,.06)}
.statusbar .sb-view{font-weight:700;color:var(--accent);white-space:nowrap}
.statusbar .sb-img{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.statusbar .sb-pred,.statusbar .sb-prog{white-space:nowrap}

/* ---------- hộp thoại ---------- */
.modal{position:fixed;inset:0;z-index:150;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.modal .dlg{background:var(--panel);color:var(--ink);border-radius:14px;max-width:900px;width:100%;max-height:calc(100vh - 2rem);overflow:auto;padding:1rem 1.2rem;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.modal .dlg.narrow{max-width:520px}
.modal .dlg h2{margin-top:0}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:.45rem 1rem;font-size:.92rem}
.lgrid>div{display:flex;align-items:center;gap:.5rem}
.sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:2px solid currentColor;vertical-align:middle;flex:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (max-width:760px){
  .topbar{position:static}
  .navs{flex-wrap:wrap;width:100%;order:3}
  .navs button{white-space:nowrap;padding:.22rem .45rem;font-size:.86rem}
  .brand-sub{display:none}
  .statusbar{gap:.3rem .7rem;padding:.3rem .6rem;font-size:.78rem}
  .statusbar .sb-img,.statusbar .sb-prog{display:none}

  .player .scrub.hidden{display:flex!important}
  .player .pbar .btn.sm{padding:.3rem .55rem}
}
@media (max-width:640px){
  main{padding:.6rem}
  .card{padding:.8rem}
  .eq{font-size:1rem}
}
@media print{.topbar,.statusbar,.player .pbar{display:none}.view{display:block!important}}

/* ===== 10-cnn.css ===== */
/* =====================================================================
   10-cnn.css — sơ đồ, khu vực 1-2-3, lưới số liệu, mô phỏng
   ===================================================================== */
.progress{height:9px;border-radius:99px;background:var(--soft2);overflow:hidden;margin:.35rem 0 .2rem;border:1px solid var(--line)}

/* ---------- khu vực 1 ---------- */
.r1ctl{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.inrow select{max-width:min(320px,70vw)}
.prevbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:2px;line-height:0}

.runstatus{background:var(--soft);border:1px solid var(--line);border-left:4px solid var(--prob);border-radius:9px;padding:.45rem .75rem;margin:.5rem 0;min-height:2.3em}

/* SVG sơ đồ */
svg.dg text{fill:var(--ink);font-family:"Segoe UI",system-ui,sans-serif}
svg.dg .blk{cursor:pointer;outline:none}
svg.dg .blk .frame{fill:var(--panel);stroke:var(--line);stroke-width:1.5;transition:stroke .2s}
svg.dg .blk:hover .frame{stroke:var(--muted)}
svg.dg .blk:focus-visible .frame{stroke:var(--accent);stroke-width:3;stroke-dasharray:6 3}
svg.dg .blk.sel .frame{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft)}
svg.dg .blk .selmark{font-size:11.5px;font-weight:700;fill:var(--accent);opacity:0}
svg.dg .blk.sel .selmark{opacity:1}

svg.dg .blk.c-inp{color:var(--inp)} svg.dg .blk.c-ker{color:var(--ker)} svg.dg .blk.c-relu{color:var(--relu)} svg.dg .blk.c-pool{color:var(--pool)} svg.dg .blk.c-flat{color:var(--flat)} svg.dg .blk.c-lin{color:var(--lin)} svg.dg .blk.c-prob{color:var(--prob)} svg.dg .blk.c-pred{color:var(--pred)}
svg.dg .bt{font-size:12.5px;font-weight:700;fill:currentColor!important}
svg.dg .bs{font-size:10.5px;fill:var(--muted)!important}
svg.dg .bsh{font-size:10.5px;font-family:Consolas,monospace!important;font-weight:700}

svg.dg .seenb rect{fill:var(--panel);stroke:var(--muted);stroke-width:1}
svg.dg .seenb .seen{font-size:9.5px;font-weight:700;fill:var(--muted)!important}

svg.dg .runmark{font-size:11px;fill:var(--muted)!important}
svg.dg .blk.active .runmark{fill:var(--ok)!important;font-weight:700}
svg.dg .blk.active .frame{stroke:var(--ok);stroke-width:3.5;filter:drop-shadow(0 0 6px rgba(21,128,61,.45));animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{stroke-opacity:1}to{stroke-opacity:.45}}
svg.dg .blk.pending .viz{opacity:.55}
svg.dg .mapbox{fill:none;stroke:var(--muted);stroke-width:1}
svg.dg .mapbox.pend{fill:var(--soft2);stroke-dasharray:3 2}

svg.dg .chl{font-size:9.5px;fill:var(--muted)!important}
svg.dg .fcell{stroke:var(--line);stroke-width:.6}

svg.dg .nval{font-size:10.5px;font-weight:700;font-family:Consolas,monospace!important}
svg.dg .nlab{font-size:10.5px;font-weight:700;fill:var(--lin)!important}

svg.dg .blab{font-size:10.5px;font-weight:600}
svg.dg .barbg{fill:var(--soft2);stroke:var(--line)}
svg.dg .barfg{fill:var(--prob);transition:width .35s}
svg.dg .barfg.top{stroke:var(--ink);stroke-width:1.2}
svg.dg .bpct{font-size:10.5px;font-family:Consolas,monospace!important}
svg.dg .predbox{fill:var(--pred-soft);stroke:var(--pred);stroke-width:2}
svg.dg .predbox.pend{fill:var(--soft2);stroke:var(--muted);stroke-dasharray:4 3}
svg.dg .pglyph{font-size:24px;font-weight:700;fill:var(--pred)!important}
svg.dg .pname{font-size:15px;font-weight:700;fill:var(--pred)!important}
svg.dg .pidx{font-size:10px;fill:var(--muted)!important}

svg.dg .wire{fill:none;stroke:var(--muted);stroke-width:1.3;opacity:.7}

svg.dg .wire.flow{stroke:var(--ok);stroke-width:2.2;opacity:1;stroke-dasharray:6 4;animation:flow .6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
svg.dg .wire.lw{stroke-width:.9}
svg.dg .wire.lw.posw{stroke:var(--ker)}
svg.dg .wire.lw.neg{stroke:var(--vneg);stroke-dasharray:3 2}

svg.dg .arrhead.t{fill:var(--win)}
svg.dg .tr-out{fill:none;stroke:var(--accent);stroke-width:2.5}

/* ---------- khu vực 2 và 3 ---------- */

/* ---------- lưới số liệu (gridView) ---------- */
.gv{--cs:30px;--lw:18px;display:inline-flex;flex-direction:column;gap:.15rem;vertical-align:top;max-width:100%;min-width:0}

<script>
'use strict';
/* ===================== 00-util.js ===================== */
/* =====================================================================
   00-util.js — tiện ích DOM, định dạng số, màu, code Python, Player
   (Play/Pause/Next/Prev/Reset + tốc độ), lưới số liệu gridView, tab.
   Không phụ thuộc file nào khác.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);

    if (v == null || v === false) continue;

    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);

}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
/* ghi nhớ phần tử đang có tiêu điểm (bằng thuộc tính ổn định) để khôi phục sau khi vẽ lại */
const _q = s => String(s).replace(/["\\]/g, '\\$&');
function focusKey(root) {

  if (!a || a === document.body || !root || !root.contains(a)) return null;

  for (const k of ['nav', 'v', 'id', 'k']) if (a.dataset[k] != null) return `${scope}[data-${k}="${_q(a.dataset[k])}"]`;
  if (a.dataset.r != null) return `${scope}.c[data-r="${a.dataset.r}"][data-c="${a.dataset.c}"]`;
  return null;
}
function restoreFocus(root, key) {
  if (!key || !root) return;
  let n = null; try { n = root.querySelector(key); } catch (e) { n = null; }
  if (!n) return;
  if (n.classList.contains('c') && n.tabIndex < 0) { const g = n.closest('.gg'); if (g) $$('.c[tabindex="0"]', g).forEach(x => { x.tabIndex = -1; }); n.tabIndex = 0; }
  try { n.focus({ preventScroll: true }); } catch (e) { n.focus(); }
}
function debounce(fn, ms = 120) { let t = null; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.cancel = () => clearTimeout(t); return f; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
const stripTags = s => String(s).replace(/<[^>]+>/g, '');

/* ---------- định dạng số: dấu chấm thập phân (như Python), dấu trừ "−" ----------
   fv: tối đa d chữ số thập phân, bỏ số 0 thừa (2.75, −0.3875, 1)
   fg: dùng trong ô lưới (≤ 2 chữ số thập phân)
   fpar: số âm đặt trong ngoặc khi thay vào biểu thức: 0.5 × (−1.25)
   fx: luôn đủ d chữ số (dùng để đối chiếu với Python: f"{v:.4f}") */
function fv(x, d = 4) {
  if (typeof x !== 'number' || Number.isNaN(x)) return 'NaN';
  if (!isFinite(x)) return x > 0 ? '∞' : '−∞';
  let s = x.toFixed(d);
  if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
  if (/^-0$/.test(s)) s = '0';
  return s.replace('-', '−');
}
const fg = x => fv(x, 2);
function fpar(x, d = 4) { const s = fv(x, d); return s.startsWith('−') ? '(' + s + ')' : s; }
function fx(x, d = 4) { let s = x.toFixed(d); if (/^-0\.?0*$/.test(s)) s = s.slice(1); return s.replace('-', '−'); }
function pct(x, d = 1) { return (x * 100).toFixed(d) + '%'; }
/* số rất nhỏ (0 < |x| < 10⁻⁴) ghi dạng a·10⁻ⁿ để không bị hiểu nhầm là 0 */
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function fsci(x, d = 6) {
  if (x === 0 || !isFinite(x) || Math.abs(x) >= 1e-4) return fx(x, d);
  const [m, e] = x.toExponential(2).split('e');
  return m.replace('-', '−') + '·10' + String(+e).split('').map(ch => SUP[ch] || ch).join('');
}
/* số dạng Python (ASCII) cho code */
function pyNum(x) { let s = fv(x, 6).replace('−', '-'); return s; }
/* làm tròn để so sánh đáp án */
const round4 = x => Math.round(x * 1e4) / 1e4;
function parseNum(s) {
  s = String(s).trim().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(',', '.');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}
/* Đọc ô nhập số có kiểm tra; trả về null nếu không hợp lệ (kèm thông báo) */
function readNum(inp, o = {}) {
  const v = parseNum(inp.value), name = o.name || 'Giá trị';
  let msg = null;
  if (String(inp.value).trim() === '') msg = `${name}: ô đang để trống — hãy nhập một số.`;
  else if (!isFinite(v)) msg = `${name}: "${esc(inp.value)}" không phải là số hợp lệ (dùng dấu chấm thập phân, ví dụ −0.5).`;
  else if (o.int && !Number.isInteger(v)) msg = `${name} phải là số nguyên (bạn nhập ${esc(inp.value)}).`;
  else if (o.min != null && v < o.min) msg = `${name} phải ≥ ${o.min} (bạn nhập ${esc(inp.value)}).`;
  else if (o.max != null && v > o.max) msg = `${name} phải ≤ ${o.max} (bạn nhập ${esc(inp.value)}).`;
  if (msg) {
    inp.classList.add('bad'); inp.title = stripTags(msg); inp.setAttribute('aria-invalid', 'true');
    if (o.errEl) o.errEl.innerHTML = msg; else if (!o.silent) toast(msg, 'bad');
    return null;
  }
  inp.classList.remove('bad'); inp.title = ''; inp.removeAttribute('aria-invalid');
  return v;
}

/* ---------- thông báo ---------- */
function toast(msg, type = 'info', ms = 4200) {

const PY_KW = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield'.split(' '));

  let out = '', i = 0;
  const push = (cls, s) => { out += cls ? `<span class="${cls}">${esc(s)}</span>` : esc(s); };
  while (i < line.length) {
    if (st.triple) {
      const j = line.indexOf(st.triple, i);
      if (j < 0) { push('tok-str', line.slice(i)); i = line.length; }
      else { push('tok-str', line.slice(i, j + 3)); i = j + 3; st.triple = null; }
      continue;
    }
    const ch = line[i], rest = line.slice(i);
    if (ch === '#') { push('tok-com', rest); break; }
    let m;
    if ((m = rest.match(/^[rbfRBF]{0,2}("""|''')/))) {
      const q = m[1], j = line.indexOf(q, i + m[0].length);
      if (j < 0) { push('tok-str', rest); st.triple = q; i = line.length; }
      else { push('tok-str', line.slice(i, j + 3)); i = j + 3; }
      continue;
    }
    if ((m = rest.match(/^[rbfRBF]{0,2}("([^"\\]|\\.)*"|'([^'\\]|\\.)*')/))) { push('tok-str', m[0]); i += m[0].length; continue; }
    if ((m = rest.match(/^\d+(\.\d*)?([eE][-+]?\d+)?j?/)) && !/[A-Za-z_]/.test(line[i - 1] || '')) { push('tok-num', m[0]); i += m[0].length; continue; }
    if ((m = rest.match(/^[A-Za-z_][A-Za-z0-9_]*/))) {

      f.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft + 6) + 'px';
      f.style.height = (b.offsetTop + b.offsetHeight - a.offsetTop + 6) + 'px';
      f.classList.remove('hidden');
    },
    hideWin(alt) { (alt ? frame2 : frame).classList.add('hidden'); if (alt == null) frame2.classList.add('hidden'); }
  };
  api.set(M);
  return api;
}

/* ---------- tabs có hỗ trợ bàn phím; render lười ở lần mở đầu ---------- */
function makeTabs(host, defs, o = {}) {
  const bar = el('div', { class: 'tabs', role: 'tablist', 'aria-label': o.label || 'Các tab' });
  const panels = {}, buttons = {};
  const uidp = 'tb' + Math.random().toString(36).slice(2, 8);
  defs.forEach(d => {
    const b = el('button', { type: 'button', class: 'tab', role: 'tab', id: `${uidp}-${d.id}`, 'aria-controls': `${uidp}-p-${d.id}`, 'aria-selected': 'false', tabindex: '-1' });
    b.innerHTML = d.label + '<span class="seen" aria-hidden="true"></span>';
    const p = el('div', { class: 'tabpanel', role: 'tabpanel', id: `${uidp}-p-${d.id}`, 'aria-labelledby': `${uidp}-${d.id}`, tabindex: '-1' });
    b.addEventListener('click', () => api.select(d.id));
    b.addEventListener('keydown', e => {
      const i = defs.findIndex(x => x.id === d.id);
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + defs.length) % defs.length; api.select(defs[j].id); buttons[defs[j].id].focus(); }
    });
    bar.append(b); buttons[d.id] = b; panels[d.id] = p;
  });
  host.append(bar); defs.forEach(d => host.append(panels[d.id]));
  const rendered = new Set();
  const api = {
    cur: null, panels, buttons,
    select(id) {
      const d = defs.find(x => x.id === id) || defs[0];
      if (api.cur && api.cur !== d.id) Player.pauseAll();
      for (const x of defs) { const on = x.id === d.id; buttons[x.id].classList.toggle('active', on); buttons[x.id].setAttribute('aria-selected', String(on)); buttons[x.id].tabIndex = on ? 0 : -1; panels[x.id].classList.toggle('active', on); }
      if (!rendered.has(d.id)) { rendered.add(d.id); if (d.render) { panels[d.id].innerHTML = ''; try { d.render(panels[d.id]); } catch (e) { console.error(e); panels[d.id].innerHTML = `<div class="alert bad">Lỗi: ${esc(e.message)}</div>`; } } }
      api.cur = d.id; if (o.onSelect) o.onSelect(d.id);
    },
    rerender(id) { rendered.delete(id); if (api.cur === id) api.select(id); },
    dirtyAll() { for (const d of defs) if (d.id !== api.cur) rendered.delete(d.id); if (api.cur) api.rerender(api.cur); },
    dirtyOthers() { for (const d of defs) if (d.id !== api.cur) rendered.delete(d.id); },
    markSeen(id, on = true) { const b = buttons[id]; if (b) b.querySelector('.seen').textContent = on ? ' ✓' : ''; }
  };
  api.select(o.initial || defs[0].id);
  return api;
}

/* ---------- segmented control ---------- */
function segCtl(opts, value, onChange, aria) {
  const g = el('div', { class: 'seg', role: 'group', 'aria-label': aria || 'Lựa chọn' });
  const set = v => { $$('button', g).forEach(b => { const on = b.dataset.v === String(v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); }); g.value = v; };
  for (const [v, lab, tt] of opts) {
    const b = el('button', { type: 'button', 'data-v': String(v), html: lab, title: tt || null });
    b.addEventListener('click', () => { if (b.disabled) return; set(v); onChange(v); });
    g.append(b);
  }
  g.set = set; set(value);
  return g;
}

/* ===================== 01-tensor.js ===================== */
/* =====================================================================
   01-tensor.js — phép toán CNN thuần JavaScript (float64), không phụ thuộc DOM.
   Quy ước lưu trữ: tensor 3 chiều [C][H][W] (batch N = 1 được ghi trong shape),
   vector là mảng phẳng. Mọi hàm trả về mảng mới, không sửa đầu vào.
   ===================================================================== */
const TN = (() => {
  const zeros2 = (h, w) => Array.from({ length: h }, () => new Array(w).fill(0));
  const zeros3 = (c, h, w) => Array.from({ length: c }, () => zeros2(h, w));
  const clone = t => JSON.parse(JSON.stringify(t));
  const shape3 = t => [t.length, t[0].length, t[0][0].length];

  /* Kích thước đầu ra (không xét dilation): ⌊(n + 2p − k)/s⌋ + 1 */
  function outSize(n, k, s, p) {
    const num = n + 2 * p - k;
    if (!(s >= 1) || !Number.isInteger(s)) return { ok: false, msg: 'stride phải là số nguyên ≥ 1.' };
    if (!(p >= 0) || !Number.isInteger(p)) return { ok: false, msg: 'padding phải là số nguyên ≥ 0.' };
    if (!(k >= 1) || !Number.isInteger(k)) return { ok: false, msg: 'kernel_size phải là số nguyên ≥ 1.' };
    if (num < 0) return { ok: false, num, msg: `Kernel ${k}×${k} lớn hơn input sau khi đệm (${n} + 2·${p} = ${n + 2 * p}); không có vị trí nào đặt vừa kernel.` };
    return { ok: true, num, raw: num / s + 1, val: Math.floor(num / s) + 1, exact: num % s === 0 };
  }

  function pad2(m, p) {
    const h = m.length, w = m[0].length, o = zeros2(h + 2 * p, w + 2 * p);
    for (let i = 0; i < h; i++) for (let j = 0; j < w; j++) o[i + p][j + p] = m[i][j];
    return o;
  }

  /* Cross-correlation như torch.nn.Conv2d (không lật kernel).
     x: [C][H][W], Wt: [O][C][k][k], b: [O] */
  function conv2d(x, Wt, b, s = 1, p = 0) {
    const C = x.length, Hh = x[0].length, Ww = x[0][0].length, O = Wt.length, k = Wt[0][0].length;
    const ho = outSize(Hh, k, s, p), wo = outSize(Ww, k, s, p);
    if (!ho.ok || !wo.ok) throw new Error(ho.msg || wo.msg);
    const y = zeros3(O, ho.val, wo.val);
    for (let o = 0; o < O; o++) for (let i = 0; i < ho.val; i++) for (let j = 0; j < wo.val; j++) {
      let acc = 0;
      for (let c = 0; c < C; c++) for (let u = 0; u < k; u++) for (let v = 0; v < k; v++) {
        const r = i * s + u - p, q = j * s + v - p;
        if (r >= 0 && r < Hh && q >= 0 && q < Ww) acc += x[c][r][q] * Wt[o][c][u][v];
      }
      y[o][i][j] = acc + b[o];
    }
    return y;
  }

  /* Chi tiết một ô đầu ra y[o][i][j]: từng tích, tổng theo từng kênh vào, bias */
  function convTerms(x, Wt, b, s, p, o, i, j) {
    const C = x.length, Hh = x[0].length, Ww = x[0][0].length, k = Wt[0][0].length;
    const terms = [], part = new Array(C).fill(0);
    for (let c = 0; c < C; c++) for (let u = 0; u < k; u++) for (let v = 0; v < k; v++) {
      const r = i * s + u - p, q = j * s + v - p;           /* tọa độ trong input gốc (có thể nằm ở vùng đệm) */
      const pad = !(r >= 0 && r < Hh && q >= 0 && q < Ww);
      const xv = pad ? 0 : x[c][r][q], w = Wt[o][c][u][v], prod = xv * w;
      terms.push({ c, u, v, r, q, pr: i * s + u, pc: j * s + v, pad, x: xv, w, prod });
      part[c] += prod;
    }
    const sum = part.reduce((a, t) => a + t, 0);
    return { terms, part, sum, bias: b[o], y: sum + b[o] };
  }

  const relu3 = x => x.map(m => m.map(r => r.map(v => (v > 0 ? v : 0))));
  const reluV = v => (v > 0 ? v : 0);

  /* Max/Average pooling 2D (không đệm). arg[c][i][j] = danh sách vị trí đạt max (có thể nhiều ô bằng nhau). */
  function pool2d(x, k = 2, s = 2, mode = 'max') {
    const C = x.length, Hh = x[0].length, Ww = x[0][0].length;
    const ho = outSize(Hh, k, s, 0), wo = outSize(Ww, k, s, 0);
    if (!ho.ok || !wo.ok) throw new Error(ho.msg || wo.msg);
    const y = zeros3(C, ho.val, wo.val), arg = [];
    for (let c = 0; c < C; c++) {
      const ac = [];
      for (let i = 0; i < ho.val; i++) {
        const ar = [];
        for (let j = 0; j < wo.val; j++) {
          let best = -Infinity, sum = 0, pos = [];
          for (let u = 0; u < k; u++) for (let v = 0; v < k; v++) {
            const val = x[c][i * s + u][j * s + v]; sum += val;
            if (val > best) { best = val; pos = [[i * s + u, j * s + v]]; }
            else if (val === best) pos.push([i * s + u, j * s + v]);
          }
          y[c][i][j] = mode === 'max' ? best : sum / (k * k);
          ar.push(pos);
        }
        ac.push(ar);
      }
      arg.push(ac);
    }
    return { y, arg };
  }
  function windowOf(m, i, j, k, s) { const out = []; for (let u = 0; u < k; u++) for (let v = 0; v < k; v++) out.push({ r: i * s + u, c: j * s + v, v: m[i * s + u][j * s + v] }); return out; }

  /* Flatten theo thứ tự của PyTorch (C-order): k = c·H·W + i·W + j */
  function flatten3(x) {
    const [C, Hh, Ww] = shape3(x), v = [], map = [];
    for (let c = 0; c < C; c++) for (let i = 0; i < Hh; i++) for (let j = 0; j < Ww; j++) { v.push(x[c][i][j]); map.push({ c, i, j }); }
    return { v, map };
  }

  /* Linear: y_k = Σ_i W[k][i]·x_i + b_k (W lưu như nn.Linear.weight: [out, in]) */
  function linear(x, Wt, b) { return Wt.map((row, k) => row.reduce((a, w, i) => a + w * x[i], 0) + b[k]); }

  /* Softmax ổn định số học: trừ max trước khi lấy exp */
  function softmax(z) {
    const m = Math.max(...z), sh = z.map(v => v - m), ex = sh.map(Math.exp), sum = ex.reduce((a, t) => a + t, 0);
    return { p: ex.map(e => e / sum), m, sh, ex, sum };
  }
  /* argmax: trả về chỉ số ĐẦU TIÊN đạt max (giống torch.argmax) */
  function argmax(a) { let bi = 0; for (let i = 1; i < a.length; i++) if (a[i] > a[bi]) bi = i; return bi; }
  const sum = a => a.reduce((s, t) => s + t, 0);
  const maxAbs = t => { let m = 0; const f = v => { if (Array.isArray(v)) v.forEach(f); else if (isFinite(v)) m = Math.max(m, Math.abs(v)); }; f(t); return m; };
  const eq = (a, b, tol = 1e-12) => { if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((x, i) => eq(x, b[i], tol)); return Math.abs(a - b) <= tol; };
  const count = (t, pred) => { let n = 0; const f = v => { if (Array.isArray(v)) v.forEach(f); else if (pred(v)) n++; }; f(t); return n; };

  return { zeros2, zeros3, clone, shape3, outSize, pad2, conv2d, convTerms, relu3, reluV, pool2d, windowOf, flatten3, linear, softmax, argmax, sum, maxAbs, eq, count };
})();
if (typeof module !== 'undefined') module.exports = { TN };

    conv2: rec => { rec.out.conv2 = TN.conv2d(rec.out.pool1, NET.W2, NET.b2, 1, 1); },
    relu2: rec => { rec.out.relu2 = TN.relu3(rec.out.conv2); },
    pool2: rec => { const r = TN.pool2d(rec.out.relu2, 2, 2, 'max'); rec.out.pool2 = r.y; rec.aux.pool2 = r.arg; },
    flatten: rec => { const r = TN.flatten3(rec.out.pool2); rec.out.flatten = r.v; rec.aux.flatten = r.map; },
    linear: rec => { rec.out.linear = TN.linear(rec.out.flatten, NET.WL, NET.bL); },
    softmax: rec => { const r = TN.softmax(rec.out.linear); rec.out.softmax = r.p; rec.aux.softmax = r; },
    pred: rec => { rec.out.pred = TN.argmax(rec.out.linear); rec.aux.pred = { fromProb: TN.argmax(rec.out.softmax) }; }
  };
  const newRec = img => ({ img: TN.clone(img), out: {}, aux: {}, done: -1 });
  function step(rec) { const k = rec.done + 1; if (k >= ORDER.length) return false; OPS[ORDER[k]](rec); rec.done = k; return true; }
  function forward(img) { const rec = newRec(img); while (step(rec)); return rec; }
  const prevOf = id => ORDER[BLOCK[id].idx - 1] || null;

  /* Truy vết: các ô ĐẦU VÀO của khối id tạo ra ô đầu ra (c, i, j) (bước liền trước). */
  function sources(id, c, i, j) {
    const kind = BLOCK[id].kind;
    if (kind === 'conv') {
      const Cin = BLOCK[id].inShape[1], Hh = BLOCK[id].inShape[2], out = [];
      for (let ci = 0; ci < Cin; ci++) for (let u = 0; u < 3; u++) for (let v = 0; v < 3; v++) {
        const r = i + u - 1, q = j + v - 1;
        if (r >= 0 && r < Hh && q >= 0 && q < Hh) out.push([ci, r, q]);
      }
      return out;
    }
    if (kind === 'relu') return [[c, i, j]];
    if (kind === 'pool') { const out = []; for (let u = 0; u < 2; u++) for (let v = 0; v < 2; v++) out.push([c, 2 * i + u, 2 * j + v]); return out; }
    if (kind === 'flatten') { const Ww = 2, Hh = 2; const k = j; return [[Math.floor(k / (Hh * Ww)), Math.floor((k % (Hh * Ww)) / Ww), k % Ww]]; }
    if (kind === 'linear') return Array.from({ length: 16 }, (_, k) => [0, 0, k]);
    if (kind === 'softmax' || kind === 'pred') return [0, 1, 2].map(k => [0, 0, k]);
    return [];
  }
  /* Vùng tiếp nhận trên ảnh gốc 8×8 của ô (c, i, j) ở đầu ra khối id (truy ngược qua mọi lớp). */
  function receptive(id, c, i, j) {
    /* tọa độ phần tử của vector (flatten, logits, xác suất) quy ước là (0, 0, k) */
    let cur = new Map([[`${c},${i},${j}`, [c, i, j]]]);
    let bid = id;
    while (bid !== 'input') {
      const nxt = new Map();
      for (const [cc, ii, jj] of cur.values()) for (const s of sources(bid, cc, ii, jj)) nxt.set(s.join(','), s);
      cur = nxt;
      bid = prevOf(bid);
    }
    return [...cur.values()].map(([, r, q]) => [r, q]).sort((A, B) => A[0] - B[0] || A[1] - B[1]);
  }
  /* số tham số học được */
  const paramCount = () => BLOCKS.reduce((s, b) => s + b.params, 0);
  /* shape đọc từ CHÍNH tensor đã tính (không lấy từ bảng khai báo) */
  function shapeOf(id, rec) {
    const o = rec && rec.out[id];
    if (o == null) return null;
    if (typeof o === 'number') return [1];
    if (Array.isArray(o[0])) return [1, o.length, o[0].length, o[0][0].length];
    return [1, o.length];
  }
  return { OPS, newRec, step, forward, prevOf, sources, receptive, paramCount, shapeOf };
})();
if (typeof module !== 'undefined') module.exports = { NET, SAMPLES, BLOCKS, BLOCK, ORDER, Net, CLASSES };

/* ===================== 03-app.js ===================== */
/* =====================================================================
   03-app.js — trạng thái chung (một nguồn sự thật), bus sự kiện, chạy toàn mạng,
   tiến độ học, điều hướng view, theme, cỡ chữ, reset, chú giải, thanh trạng thái.
   ===================================================================== */
const Bus = (() => {
  const H = {};
  /* on(e, f, owner): nếu có owner (phần tử DOM), listener tự bị gỡ khi owner đã rời khỏi trang */
  const dead = f => f._owner && f._owner._wasIn && !f._owner.isConnected;
  return {
    on(e, f, owner) { if (owner) { f._owner = owner; owner._wasIn = owner.isConnected || owner._wasIn; } (H[e] = H[e] || []).push(f); return f; },
    off(e, f) { if (H[e]) H[e] = H[e].filter(x => x !== f); },
    emit(e, d) {
      const L = H[e] || [];
      for (const f of L.slice()) {
        if (f._owner && f._owner.isConnected) f._owner._wasIn = true;
        if (dead(f)) { this.off(e, f); continue; }
        try { f(d); } catch (err) { console.error('[Bus ' + e + ']', err); }
      }
    },
    count() { let n = 0; for (const k in H) n += H[k].length; return n; }
  };
})();

const Store = {
  get(k, def) { try { const v = localStorage.getItem('cnnlab-' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('cnnlab-' + k, JSON.stringify(v)); } catch (e) { /* bộ nhớ trình duyệt bị chặn: bỏ qua */ } },
  del(k) { try { localStorage.removeItem('cnnlab-' + k); } catch (e) { /* bỏ qua */ } }
};

/* ---------------- trạng thái ảnh + Forward Pass ---------------- */
const State = {
  img: TN.clone(SAMPLES[0].img), sampleId: SAMPLES[0].id, label: SAMPLES[0].label,
  fp: null, sel: 'input', tab: 'know', trace: null,
  run: { active: false, rec: null, timer: null, playing: false, speed: 3, follow: true },
  rec() { return this.run.active ? this.run.rec : this.fp; },
  avail(id) { return !this.run.active || BLOCK[id].idx <= this.run.rec.done; },
  sample() { return SAMPLES.find(s => s.id === this.sampleId) || null; },
  imgName() { const s = this.sample(); return s ? s.name : 'Ảnh tự vẽ'; },
  setImage(img, o = {}) {
    Runner.abort();
    this.img = TN.clone(img);
    if (o.sampleId !== undefined) this.sampleId = o.sampleId;
    if (o.label !== undefined) this.label = o.label;
    this.fp = Net.forward(this.img);
    this.trace = null;
    Bus.emit('image', o);
  },
  loadSample(id) { const s = SAMPLES.find(x => x.id === id) || SAMPLES[0]; this.setImage(s.img, { sampleId: s.id, label: s.label, from: 'sample' }); },
  setPixel(r, c, v) {
    if (this.img[r][c] === v) return false;
    const img = TN.clone(this.img); img[r][c] = v;
    const wasSample = this.sampleId !== 'custom';
    this.setImage(img, { sampleId: 'custom', label: wasSample ? null : this.label, from: 'paint' });
    if (wasSample) toast('Bạn vừa sửa ảnh mẫu → ảnh trở thành <b>ảnh tự vẽ</b>. Nhãn đúng chưa xác định — có thể chọn nhãn ở khối Input.', 'info', 5200);
    return true;
  },
  setLabel(l) { this.label = l; Bus.emit('label', l); },
  select(id, tab) {
    if (!BLOCK[id]) return;
    const changed = id !== this.sel;
    this.sel = id; if (tab) this.tab = tab;
    if (changed) this.trace = null;
    Bus.emit('select', { id, tab: this.tab, changed });
  },
  setTrace(t, src) { if (src === 'sim' && App.cur !== 'explore') return; this.trace = t; Bus.emit('trace', { t, src }); }
};

/* ---------------- Chạy toàn mạng: mỗi nhịp thực hiện PHÉP TOÁN THẬT của một lớp ---------------- */
const RUN_MS = [0, 1900, 1300, 850, 480, 220];
const Runner = {
  start() {
    this.abort(false);
    const R = State.run;
    R.rec = Net.newRec(State.img); R.active = true;
    Net.step(R.rec);                                   /* lớp Input: đưa ảnh vào tensor */
    Bus.emit('run', { k: 0, phase: 'start' });
    if (R.follow) State.select('input');
    this.play();
  },
  play() {
    const R = State.run;
    if (!R.active) { this.start(); return; }
    if (R.timer) return;
    R.playing = true; Bus.emit('run', { phase: 'play' });
    R.timer = setInterval(() => this.tick(), RUN_MS[R.speed] || 850);
  },
  pause() { const R = State.run; if (R.timer) clearInterval(R.timer); R.timer = null; R.playing = false; Bus.emit('run', { phase: 'pause' }); },
  tick() {
    const R = State.run;
    if (!R.active) { this.pause(); return; }
    const ok = Net.step(R.rec);
    const k = R.rec.done, id = ORDER[k];
    if (ok) {
      if (R.follow) State.select(id);
      Bus.emit('run', { k, id, phase: 'step' });
    }
    if (!ok || k >= ORDER.length - 1) this.finish();
  },
  stepOnce() {
    const R = State.run;
    if (!R.active) { this.abort(false); R.rec = Net.newRec(State.img); R.active = true; Net.step(R.rec); if (R.follow) State.select('input'); Bus.emit('run', { k: 0, phase: 'start' }); return; }
    this.pause(); this.tick();
  },
  finish() {
    const R = State.run;
    if (R.timer) clearInterval(R.timer);
    R.timer = null; R.playing = false;
    if (!R.active) return;
    while (Net.step(R.rec));                          /* hoàn tất nếu người học bấm "Tính hết" */
    const same = TN.eq(R.rec.out.softmax, State.fp.out.softmax, 1e-12);
    State.fp = R.rec; R.active = false; R.rec = null;
    Bus.emit('run', { phase: 'done', same });
  },
  restart() { this.abort(false); const R = State.run; R.rec = Net.newRec(State.img); R.active = true; Net.step(R.rec); if (R.follow) State.select('input'); Bus.emit('run', { k: 0, phase: 'reset' }); },
  abort(emit = true) {
    const R = State.run;
    if (R.timer) clearInterval(R.timer);
    const was = R.active;
    R.timer = null; R.playing = false; R.active = false; R.rec = null;
    if (was && emit) Bus.emit('run', { phase: 'abort' });
  },
  setSpeed(s) { const R = State.run; R.speed = s; if (R.timer) { clearInterval(R.timer); R.timer = null; this.play(); } }
};

/* ---------------- tiến độ (Free Exploration + Guided + Exam) ---------------- */
const TABS = ['know', 'sim', 'torch', 'quiz'];
const TAB_NAMES = { know: 'Kiến thức', sim: 'Mô phỏng', torch: 'PyTorch', quiz: 'Tự kiểm tra' };
const Progress = {
  d: { seen: {}, quiz: {}, guided: {}, exam: null },
  load() { const d = Store.get('progress', null); if (d && typeof d === 'object') this.d = Object.assign({ seen: {}, quiz: {}, guided: {}, exam: null }, d); },
  save() { Store.set('progress', this.d); Bus.emit('progress'); },
  seeTab(block, tab) { const s = this.d.seen[block] = this.d.seen[block] || {}; if (!s[tab]) { s[tab] = 1; this.save(); } },
  tabsSeen(block) { const s = this.d.seen[block] || {}; return TABS.filter(t => s[t]).length; },
  quizDone(block, qid, ok) { const q = this.d.quiz[block] = this.d.quiz[block] || {}; q[qid] = ok ? 1 : (q[qid] || 0); this.save(); },
  stats() {
    let items = 0, full = 0;
    for (const b of ORDER) { const n = this.tabsSeen(b); items += n; if (n === 4) full++; }
    return { items, total: ORDER.length * 4, full, blocks: ORDER.length };
  },
  guidedDone(lesson, sec) { const g = this.d.guided[lesson] = this.d.guided[lesson] || {}; if (!g[sec]) { g[sec] = 1; this.save(); } },
  guidedCount(lesson) { return Object.keys(this.d.guided[lesson] || {}).length; },
  reset() { this.d = { seen: {}, quiz: {}, guided: {}, exam: null }; this.save(); }
};

/* ---------------- điều hướng view ---------------- */
const App = {
  views: {}, cur: 'explore', inited: new Set(),
  registerView(id, o) { this.views[id] = o; },
  scroll: {},
  show(id, o = {}) {
    if (!this.views[id]) id = 'explore';
    Player.pauseAll();
    if (State.run.playing && id !== 'explore') Runner.pause();
    const prev = this.cur;
    if (prev !== id) this.scroll[prev] = window.scrollY;
    if (prev !== id && this.views[prev] && this.views[prev].onHide) this.views[prev].onHide();
    this.cur = id;
    $$('.navs button').forEach(b => { const on = b.dataset.view === id; b.classList.toggle('active', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
    $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + id));
    const V = this.views[id];
    if (V && !this.inited.has(id)) { this.inited.add(id); try { V.init(); } catch (e) { console.error(e); $('#view-' + id).insertAdjacentHTML('afterbegin', `<div class="alert bad">Lỗi khởi tạo: ${esc(e.message)}</div>`); } }
    if (V && V.onShow) V.onShow();
    $('#sbView').textContent = $(`.navs button[data-view="${id}"]`).textContent.replace(/^\S+\s/, '');

  }
};

/* ---------------- hộp thoại ---------------- */
const Modal = {
  last: null, cur: null,
  open(id) {
    const m = $('#' + id); this.last = document.activeElement; this.cur = m; m.classList.add('open');
    const f = m.querySelector('[data-autofocus]') || m.querySelector('button,input,select'); if (f) f.focus();
    document.addEventListener('keydown', this._key);
  },
  close(m) { m = m || this.cur; if (!m) return; m.classList.remove('open'); this.cur = null; document.removeEventListener('keydown', this._key); if (this.last && this.last.focus) this.last.focus(); },
  _key(e) {
    const m = Modal.cur; if (!m) return;
    if (e.key === 'Escape') { e.preventDefault(); Modal.close(m); return; }
    if (e.key !== 'Tab') return;
    const F = $$('button,input,select,textarea,a[href],[tabindex="0"]', m).filter(x => !x.disabled && x.offsetParent !== null);
    if (!F.length) return;
    const i = F.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); F[F.length - 1].focus(); }
    else if (!e.shiftKey && (i === F.length - 1 || i < 0)) { e.preventDefault(); F[0].focus(); }
  }
};

  $$('.navs button').forEach(b => b.addEventListener('click', () => App.show(b.dataset.view, { push: true })));
  window.addEventListener('popstate', e => { const v = (e.state && e.state.view) || (location.hash || '').slice(1); if (App.views[v] && v !== App.cur) App.show(v); });
  /* chiều cao thanh trên cùng → vị trí các phần tử dính (sticky), kể cả khi phóng chữ */
  const setTop = () => { const tb = $('.topbar'); const sticky = getComputedStyle(tb).position === 'sticky'; document.documentElement.style.setProperty('--toph', (sticky ? tb.offsetHeight : 0) + 'px'); document.documentElement.style.setProperty('--fscale', String(curFont() / 16)); };
  setTop(); window.addEventListener('resize', debounce(setTop, 100)); Bus.on('font', setTop);
  $('#themeBtn').addEventListener('click', () => {
    const t = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t); Store.set('theme', t);
    readColors(); Redraw.all(); Bus.emit('theme', t);
  });
  $('#fontUp').addEventListener('click', () => { const f = curFont(); const n = FONT_STEPS.find(x => x > f + 0.1); if (n) setFont(n); else toast('Đã ở cỡ chữ lớn nhất.', 'info'); Bus.emit('font'); });
  $('#fontDown').addEventListener('click', () => { const f = curFont(); const n = [...FONT_STEPS].reverse().find(x => x < f - 0.1); if (n) setFont(n); else toast('Đã ở cỡ chữ nhỏ nhất.', 'info'); Bus.emit('font'); });
  $('#legendBody').innerHTML = legendHTML();
  $('#legendBtn').addEventListener('click', () => Modal.open('legendModal'));
  $('#resetAllBtn').addEventListener('click', () => { $('#resetProgress').checked = false; Modal.open('resetModal'); });
  $('#resetConfirm').addEventListener('click', () => {
    const wipe = $('#resetProgress').checked;
    Modal.close($('#resetModal'));
    Runner.abort();
    Player.pauseAll();
    if (wipe) Progress.reset();
    State.sel = 'input'; State.tab = 'know';
    State.loadSample(SAMPLES[0].id);
    Bus.emit('reset', { wipe });
    toast(wipe ? 'Đã khôi phục mặc định và xóa tiến độ.' : 'Đã khôi phục mặc định (giữ tiến độ học).', 'ok');
  });
  $$('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) Modal.close(m); });
  });
  Bus.on('image', updateStatus); Bus.on('label', updateStatus); Bus.on('run', updateStatus); Bus.on('progress', updateStatus);
  updateStatus();
}

/* ===================== 10-diagram.js ===================== */
/* =====================================================================
   10-diagram.js — Khu vực 1: sơ đồ kiến trúc CNN bằng SVG.
   Mỗi khối vẽ tensor THẬT của Forward Pass hiện hành (từng channel), dây nối
   thể hiện kênh nào đi vào kênh nào, đường truy vết ô được chọn.
   ===================================================================== */
const Diagram = (() => {
  const VW = 1440, VH = 384, TOP = 30, BOT = 350, MID = 192;
  const WIDTH = { input: 96, conv1: 104, relu1: 96, pool1: 98, conv2: 98, relu2: 96, pool2: 98, flatten: 82, linear: 112, softmax: 140, pred: 116 };
  const GAP = 27;
  const X = {}; (() => { let x = 12; for (const id of ORDER) { X[id] = x; x += WIDTH[id] + GAP; } })();
  const CS = { 8: 8, 4: 8, 2: 8 };
  let svg = null, host = null, geo = {};

  const ns = 'http://www.w3.org/2000/svg';
  const num = v => (Math.round(v * 10) / 10);

  /* hình học các bản đồ của một khối dạng tensor [C][h][w] */
  function mapsGeo(id, C, h, w) {
    const cs = CS[h] || 8, mw = w * cs, mh = h * cs, g = C > 2 ? 8 : 12;
    const tot = C * mh + (C - 1) * g, y0 = MID - tot / 2, cx = X[id] + WIDTH[id] / 2 + 4;
    const maps = [];
    for (let c = 0; c < C; c++) maps.push({ x: cx - mw / 2, y: y0 + c * (mh + g), w: mw, h: mh, cs, rows: h, cols: w });
    return { kind: 'maps', maps, inA: maps.map(m => ({ x: m.x, y: m.y + m.h / 2 })), outA: maps.map(m => ({ x: m.x + m.w, y: m.y + m.h / 2 })) };
  }
  function flatGeo() {
    const id = 'flatten', cw = 14, ch = 8, cx = X[id] + WIDTH[id] / 2, cells = [];
    const tot = 16 * ch + 12 * 1 + 3 * 6; let y = MID - tot / 2;
    for (let k = 0; k < 16; k++) { cells.push({ x: cx - cw / 2, y, w: cw, h: ch }); y += ch + (k % 4 === 3 ? 6 : 1); }
    const groups = [0, 1, 2, 3].map(g => ({ x: cx - cw / 2, y: cells[g * 4].y + (cells[g * 4 + 3].y + ch - cells[g * 4].y) / 2 }));
    return { kind: 'flat', cells, inA: groups, outA: cells.map(c => ({ x: c.x + c.w, y: c.y + c.h / 2 })) };
  }
  function neuronGeo() {
    const id = 'linear', cx = X[id] + 34, r = 17;
    const ns3 = [0, 1, 2].map(k => ({ x: cx, y: MID + (k - 1) * 58, r }));
    return { kind: 'neur', ns: ns3, inA: ns3.map(n => ({ x: n.x - r, y: n.y })), outA: ns3.map(n => ({ x: n.x + r, y: n.y })) };
  }
  function barsGeo() {
    const id = 'softmax', x0 = X[id] + 52, bw = 74;
    const bars = [0, 1, 2].map(k => ({ x: x0, y: MID + (k - 1) * 58 - 7, w: bw, h: 14 }));
    return { kind: 'bars', bars, inA: bars.map(b => ({ x: X[id] + 6, y: b.y + 7 })), outA: bars.map(b => ({ x: b.x + b.w + 2, y: b.y + 7 })) };
  }
  function predGeo() { const id = 'pred', x = X[id] + 10, w = WIDTH[id] - 20, y = MID - 44, h = 88; return { kind: 'pred', box: { x, y, w, h }, inA: [{ x, y: MID }], outA: [] }; }
  function buildGeo() {
    geo = {
      input: mapsGeo('input', 1, 8, 8), conv1: mapsGeo('conv1', 2, 8, 8), relu1: mapsGeo('relu1', 2, 8, 8), pool1: mapsGeo('pool1', 2, 4, 4),
      conv2: mapsGeo('conv2', 4, 4, 4), relu2: mapsGeo('relu2', 4, 4, 4), pool2: mapsGeo('pool2', 4, 2, 2),
      flatten: flatGeo(), linear: neuronGeo(), softmax: barsGeo(), pred: predGeo()
    };
  }

  /* ---------- vẽ nội dung một khối ---------- */
  function cellFill(id, v, mx) {
    if (id === 'input') return rgbStr(imgColor(v));
    return rgbStr(valColor(v, mx));
  }
  function vizMaps(id, T, pending) {
    const G = geo[id]; let s = '';
    const mx = TN.maxAbs(T) || 1;
    G.maps.forEach((m, c) => {
      s += `<text class="chl" x="${m.x - 4}" y="${m.y + 9}" text-anchor="end">${G.maps.length > 1 ? c : ''}</text>`;
      if (pending) { s += `<rect class="mapbox pend" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="2"/>`; return; }
      for (let i = 0; i < m.rows; i++) for (let j = 0; j < m.cols; j++) {
        s += `<rect x="${m.x + j * m.cs}" y="${m.y + i * m.cs}" width="${m.cs}" height="${m.cs}" fill="${cellFill(id, T[c][i][j], mx)}"/>`;
      }
      s += `<rect class="mapbox" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" rx="1.5"/>`;
    });
    if (pending) s += `<text class="pendq" x="${X[id] + WIDTH[id] / 2}" y="${MID + 5}" text-anchor="middle">?</text>`;
    return s;
  }
  function vizFlat(v, pending) {
    const G = geo.flatten; let s = '';
    const mx = TN.maxAbs(v || [0]) || 1;
    G.cells.forEach((c, k) => {
      s += pending ? `<rect class="mapbox pend" x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}"/>` : `<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" fill="${rgbStr(valColor(v[k], mx))}" class="fcell"/>`;
      if (k % 4 === 0) s += `<text class="chl" x="${c.x - 4}" y="${c.y + 7}" text-anchor="end">${k}</text>`;
    });
    if (pending) s += `<text class="pendq" x="${X.flatten + WIDTH.flatten / 2}" y="${MID + 5}" text-anchor="middle">?</text>`;
    return s;
  }
  function vizNeur(z, pending) {
    const G = geo.linear; let s = '';
    const mx = Math.max(1, TN.maxAbs(z || [0]));
    G.ns.forEach((n, k) => {
      const col = pending ? null : rgbStr(valColor(z[k], mx));
      s += `<circle class="neur" cx="${n.x}" cy="${n.y}" r="${n.r}" ${col ? `style="fill:${col}"` : ''}/>`;
      s += `<text class="nval" x="${n.x}" y="${n.y + 4}" text-anchor="middle" ${col ? `style="fill:${textOn(valColor(z[k], mx))}"` : ''}>${pending ? '?' : fv(z[k], 2)}</text>`;
      s += `<text class="nlab" x="${n.x + n.r + 5}" y="${n.y - 3}">z${k}</text><text class="nlab2" x="${n.x + n.r + 5}" y="${n.y + 10}">${CLASSES[k].vi}</text>`;
    });
    return s;
  }
  function vizBars(p, pending, top) {
    const G = geo.softmax; let s = '';
    G.bars.forEach((b, k) => {
      s += `<text class="blab" x="${b.x - 4}" y="${b.y + 11}" text-anchor="end">${CLASSES[k].vi}</text>`;
      s += `<rect class="barbg" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="7"/>`;
      if (!pending) {
        s += `<rect class="barfg${k === top ? ' top' : ''}" x="${b.x}" y="${b.y}" width="${num(Math.max(0, p[k]) * b.w)}" height="${b.h}" rx="7"/>`;
        s += `<text class="bpct" x="${b.x}" y="${b.y + 28}">${(p[k] * 100).toFixed(1)}%${k === top ? ' ★' : ''}</text>`;
      } else s += `<text class="bpct" x="${b.x}" y="${b.y + 28}">?</text>`;
    });
    return s;
  }
  function vizPred(k, p, pending) {
    const b = geo.pred.box; let s = `<rect class="predbox${pending ? ' pend' : ''}" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="12"/>`;
    const cx = b.x + b.w / 2;
    if (pending) return s + `<text class="pendq" x="${cx}" y="${MID + 6}" text-anchor="middle">?</text>`;
    s += `<text class="pglyph" x="${cx}" y="${b.y + 32}" text-anchor="middle">${CLASSES[k].glyph}</text>`;
    s += `<text class="pname" x="${cx}" y="${b.y + 56}" text-anchor="middle">${CLASSES[k].vi}</text>`;
    s += `<text class="pidx" x="${cx}" y="${b.y + 74}" text-anchor="middle">lớp số ${k} · ${(p[k] * 100).toFixed(1)}%</text>`;
    const L = State.label;
    s += `<text class="plabel" x="${cx}" y="${b.y + b.h + 18}" text-anchor="middle">${L == null ? 'nhãn đúng: chưa có' : `nhãn đúng: ${CLASSES[L].vi} ${L === k ? '✓' : '✗'}`}</text>`;
    return s;
  }

  /* ---------- dây nối giữa các khối ---------- */
  function curve(a, b) { const mx = (a.x + b.x) / 2; return `M${num(a.x)},${num(a.y)} C${num(mx)},${num(a.y)} ${num(mx)},${num(b.y)} ${num(b.x - 2)},${num(b.y)}`; }
  function wires(from, to, rec) {
    const A = geo[from].outA, B = geo[to].inA, kind = BLOCK[to].kind;
    const st = edgeState(to);
    let s = '';
    if (kind === 'conv') { for (const a of A) for (const b of B) s += `<path class="wire ${st}" d="${curve(a, b)}" marker-end="url(#dgArr)"/>`; }
    else if (kind === 'flatten') { A.forEach((a, c) => { s += `<path class="wire ${st}" d="${curve(a, B[c])}" marker-end="url(#dgArr)"/>`; }); }
    else if (kind === 'linear') {
      A.forEach((a, i) => B.forEach((b, k) => {
        const w = NET.WL[k][i]; if (w === 0) return;
        s += `<path class="wire lw ${w < 0 ? 'neg' : 'posw'} ${st}" d="M${num(a.x)},${num(a.y)} L${num(b.x - 2)},${num(b.y)}" style="opacity:${st === 'pend' ? .15 : (0.25 + Math.abs(w) * 0.5)}"/>`;
      }));
    }
    else if (kind === 'pred') { const k = rec && rec.out.softmax ? TN.argmax(rec.out.softmax) : 0; s += `<path class="wire ${st}" d="${curve(A[k], B[0])}" marker-end="url(#dgArr)"/>`; }
    else { A.forEach((a, c) => { if (B[c]) s += `<path class="wire ${st}" d="${curve(a, B[c])}" marker-end="url(#dgArr)"/>`; }); }
    return s;
  }
  function edgeState(to) {
    const R = State.run; if (!R.active) return 'ok';
    const idx = BLOCK[to].idx;
    if (idx <= R.rec.done) return idx === R.rec.done ? 'flow' : 'ok';
    return 'pend';
  }

  /* ---------- dựng khung một lần ---------- */
  function build(h) {
    host = h; buildGeo();
    svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`); svg.setAttribute('class', 'dg');
    svg.setAttribute('role', 'group'); svg.setAttribute('aria-label', 'Sơ đồ kiến trúc CNN: 11 khối từ ảnh đầu vào đến lớp dự đoán. Dùng Tab để chọn khối.');
    let s = `<defs><marker id="dgArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrhead"/></marker>
      <marker id="dgArrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrhead t"/></marker></defs>`;
    s += `<g class="wires"></g>`;
    for (const b of BLOCKS) {
      const x = X[b.id], w = WIDTH[b.id];
      s += `<g class="blk c-${b.col}" data-id="${b.id}" tabindex="0" role="button" aria-label="${esc(b.name)}: ${esc(b.vi)}, output ${shapeStr(b.outShape)}. Nhấn Enter để xem chi tiết.">
        <title>${esc(b.name)} — ${esc(b.vi)} (nhấp để xem chi tiết)</title>
        <rect class="frame" x="${x}" y="${TOP}" width="${w}" height="${BOT - TOP}" rx="12"/>
        <rect class="strip" x="${x}" y="${TOP}" width="${w}" height="5" rx="2"/>
        <text class="bt" x="${x + w / 2}" y="${TOP + 22}" text-anchor="middle">${esc(b.name.replace(' → Logits', ''))}</text>
        <text class="bs" x="${x + w / 2}" y="${TOP + 37}" text-anchor="middle">${esc(b.id === 'linear' ? '16 → 3 · logits' : b.op)}</text>
        <g class="viz"></g>
        <text class="bin" x="${x + w / 2}" y="${BOT - 38}" text-anchor="middle">${b.inShape ? 'vào ' + b.inShape.join('×') : 'vào: ảnh 8×8'}</text>
        <text class="bsh" x="${x + w / 2}" y="${BOT - 24}" text-anchor="middle">ra ${b.outShape.join('×')}</text>
        <text class="bch" x="${x + w / 2}" y="${BOT - 10}" text-anchor="middle">${chText(b)}</text>
        <g class="seenb"><title>Số tab đã xem / 4</title><rect x="${x + w / 2 - 19}" y="${BOT + 6}" width="38" height="16" rx="8"/><text class="seen" x="${x + w / 2}" y="${BOT + 18}" text-anchor="middle"></text></g>
        <text class="selmark" x="${x + w / 2}" y="${TOP - 8}" text-anchor="middle">▼ đang chọn</text>
        <text class="runmark" x="${x + w / 2}" y="${BOT + 20}" text-anchor="middle"></text>
      </g>`;
    }
    s += `<g class="trace"></g>`;
    svg.innerHTML = s;
    host.append(svg);
    $$('.blk', svg).forEach(g => {
      g.addEventListener('click', () => State.select(g.dataset.id));
      g.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); State.select(g.dataset.id); }
        else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          e.preventDefault(); const i = BLOCK[g.dataset.id].idx + (e.key === 'ArrowRight' ? 1 : -1);
          const id = ORDER[clamp(i, 0, ORDER.length - 1)]; State.select(id); const n = svg.querySelector(`.blk[data-id="${id}"]`); n.focus(); scrollIntoViewX(n);
        }
      });
    });
    update();
  }
  function chText(b) {
    if (b.kind === 'flatten') return '16 phần tử';
    if (b.kind === 'linear') return '3 logits';
    if (b.kind === 'softmax') return '3 xác suất';
    if (b.kind === 'pred') return '1 chỉ số lớp';
    return `C = ${b.outShape[1]} kênh`;
  }
  function scrollIntoViewX(node) {
    const wrap = host; if (!wrap || wrap.scrollWidth <= wrap.clientWidth) return;
    const r = node.getBoundingClientRect(), hr = wrap.getBoundingClientRect();
    if (r.left < hr.left || r.right > hr.right) wrap.scrollLeft += (r.left + r.width / 2) - (hr.left + hr.width / 2);
  }

  /* ---------- cập nhật theo dữ liệu / lựa chọn / tiến trình chạy ---------- */
  function update() {
    if (!svg) return;
    const rec = State.rec(), R = State.run;
    for (const b of BLOCKS) {
      const g = svg.querySelector(`.blk[data-id="${b.id}"]`), viz = g.querySelector('.viz');
      const pend = !State.avail(b.id);
      let s = '';
      if (b.kind === 'flatten') s = vizFlat(pend ? null : rec.out.flatten, pend);
      else if (b.kind === 'linear') s = vizNeur(pend ? null : rec.out.linear, pend);
      else if (b.kind === 'softmax') s = vizBars(pend ? null : rec.out.softmax, pend, pend ? -1 : TN.argmax(rec.out.softmax));
      else if (b.kind === 'pred') s = vizPred(pend ? 0 : rec.out.pred, pend ? null : rec.out.softmax, pend);
      else s = vizMaps(b.id, pend ? null : rec.out[b.id], pend);
      viz.innerHTML = s;
      g.classList.toggle('pending', pend);
      const sh = pend ? null : Net.shapeOf(b.id, rec), prv = Net.prevOf(b.id), shIn = prv && State.avail(prv) ? Net.shapeOf(prv, rec) : null;
      g.querySelector('.bsh').textContent = sh ? 'ra ' + sh.join('×') : 'ra ? (chưa tính)';
      if (prv) g.querySelector('.bin').textContent = shIn ? 'vào ' + shIn.join('×') : 'vào ?';
      const active = R.active && R.rec.done === b.idx;
      g.classList.toggle('active', active);
      g.querySelector('.runmark').textContent = R.active ? (active ? '● vừa tính' : (pend ? 'chờ' : '✓ đã tính')) : '';
    }
    svg.classList.toggle('running', R.active);
    let w = '';
    for (let i = 1; i < ORDER.length; i++) w += wires(ORDER[i - 1], ORDER[i], rec);
    svg.querySelector('.wires').innerHTML = w;
    updateSel(); updateSeen(); updateTrace();
  }
  function updateSel() {
    if (!svg) return;
    $$('.blk', svg).forEach(g => { const on = g.dataset.id === State.sel; g.classList.toggle('sel', on); g.setAttribute('aria-pressed', String(on)); });
  }
  function updateSeen() {
    if (!svg) return;
    $$('.blk', svg).forEach(g => {
      const n = Progress.tabsSeen(g.dataset.id), t = g.querySelector('.seen'), sb = g.querySelector('.seenb');
      t.textContent = n === 4 ? '✓ 4/4' : (n ? `${n}/4` : '');
      sb.classList.toggle('full', n === 4); sb.classList.toggle('none', n === 0);
    });
  }
  /* đường truy vết: ô được chọn ở khối hiện tại ← các ô đầu vào ở khối liền trước */
  function cellBox(id, c, i, j) {
    const G = geo[id];
    if (G.kind === 'maps') { const m = G.maps[c]; if (!m) return null; return { x: m.x + j * m.cs, y: m.y + i * m.cs, w: m.cs, h: m.cs }; }
    if (G.kind === 'flat') { const cl = G.cells[j]; return cl ? { x: cl.x, y: cl.y, w: cl.w, h: cl.h } : null; }
    if (G.kind === 'neur') { const n = G.ns[j]; return n ? { x: n.x - n.r, y: n.y - n.r, w: 2 * n.r, h: 2 * n.r } : null; }
    if (G.kind === 'bars') { const b = G.bars[j]; return b ? { x: b.x, y: b.y, w: b.w, h: b.h } : null; }
    if (G.kind === 'pred') return G.box;
    return null;
  }
  function updateTrace() {
    if (!svg) return;
    const g = svg.querySelector('.trace'); let s = '';
    const t = State.trace;
    if (t && t.block === State.sel && State.avail(t.block)) {
      const out = cellBox(t.block, t.c, t.i, t.j);
      const prev = Net.prevOf(t.block);
      if (out) {
        s += `<rect class="tr-out" x="${out.x - 1.5}" y="${out.y - 1.5}" width="${out.w + 3}" height="${out.h + 3}" rx="2"/>`;
        if (prev) {
          const src = Net.sources(t.block, t.c, t.i, t.j);
          /* gom theo kênh để vẽ một khung bao cho mỗi kênh */
          const byC = {};
          for (const [c, i, j] of src) { const bx = cellBox(prev, c, i, j); if (!bx) continue; s += `<rect class="tr-src" x="${bx.x}" y="${bx.y}" width="${bx.w}" height="${bx.h}"/>`; const k = BLOCK[prev].kind === 'flatten' || BLOCK[prev].kind === 'linear' || BLOCK[prev].kind === 'softmax' ? 'v' : c; (byC[k] = byC[k] || []).push(bx); }
          for (const k in byC) {
            const L = byC[k], x0 = Math.min(...L.map(b => b.x)), y0 = Math.min(...L.map(b => b.y)), x1 = Math.max(...L.map(b => b.x + b.w)), y1 = Math.max(...L.map(b => b.y + b.h));
            s += `<rect class="tr-box" x="${x0 - 1.5}" y="${y0 - 1.5}" width="${x1 - x0 + 3}" height="${y1 - y0 + 3}" rx="2"/>`;
            s += `<path class="tr-line" d="M${num(out.x)},${num(out.y + out.h / 2)} L${num(x1 + 2)},${num((y0 + y1) / 2)}" marker-end="url(#dgArrT)"/>`;
          }
        }
      }
    }
    g.innerHTML = s;
  }

  Bus.on('image', update); Bus.on('run', update); Bus.on('label', update); Bus.on('theme', update);
  Bus.on('select', () => { updateSel(); updateTrace(); const n = svg && svg.querySelector(`.blk[data-id="${State.sel}"]`); if (n) scrollIntoViewX(n); });
  Bus.on('progress', updateSeen); Bus.on('trace', updateTrace);
  return { build, update, geo: () => geo, X, WIDTH };
})();

/* ===================== 11-explore.js ===================== */
/* =====================================================================
   11-explore.js — view "Tự khám phá": tiến độ, Khu vực 1 (ảnh vào, chạy toàn mạng,
   sơ đồ, bảng shape), ghép Khu vực 2 (Panel) và Khu vực 3 (Tracker).
   ===================================================================== */
const Explore = (() => {
  let root, sel, prev, runBtn, statusEl, shapeBody, progBar, progTxt, labelChip, followChk, speedIn;

  function sampleOptions() {
    const groups = [['Ngang', 0], ['Dọc', 1], ['Chéo', 2], ['Ảnh đặc biệt (không thuộc 3 lớp)', null]];
